<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Login | B.Com. Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:26px 16px;text-align:center}.header h1{margin:0;font-size:27px}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:460px;margin:36px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:25px}.card h2{margin-top:0;text-align:center}label{display:block;font-weight:700;font-size:14px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.secondary{background:#fff;color:var(--accent);border:1px solid #bfdbfe;margin-top:10px}.message{margin-top:14px;font-size:14px;line-height:1.5}.success{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:12px;color:#065f46}.error{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:12px;color:#9a3412}.switch{text-align:center;margin-top:18px;font-size:14px}.switch a{color:var(--accent);font-weight:700;text-decoration:none}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-activity1"></script></head><body><div class="header"><h1>B.Com. Video Learning Portal</h1><p>Student Login</p></div><div class="wrap"><div class="card"><h2>Login</h2><div id="topMessage" class="message"></div><form id="loginForm"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6"><button type="submit">LOGIN</button><button id="resendBtn" class="secondary" type="button" style="display:none">RESEND CONFIRMATION EMAIL</button><div id="message" class="message"></div></form><div class="switch">New student? <a href="register.html">Create an account</a></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const params=new URLSearchParams(window.location.search);const topMessage=document.getElementById('topMessage');if(params.get('confirmed')==='1'){topMessage.className='message success';topMessage.innerHTML='<strong>Email confirmed successfully.</strong><br>You can now login to access the learning portal.';}getCurrentUser().then(user=>{if(user)window.location.href='dashboard.html';});const resendBtn=document.getElementById('resendBtn');document.getElementById('loginForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');m.className='message';resendBtn.style.display='none';m.textContent='Signing in...';const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const {error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){if((error.message||'').toLowerCase().includes('email not confirmed')){m.className='message error';m.innerHTML='<strong>Your email is not confirmed yet.</strong><br>Please open the confirmation email sent to you and click the verification link. If needed, use the button below to resend it.';resendBtn.style.display='block';}else{m.className='message error';m.textContent=error.message;}return;}await recordActivity('login','student');window.location.href='dashboard.html';});resendBtn.addEventListener('click',async()=>{const m=document.getElementById('message');const email=document.getElementById('email').value.trim();if(!email){m.className='message error';m.textContent='Please enter your email address first.';return;}resendBtn.disabled=true;m.className='message';m.textContent='Sending confirmation email...';const redirectUrl=window.location.origin+'/login.html?confirmed=1';const {error}=await supabaseClient.auth.resend({type:'signup',email,options:{emailRedirectTo:redirectUrl}});resendBtn.disabled=false;if(error){m.className='message error';m.textContent=error.message;return;}m.className='message success';m.innerHTML='Confirmation email sent. Please check your inbox and Spam/Junk folder.';});</script></body></html>
