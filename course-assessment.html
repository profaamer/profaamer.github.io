<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Self-Assessment | Commerce and Management Learning</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.header{background:#111827;color:#fff;padding:26px 16px;text-align:center}.wrap{max-width:900px;margin:26px auto;padding:0 16px}.back{color:#1d4ed8;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:22px;margin-top:16px}.scheme{background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;line-height:1.6}.module{display:block;padding:14px;border:1px solid #e5e7eb;border-left:5px solid #b45309;border-radius:9px;margin-top:10px;background:#f8fafc;text-decoration:none;color:#1f2937}.module:hover{background:#fff7ed}.module strong{display:block}.module span{color:#6b7280;font-size:13px}.module.locked{border-left-color:#94a3b8;background:#f8fafc;cursor:not-allowed}.module.locked:hover{background:#f8fafc}.footer{text-align:center;padding:28px;color:#6b7280;font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260821-assignment-publish1"></script></head><body style="visibility:hidden"><div class="header"><h1>Quadrant IV — Self-Assessment</h1><p id="courseTitle">Loading...</p></div><div class="wrap"><a id="back" class="back" href="#">← Course Home</a><div id="main" class="box">Loading...</div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pub(c,n){return !!(c.assignment_publish_state&&c.assignment_publish_state[String(n)]===true)}async function load(){const user=await requireAuth();if(!user)return;if(!key){location.replace('my-courses.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',user.id).eq('course_key',key).maybeSingle();if(!en||!['active','completed'].includes(en.status)){location.replace('course-info.html?course='+encodeURIComponent(key));return}const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(!c){main.textContent='Course unavailable.';document.body.style.visibility='visible';return}const {data:mods}=await supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('module_no');courseTitle.textContent=c.title;back.href='course.html?course='+encodeURIComponent(key);const count=Math.min(Number(c.assignment_count||c.module_count||0),(mods||[]).length);const per=Number(c.assignment_marks_each||0),qs=Number(c.assignment_questions||0),total=Number(c.ca_marks||0),pass=Number(c.ca_pass_percent||40);const rows=(mods||[]).slice(0,count).map(m=>pub(c,m.module_no)?'<a class="module" href="course-module-assignment.html?course='+encodeURIComponent(key)+'&module='+m.module_no+'"><strong>Module '+m.module_no+' Assignment — '+per+' Marks</strong><span>'+esc(m.module_title)+' • '+qs+' random MCQs • No time limit • OPEN ASSIGNMENT →</span></a>':'<div class="module locked"><strong>Module '+m.module_no+' Assignment — Not Yet Published</strong><span>'+esc(m.module_title)+' • This assignment will become available when the Course Content Creator publishes it.</span></div>').join('');main.innerHTML='<div class="scheme"><strong>Continuous Assessment: '+total+' Marks</strong><br>'+count+' module-end MCQ assignment(s) × '+per+' marks each.<br>Each assignment contains '+qs+' random MCQs. No time limit.<br><strong>Only one official attempt per module.</strong><br><strong>Passing requirement: Minimum '+pass+'% in CA.</strong></div><p>Assignments become available when published by the Course Content Creator.</p>'+(rows||'<p>No assignments configured.</p>');document.body.style.visibility='visible'}load();</script></body></html>
