<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--purple:#7c3aed;--head:#111827;--danger:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.header h1{margin:0}.header p{color:#d1d5db}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-weight:700}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.section h2{margin:0 0 14px;font-size:19px}.econtent h2{color:var(--accent)}.mooc h2{color:var(--purple)}.coursecard{display:flex;align-items:center;gap:12px;padding:14px 15px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.title{font-weight:700;flex:1;min-width:0}.meta{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.actions{display:flex;gap:8px;flex-shrink:0}.openbtn,.unenrolbtn{text-align:center;padding:9px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}.openbtn{background:#fff;color:var(--accent);border:1px solid #bfdbfe;text-decoration:none}.unenrolbtn{background:#fff;color:var(--danger);border:1px solid #fecaca}.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:560px){.coursecard{align-items:flex-start;flex-direction:column}.actions{width:100%}.openbtn,.unenrolbtn{flex:1}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-dynmy1"></script></head><body><div class="header"><h1>My Courses</h1><p>Courses you have enrolled for</p></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="section econtent"><h2>🎓 E-Content Courses</h2><div id="econtentList"><div class="empty">Loading...</div></div></div><div class="section mooc"><h2>🌐 MOOC Courses</h2><div id="moocList"><div class="empty">Loading...</div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let currentUser=null,courseMap=new Map();const legacyHome={'direct-taxes-law-practice-1':'direct-tax-course.html'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function url(k){return legacyHome[k]||`course.html?course=${encodeURIComponent(k)}`}function renderCourse(x){const c=courseMap.get(x.course_key)||{title:x.course_key,course_code:'',programme:''};return `<div class="coursecard"><div class="title">${esc(c.title)}<span class="meta">${esc(c.course_code||'')} ${c.programme?'• '+esc(c.programme):''}</span></div><div class="actions"><a class="openbtn" href="${url(x.course_key)}">OPEN COURSE</a><button class="unenrolbtn" onclick="unenrolCourse('${esc(x.course_key)}','${esc(c.title).replace(/'/g,"\\'")}')">UNENROL</button></div></div>`}async function loadCourses(){const user=await requireAuth();if(!user)return;currentUser=user;const {data:enrol,error}=await supabaseClient.from('course_enrollments').select('course_key,course_type,status,enrolled_at').eq('user_id',user.id).eq('status','active').order('enrolled_at',{ascending:false});const ebox=econtentList,mbox=moocList;if(error){ebox.innerHTML=mbox.innerHTML='<div class="empty">Unable to load courses.</div>';return}const keys=[...new Set((enrol||[]).map(x=>x.course_key))];if(keys.length){const {data:courses}=await supabaseClient.from('courses').select('course_key,title,course_code,programme,category,is_published').in('course_key',keys);courseMap=new Map((courses||[]).map(c=>[c.course_key,c]))}const e=(enrol||[]).filter(x=>(courseMap.get(x.course_key)?.category||x.course_type)==='econtent'),m=(enrol||[]).filter(x=>(courseMap.get(x.course_key)?.category||x.course_type)==='mooc');ebox.innerHTML=e.length?e.map(renderCourse).join(''):'<div class="empty">No E-Content course enrolled yet.</div>';mbox.innerHTML=m.length?m.map(renderCourse).join(''):'<div class="empty">No MOOC course enrolled yet.</div>'}async function unenrolCourse(courseKey,courseTitle){if(!currentUser)return;if(!confirm('Unenrol from '+courseTitle+'?\n\nThe course will be removed from My Courses. Your previous academic records will be preserved.'))return;const {error}=await supabaseClient.from('course_enrollments').update({status:'withdrawn'}).eq('user_id',currentUser.id).eq('course_key',courseKey);if(error){alert('Unable to unenrol. Please try again.');return}await loadCourses()}loadCourses();</script></body></html>
