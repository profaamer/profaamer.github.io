<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses | Digital Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--danger:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.header h1{margin:0}.header p{color:#d1d5db}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.coursecard{padding:15px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.title{color:var(--accent);font-weight:700;text-decoration:none}.type{font-size:12px;color:var(--muted);white-space:nowrap}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.openbtn,.unenrolbtn{padding:9px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}.openbtn{background:#fff;color:var(--accent);border:1px solid #bfdbfe;text-decoration:none}.unenrolbtn{background:#fff;color:var(--danger);border:1px solid #fecaca}.unenrolbtn:hover{background:#fef2f2}.empty{color:var(--muted);text-align:center;padding:28px}.msg{margin-top:12px;font-size:13px;color:var(--muted)}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:600px){.top{align-items:flex-start;flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><h1>My Courses</h1><p>Courses you have enrolled for</p></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="box" id="list"><div class="empty">Loading your enrolled courses...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>const catalogue={'direct-taxes-law-practice-1':{title:'Direct Taxes Law & Practice-I',url:'direct-tax-course.html'}};let currentUser=null;async function loadCourses(){const user=await requireAuth();if(!user)return;currentUser=user;const {data,error}=await supabaseClient.from('course_enrollments').select('course_key,course_type,status,enrolled_at').eq('user_id',user.id).eq('status','active').order('enrolled_at',{ascending:false});const box=document.getElementById('list');if(error){box.innerHTML='<div class="empty">Unable to load courses.</div>';return}if(!data||!data.length){box.innerHTML='<div class="empty">You have not enrolled in any course yet.<br><br>Explore E-Content Courses or MOOC Courses from the dashboard.</div>';return}box.innerHTML=data.map(x=>{const c=catalogue[x.course_key]||{title:x.course_key,url:'#'};return '<div class="coursecard"><div class="top"><a class="title" href="'+c.url+'">'+c.title+'</a><span class="type">'+(x.course_type==='mooc'?'MOOC':'E-CONTENT')+'</span></div><div class="actions"><a class="openbtn" href="'+c.url+'">OPEN COURSE</a><button class="unenrolbtn" onclick="unenrolCourse(\''+x.course_key+'\',\''+c.title.replace(/'/g,"\\'")+'\')">UNENROL</button></div></div>'}).join('')}
async function unenrolCourse(courseKey,courseTitle){if(!currentUser)return;const ok=confirm('Unenrol from '+courseTitle+'?\n\nThe course will be removed from My Courses. Your previous academic records will be preserved.');if(!ok)return;const {error}=await supabaseClient.from('course_enrollments').update({status:'withdrawn'}).eq('user_id',currentUser.id).eq('course_key',courseKey);if(error){alert('Unable to unenrol. Please try again.');return}alert('You have been unenrolled from '+courseTitle+'.');await loadCourses()}
loadCourses();</script></body></html>
