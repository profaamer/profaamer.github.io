<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses | Digital Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.header h1{margin:0}.header p{color:#d1d5db}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}.course{display:block;padding:15px;margin-top:10px;border:1px solid var(--line);border-radius:9px;text-decoration:none;color:var(--accent);font-weight:700;background:#f8fafc}.empty{color:var(--muted);text-align:center;padding:28px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><h1>My Courses</h1><p>Courses you have enrolled for</p></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="box" id="list"><div class="empty">Loading your enrolled courses...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>const catalogue={'direct-taxes-law-practice-1':{title:'Direct Taxes Law & Practice-I',url:'direct-tax-course.html'}};(async()=>{const user=await requireAuth();if(!user)return;const {data,error}=await supabaseClient.from('course_enrollments').select('course_key,course_type,status,enrolled_at').eq('user_id',user.id).eq('status','active').order('enrolled_at',{ascending:false});const box=document.getElementById('list');if(error){box.innerHTML='<div class="empty">Unable to load courses.</div>';return}if(!data||!data.length){box.innerHTML='<div class="empty">You have not enrolled in any course yet.<br><br>Explore E-Content Courses or MOOC Courses from the dashboard.</div>';return}box.innerHTML=data.map(x=>{const c=catalogue[x.course_key];return c?'<a class="course" href="'+c.url+'">'+c.title+' <span style="float:right;font-size:12px;color:#6b7280">'+(x.course_type==='mooc'?'MOOC':'E-CONTENT')+'</span></a>':'<div class="course">'+x.course_key+'</div>'}).join('')})();</script></body></html>
