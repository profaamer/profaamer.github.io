<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--purple:#7c3aed;--head:#111827;--danger:#b91c1c;--green:#166534;--greenbg:#dcfce7;--amber:#92400e;--amberbg:#fef3c7}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-weight:700}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.section h2{margin:0 0 14px;font-size:19px}.econtent h2{color:var(--accent)}.mooc h2{color:var(--purple)}.coursecard{display:flex;align-items:center;gap:12px;padding:14px 15px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.coursecard.completed{border-color:#bbf7d0;background:#f0fdf4}.title{font-weight:700;flex:1;min-width:0}.meta{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.statusline{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:800}.completeBadge{background:var(--greenbg);color:var(--green)}.eligibleBadge{background:#ede9fe;color:#6d28d9}.notPassedBadge{background:var(--amberbg);color:var(--amber)}.scoreline{font-size:11px;color:var(--muted);font-weight:600}.actions{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}.openbtn,.scorebtn,.unenrolbtn,.lockedbtn{text-align:center;padding:9px 12px;border-radius:8px;font-weight:700;font-size:12px;white-space:nowrap}.openbtn{background:#fff;color:var(--accent);border:1px solid #bfdbfe;text-decoration:none}.scorebtn{background:#fff;color:#6d28d9;border:1px solid #ddd6fe;text-decoration:none}.unenrolbtn{background:#fff;color:var(--danger);border:1px solid #fecaca;cursor:pointer}.lockedbtn{background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;cursor:not-allowed}.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:650px){.coursecard{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-start}.openbtn,.scorebtn,.unenrolbtn,.lockedbtn{flex:1}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-mooc-cert1"></script></head><body><div class="header"><div class="headin"><h1>My Courses</h1><p>Courses you have enrolled for</p></div></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="section econtent"><h2>🎓 E-Content Courses</h2><div id="econtentList"><div class="empty">Loading...</div></div></div><div class="section mooc"><h2>🌐 MOOC Courses</h2><div id="moocList"><div class="empty">Loading...</div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let currentUser=null,courseMap=new Map(),progressMap=new Map();function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function url(k){return `course.html?course=${encodeURIComponent(k)}`}function scoreUrl(k){return `course-scorecard.html?course=${encodeURIComponent(k)}`}function fmt(n){const x=Number(n);return Number.isInteger(x)?String(x):String(Number(x.toFixed(2)))}async function courseProgress(userId,c){const required=Number(c.assignment_count||c.module_count||0);const [{data:a},{data:e}]=await Promise.all([supabaseClient.from('assignment_attempts').select('module_no,status,score,submitted_at').eq('user_id',userId).eq('course_key',c.course_key),supabaseClient.from('final_exam_attempts').select('status,score,submitted_at').eq('user_id',userId).eq('course_key',c.course_key).maybeSingle()]);const latest=new Map();(a||[]).forEach(x=>{const old=latest.get(Number(x.module_no));if(!old||String(x.submitted_at||'')>String(old.submitted_at||''))latest.set(Number(x.module_no),x)});let ca=0,done=0;for(let i=1;i<=required;i++){const x=latest.get(i);if(x&&x.status==='submitted'){done++;ca+=Number(x.score||0)}}const caComplete=required>0&&done===required,caPass=caComplete&&ca>=Number(c.ca_marks||0)*.4,eseDone=!!e&&['submitted','expired'].includes(e.status),ese=eseDone?Number(e.score||0):null,esePass=eseDone&&ese>=Number(c.ese_marks||0)*.4,assessed=(a||[]).length>0||!!e,complete=caPass&&esePass,total=caComplete&&eseDone?ca+ese:null,assessmentFinished=caComplete&&eseDone;return{ca,ese,caComplete,eseDone,caPass,esePass,assessed,complete,total,assessmentFinished,certificateEligible:complete&&c.category==='mooc'&&!!c.certificate_enabled}}function renderCourse(x){const c=courseMap.get(x.course_key)||{title:x.course_key,course_code:'',programme:''},p=progressMap.get(x.course_key)||{};let status='';if(p.complete){status=`<div class="statusline"><span class="badge completeBadge">✓ COURSE COMPLETED</span>${p.certificateEligible?'<span class="badge eligibleBadge">CERTIFICATE ELIGIBLE</span>':''}<span class="scoreline">${fmt(p.total)} / ${fmt(Number(c.ca_marks||0)+Number(c.ese_marks||0))} • Passed</span></div>`}else if(p.assessmentFinished){status=`<div class="statusline"><span class="badge notPassedBadge">ASSESSMENT COMPLETED • NOT PASSED</span><span class="scoreline">${fmt(p.total)} / ${fmt(Number(c.ca_marks||0)+Number(c.ese_marks||0))}</span></div>`}else if(p.assessed){status='<div class="statusline"><span class="scoreline">Assessment in progress</span></div>'}const unenrol=p.assessed?'<button class="lockedbtn" title="Unenrolment is disabled after an assessment has been attempted." disabled>UNENROL LOCKED</button>':`<button class="unenrolbtn" onclick="unenrolCourse('${esc(x.course_key)}','${esc(c.title).replace(/'/g,"\\'")}')">UNENROL</button>`;return `<div class="coursecard ${p.complete?'completed':''}"><div class="title">${esc(c.title)}<span class="meta">${esc(c.course_code||'')} ${c.programme?'• '+esc(c.programme):''}</span>${status}</div><div class="actions"><a class="openbtn" href="${url(x.course_key)}">OPEN COURSE</a>${p.assessed?`<a class="scorebtn" href="${scoreUrl(x.course_key)}">VIEW SCORECARD</a>`:''}${unenrol}</div></div>`}async function loadCourses(){const user=await requireAuth();if(!user)return;currentUser=user;const {data:enrol,error}=await supabaseClient.from('course_enrollments').select('course_key,course_type,status,enrolled_at').eq('user_id',user.id).eq('status','active').order('enrolled_at',{ascending:false});const ebox=econtentList,mbox=moocList;if(error){ebox.innerHTML=mbox.innerHTML='<div class="empty">Unable to load courses.</div>';return}const keys=[...new Set((enrol||[]).map(x=>x.course_key))];if(keys.length){const {data:courses}=await supabaseClient.from('courses').select('course_key,title,course_code,programme,category,is_published,assignment_count,module_count,ca_marks,ese_marks,certificate_enabled').in('course_key',keys);courseMap=new Map((courses||[]).map(c=>[c.course_key,c]));for(const c of courses||[])progressMap.set(c.course_key,await courseProgress(user.id,c))}const e=(enrol||[]).filter(x=>(courseMap.get(x.course_key)?.category||x.course_type)==='econtent'),m=(enrol||[]).filter(x=>(courseMap.get(x.course_key)?.category||x.course_type)==='mooc');ebox.innerHTML=e.length?e.map(renderCourse).join(''):'<div class="empty">No E-Content course enrolled yet.</div>';mbox.innerHTML=m.length?m.map(renderCourse).join(''):'<div class="empty">No MOOC course enrolled yet.</div>'}async function unenrolCourse(courseKey,courseTitle){if(!currentUser)return;const p=progressMap.get(courseKey);if(p?.assessed){alert('Unenrolment is disabled after an assessment has been attempted. Your academic record remains attached to this course.');return}if(!confirm('Unenrol from '+courseTitle+'?\n\nThe course will be removed from My Courses.'))return;const {error}=await supabaseClient.from('course_enrollments').update({status:'withdrawn'}).eq('user_id',currentUser.id).eq('course_key',courseKey);if(error){alert('Unable to unenrol. Please try again.');return}await loadCourses()}loadCourses();</script></body></html>
