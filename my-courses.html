<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Courses | Digital Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--purple:#7c3aed;--head:#111827;--danger:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.header h1{margin:0}.header p{color:#d1d5db}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{display:inline-block;margin-bottom:16px;color:var(--accent);text-decoration:none;font-weight:700}.section{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:18px}.section h2{margin:0 0 14px;font-size:19px}.econtent h2{color:var(--accent)}.mooc h2{color:var(--purple)}.coursecard{display:flex;align-items:center;gap:12px;padding:14px 15px;margin-top:10px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.title{font-weight:700;flex:1;min-width:0}.actions{display:flex;gap:8px;flex-shrink:0}.openbtn,.unenrolbtn{text-align:center;padding:9px 12px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer;white-space:nowrap}.openbtn{background:#fff;color:var(--accent);border:1px solid #bfdbfe;text-decoration:none}.unenrolbtn{background:#fff;color:var(--danger);border:1px solid #fecaca}.unenrolbtn:hover{background:#fef2f2}.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:560px){.coursecard{gap:7px;padding:11px}.title{font-size:13px}.openbtn,.unenrolbtn{padding:8px 7px;font-size:10px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><h1>My Courses</h1><p>Courses you have enrolled for</p></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="section econtent"><h2>🎓 E-Content Courses</h2><div id="econtentList"><div class="empty">Loading...</div></div></div><div class="section mooc"><h2>🌐 MOOC Courses</h2><div id="moocList"><div class="empty">Loading...</div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>const catalogue={'direct-taxes-law-practice-1':{title:'Direct Taxes Law & Practice-I',url:'direct-tax-course.html'}};let currentUser=null;function renderCourse(x){const c=catalogue[x.course_key]||{title:x.course_key,url:'#'};return '<div class="coursecard"><div class="title">'+c.title+'</div><div class="actions"><a class="openbtn" href="'+c.url+'">OPEN COURSE</a><button class="unenrolbtn" onclick="unenrolCourse(\''+x.course_key+'\',\''+c.title.replace(/'/g,"\\'")+'\')">UNENROL</button></div></div>'}
async function loadCourses(){const user=await requireAuth();if(!user)return;currentUser=user;const {data,error}=await supabaseClient.from('course_enrollments').select('course_key,course_type,status,enrolled_at').eq('user_id',user.id).eq('status','active').order('enrolled_at',{ascending:false});const ebox=document.getElementById('econtentList'),mbox=document.getElementById('moocList');if(error){ebox.innerHTML=mbox.innerHTML='<div class="empty">Unable to load courses.</div>';return}const e=(data||[]).filter(x=>x.course_type==='econtent'),m=(data||[]).filter(x=>x.course_type==='mooc');ebox.innerHTML=e.length?e.map(renderCourse).join(''):'<div class="empty">No E-Content course enrolled yet.</div>';mbox.innerHTML=m.length?m.map(renderCourse).join(''):'<div class="empty">No MOOC course enrolled yet.</div>'}
async function unenrolCourse(courseKey,courseTitle){if(!currentUser)return;const ok=confirm('Unenrol from '+courseTitle+'?\n\nThe course will be removed from My Courses. Your previous academic records will be preserved.');if(!ok)return;const {error}=await supabaseClient.from('course_enrollments').update({status:'withdrawn'}).eq('user_id',currentUser.id).eq('course_key',courseKey);if(error){alert('Unable to unenrol. Please try again.');return}await loadCourses()}
loadCourses();</script></body></html>
