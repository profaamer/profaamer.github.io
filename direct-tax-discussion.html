<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Direct Tax | Discussion Forum</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--soft:#f8fafc;--green:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:26px 16px;text-align:center}.header h1{margin:0}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:920px;margin:26px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:700;margin-bottom:15px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.box h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:100px;resize:vertical}.btn{border:0;border-radius:8px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.msg{font-size:13px;margin-top:8px;color:var(--green)}.topic{border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:10px;background:#fff}.topic-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.topic-title{font-weight:700;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.body{margin:10px 0;line-height:1.5;white-space:pre-wrap}.reply{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:8px}.reply-form{display:flex;gap:8px;margin-top:10px}.reply-form input{flex:1}.reply-form button{margin:0}.empty{text-align:center;color:var(--muted);padding:22px}.locked{background:#fff7ed;border-color:#fed7aa}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.reply-form{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><h1>💬 Course Discussion Forum</h1><p>Direct Taxes Law &amp; Practice-I</p></div><div class="wrap"><a class="back" href="direct-tax-course.html">← Course Home</a><div id="accessBox" class="box"><div class="empty">Checking course enrolment...</div></div><div id="forumArea" style="display:none"><div class="box"><h2>Start a Discussion</h2><div class="grid"><div><label for="category">Category</label><select id="category"><option>General Discussion</option><option>Module 1 Doubts</option><option>Module 2 Doubts</option><option>Module 3 Doubts</option><option>Module 4 Doubts</option><option>Module 5 Doubts</option></select></div><div><label for="title">Topic Title</label><input id="title" maxlength="160" placeholder="Enter your question or topic"></div></div><label for="body">Message / Doubt</label><textarea id="body" maxlength="5000" placeholder="Explain your doubt or discussion point"></textarea><button class="btn" id="postBtn">POST DISCUSSION</button><div id="postMsg" class="msg"></div></div><div class="box"><h2>Course Discussions</h2><div id="topics"><div class="empty">Loading discussions...</div></div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>const COURSE_KEY='direct-taxes-law-practice-1';let currentUser=null;let currentName='Student';function fmt(d){return new Date(d).toLocaleString()}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}async function loadReplies(topicId,holder){const {data,error}=await supabaseClient.from('forum_replies').select('id,body,author_name,created_at').eq('topic_id',topicId).order('created_at',{ascending:true});holder.innerHTML='';if(error){holder.appendChild(el('div','meta','Unable to load replies.'));return}(data||[]).forEach(r=>{const x=el('div','reply');x.appendChild(el('strong','',r.author_name));x.appendChild(el('div','meta',fmt(r.created_at)));x.appendChild(el('div','body',r.body));holder.appendChild(x)})}async function addReply(topicId,input,holder){const body=input.value.trim();if(!body)return;const {error}=await supabaseClient.from('forum_replies').insert({topic_id:topicId,course_key:COURSE_KEY,body,author_id:currentUser.id,author_name:currentName});if(!error){input.value='';await loadReplies(topicId,holder)}}async function loadTopics(){const box=document.getElementById('topics');const {data,error}=await supabaseClient.from('forum_topics').select('id,category,title,body,author_name,created_at').eq('course_key',COURSE_KEY).order('created_at',{ascending:false});box.innerHTML='';if(error){box.appendChild(el('div','empty','Unable to load discussions.'));return}if(!data||!data.length){box.appendChild(el('div','empty','No discussions yet. Start the first topic above.'));return}for(const t of data){const card=el('div','topic');const head=el('div','topic-head');const left=el('div');left.appendChild(el('div','topic-title',t.title));left.appendChild(el('div','meta',t.category+' • '+t.author_name+' • '+fmt(t.created_at)));head.appendChild(left);card.appendChild(head);card.appendChild(el('div','body',t.body));const replies=el('div');card.appendChild(replies);await loadReplies(t.id,replies);const form=el('div','reply-form');const inp=document.createElement('input');inp.placeholder='Write a reply...';inp.maxLength=5000;const btn=el('button','btn','REPLY');btn.onclick=()=>addReply(t.id,inp,replies);form.appendChild(inp);form.appendChild(btn);card.appendChild(form);box.appendChild(card)}}document.getElementById('postBtn').onclick=async()=>{const title=document.getElementById('title').value.trim(),body=document.getElementById('body').value.trim(),category=document.getElementById('category').value,msg=document.getElementById('postMsg');msg.textContent='';if(title.length<3||body.length<2){msg.textContent='Please enter a topic title and message.';return}const {error}=await supabaseClient.from('forum_topics').insert({course_key:COURSE_KEY,category,title,body,author_id:currentUser.id,author_name:currentName});if(error){msg.textContent='Unable to post discussion.';return}document.getElementById('title').value='';document.getElementById('body').value='';msg.textContent='Discussion posted successfully.';await loadTopics()};(async()=>{currentUser=await requireAuth();if(!currentUser)return;const {data:profile}=await supabaseClient.from('student_profiles').select('full_name').eq('user_id',currentUser.id).maybeSingle();currentName=profile?.full_name||'Student';const {data:enrol}=await supabaseClient.from('course_enrollments').select('id').eq('user_id',currentUser.id).eq('course_key',COURSE_KEY).eq('status','active').maybeSingle();const access=document.getElementById('accessBox');if(!enrol){access.classList.add('locked');access.innerHTML='<strong>Enrolment required.</strong><p>You must enrol in Direct Taxes Law & Practice-I before joining its discussion forum.</p><a class="back" href="econtent.html">Go to E-Content Courses</a>';return}access.innerHTML='<strong>Course Forum Access:</strong> Enrolled student ✓<br><span class="meta">Use this space for course-related doubts and academic discussion.</span>';document.getElementById('forumArea').style.display='block';await loadTopics()})();</script></body></html>
