<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certificates | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827;--green:#166534;--amber:#92400e}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff}.container{max-width:900px;margin:26px auto;padding:0 16px}.back{color:var(--accent);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.course{border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:10px;background:#f8fafc}.course strong{display:block}.meta{font-size:12px;color:var(--muted);margin-top:5px}.eligible{color:var(--green);font-weight:700}.pending{color:var(--amber);font-weight:700}.empty{text-align:center;color:var(--muted);padding:25px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260818-header2"></script></head><body><div class="header"><div class="headin"><h1>Certificates</h1><p>Eligible MOOC Course Certificates</p></div></div><div class="container"><a class="back" href="dashboard.html">← Student Dashboard</a><div class="box"><h2 style="margin-top:0">My Certificate Eligibility</h2><div id="list"><div class="empty">Loading...</div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const u=await requireAuth();if(!u)return;const {data:en}=await supabaseClient.from('course_enrollments').select('course_key,status').eq('user_id',u.id).in('status',['active','completed']);const keys=[...new Set((en||[]).map(x=>x.course_key))];if(!keys.length){list.innerHTML='<div class="empty">No certificate-enabled courses found.</div>';return}const {data:courses}=await supabaseClient.from('courses').select('*').in('course_key',keys).eq('certificate_enabled',true).eq('is_published',true);if(!courses?.length){list.innerHTML='<div class="empty">No certificate-enabled courses found.</div>';return}const cards=[];for(const c of courses){const [{data:a},{data:e}]=await Promise.all([supabaseClient.from('assignment_attempts').select('module_no,status,score,submitted_at').eq('user_id',u.id).eq('course_key',c.course_key),supabaseClient.from('final_exam_attempts').select('status,score').eq('user_id',u.id).eq('course_key',c.course_key).maybeSingle()]);const latest=new Map();(a||[]).forEach(x=>{const old=latest.get(x.module_no);if(!old||String(x.submitted_at||'')>String(old.submitted_at||''))latest.set(x.module_no,x)});const count=Number(c.assignment_count||c.module_count||0);let ca=0,done=0;for(let i=1;i<=count;i++){const x=latest.get(i);if(x&&x.status==='submitted'){done++;ca+=Number(x.score||0)}}const caPass=done===count&&ca>=Number(c.ca_marks||0)*Number(c.ca_pass_percent||40)/100;const eseDone=e&&['submitted','expired'].includes(e.status);const ese=eseDone?Number(e.score||0):0;const esePass=eseDone&&ese>=Number(c.ese_marks||0)*Number(c.ese_pass_percent||40)/100;const eligible=caPass&&esePass;cards.push(`<div class="course"><strong>${esc(c.title)}</strong><div class="meta">${esc(c.course_code||'')} ${c.programme?'• '+esc(c.programme):''}</div><div class="${eligible?'eligible':'pending'}" style="margin-top:8px">${eligible?'Eligible for Certificate':'Eligibility Pending'}</div><div class="meta">Certificate generation/download will be enabled when the certificate issuing module is activated.</div></div>`)}list.innerHTML=cards.join('')}load();</script></body></html>
