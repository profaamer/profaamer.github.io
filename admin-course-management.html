<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course Management | Admin</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827;--green:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.logout{border:1px solid #64748b;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:700;margin-bottom:15px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.box h2{margin:0 0 14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.field textarea{min-height:72px}.full{grid-column:1/-1}.switches{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}.switches label{font-size:13px;font-weight:700}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid #cbd5e1}.status{font-size:13px;color:var(--green);margin-top:10px}.module{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:9px;background:#f8fafc}.moduleGrid{display:grid;grid-template-columns:90px 1fr;gap:10px}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}@media(max-width:700px){.grid,.moduleGrid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-course1"></script></head><body><div class="header"><div class="headin"><div><h1>Course Management</h1><p>Administrator Area • Commerce and Management Learning Portal</p></div><button class="logout" onclick="adminLogout()">LOGOUT</button></div></div><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="box"><div class="grid"><div class="field"><label>Select Course</label><select id="courseSelect" onchange="loadSelectedCourse()"></select></div><div class="field"><label>Course Category</label><select id="category"><option value="econtent">E-Content</option><option value="mooc">MOOC</option></select></div><div class="field full"><label>Course Title</label><input id="title"></div><div class="field"><label>Course Key</label><input id="courseKey" disabled></div><div class="field"><label>Course Code</label><input id="courseCode"></div><div class="field"><label>Programme</label><input id="programme"></div><div class="field"><label>Semester / Level</label><input id="semesterLevel"></div><div class="field"><label>Course Type</label><input id="courseType"></div><div class="field"><label>Academic Framework</label><input id="framework"></div><div class="field"><label>Effective From</label><input id="effectiveFrom"></div><div class="field full"><label>University</label><input id="university"></div><div class="field full"><label>Course Content Creator</label><input id="creator"></div><div class="field"><label>Credits</label><input id="credits" type="number" step="0.5" min="0"></div><div class="field"><label>Teaching Hours</label><input id="hours" type="number" min="0"></div><div class="field"><label>Number of Modules</label><input id="moduleCount" type="number" min="1"></div><div class="field"><label>Total Assessment Marks</label><input id="assessmentMarks" type="number" min="0"></div><div class="field"><label>CA Marks</label><input id="caMarks" type="number" min="0"></div><div class="field"><label>ESE Marks</label><input id="eseMarks" type="number" min="0"></div><div class="field"><label>CA Passing %</label><input id="caPass" type="number" min="0" max="100"></div><div class="field"><label>ESE Passing %</label><input id="esePass" type="number" min="0" max="100"></div><div class="field"><label>Final Exam Duration (minutes)</label><input id="examMinutes" type="number" min="1"></div><div class="field full"><label>Prerequisite</label><textarea id="prerequisite"></textarea></div></div><div class="switches"><label><input type="checkbox" id="published"> Published</label><label><input type="checkbox" id="enrollmentOpen"> Enrolment Open</label><label><input type="checkbox" id="certificateEnabled"> Certificate Enabled</label></div><div style="margin-top:15px"><button class="btn primary" onclick="saveCourse()">SAVE COURSE SETTINGS</button></div><div id="courseStatus" class="status"></div></div><div class="box"><h2>Course Modules</h2><div id="modules"></div><button class="btn primary" style="margin-top:14px" onclick="saveModules()">SAVE MODULES</button><div id="moduleStatus" class="status"></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Administrator Area</div><script>let currentCourse=null;async function guardAdmin(){const u=await getCurrentUser();if(!u){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!data){await supabaseClient.auth.signOut();location.replace('admin-login.html');return false}document.body.style.visibility='visible';return true}async function loadCourses(){const {data,error}=await supabaseClient.from('courses').select('*').order('title');if(error)return alert(error.message);courseSelect.innerHTML=(data||[]).map(c=>`<option value="${c.course_key}">${c.title}</option>`).join('');if(data?.length)await loadSelectedCourse()}async function loadSelectedCourse(){const key=courseSelect.value;const {data,error}=await supabaseClient.from('courses').select('*').eq('course_key',key).single();if(error)return alert(error.message);currentCourse=data;title.value=data.title||'';courseKey.value=data.course_key||'';courseCode.value=data.course_code||'';category.value=data.category||'econtent';programme.value=data.programme||'';semesterLevel.value=data.semester_level||'';courseType.value=data.course_type||'';framework.value=data.academic_framework||'';effectiveFrom.value=data.effective_from||'';university.value=data.university_name||'';creator.value=data.content_creator||'';credits.value=data.credits??0;hours.value=data.teaching_hours??0;moduleCount.value=data.module_count??1;assessmentMarks.value=data.assessment_marks??100;caMarks.value=data.ca_marks??40;eseMarks.value=data.ese_marks??60;caPass.value=data.ca_pass_percent??40;esePass.value=data.ese_pass_percent??40;examMinutes.value=data.final_exam_minutes??60;prerequisite.value=data.prerequisite||'';published.checked=!!data.is_published;enrollmentOpen.checked=!!data.enrollment_open;certificateEnabled.checked=!!data.certificate_enabled;await loadModules()}async function loadModules(){const {data}=await supabaseClient.from('course_modules').select('*').eq('course_key',courseSelect.value).order('module_no');const count=Number(moduleCount.value||currentCourse?.module_count||1);const map=new Map((data||[]).map(x=>[x.module_no,x]));modules.innerHTML=Array.from({length:count},(_,i)=>{const n=i+1,m=map.get(n)||{};return `<div class="module"><div class="moduleGrid"><div class="field"><label>Module No.</label><input value="${n}" disabled></div><div class="field"><label>Module Title</label><input class="modTitle" data-no="${n}" value="${String(m.module_title||'').replace(/"/g,'&quot;')}"></div></div><div class="field" style="margin-top:8px"><label>Description</label><textarea class="modDesc" data-no="${n}">${m.module_description||''}</textarea></div></div>`}).join('')}moduleCount.addEventListener('change',loadModules);async function saveCourse(){courseStatus.textContent='Saving...';const row={title:title.value.trim(),course_code:courseCode.value.trim(),category:category.value,programme:programme.value.trim(),semester_level:semesterLevel.value.trim(),course_type:courseType.value.trim(),academic_framework:framework.value.trim(),effective_from:effectiveFrom.value.trim(),university_name:university.value.trim(),content_creator:creator.value.trim(),credits:Number(credits.value||0),teaching_hours:Number(hours.value||0),module_count:Number(moduleCount.value||1),assessment_marks:Number(assessmentMarks.value||0),ca_marks:Number(caMarks.value||0),ese_marks:Number(eseMarks.value||0),ca_pass_percent:Number(caPass.value||0),ese_pass_percent:Number(esePass.value||0),final_exam_minutes:Number(examMinutes.value||60),prerequisite:prerequisite.value.trim(),is_published:published.checked,enrollment_open:enrollmentOpen.checked,certificate_enabled:certificateEnabled.checked,updated_at:new Date().toISOString()};const {error}=await supabaseClient.from('courses').update(row).eq('course_key',courseSelect.value);courseStatus.textContent=error?error.message:'Course settings saved successfully.';if(!error)await loadCourses()}async function saveModules(){moduleStatus.textContent='Saving...';const titles=[...document.querySelectorAll('.modTitle')],rows=titles.map(t=>{const n=Number(t.dataset.no),d=document.querySelector(`.modDesc[data-no="${n}"]`);return {course_key:courseSelect.value,module_no:n,module_title:t.value.trim()||`Module ${n}`,module_description:d.value.trim(),is_active:true}});const {error}=await supabaseClient.from('course_modules').upsert(rows,{onConflict:'course_key,module_no'});moduleStatus.textContent=error?error.message:'Modules saved successfully.'}async function adminLogout(){await supabaseClient.auth.signOut();location.replace('admin-login.html')}(async()=>{if(await guardAdmin())loadCourses()})();</script></body></html>
