<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Module Assignment | Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#b45309;--head:#111827;--green:#166534;--blue:#1d4ed8}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.wrap{max-width:900px;margin:26px auto;padding:0 16px}.back{color:var(--blue);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.startbtn,.submitbtn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}.submitbtn{background:var(--blue);margin-top:16px}.question{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}.option{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-top:8px}.msg{padding:14px;border-radius:9px;margin-top:14px;background:#f8fafc;color:var(--muted)}.result{background:#ecfdf5;border:1px solid #bbf7d0;color:var(--green);padding:16px;border-radius:10px;font-weight:700}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body style="visibility:hidden"><div class="header"><h1 id="title">Module Assignment</h1><p id="courseTitle">Loading...</p></div><div class="wrap"><a id="back" class="back" href="#">← Self-Assessment</a><div class="box" id="rules">Loading...</div><div class="box" id="startBox"><button class="startbtn" onclick="startAssignment()">START ASSIGNMENT</button><div id="startMsg" class="msg" style="display:none"></div></div><div id="examArea"></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const p=new URLSearchParams(location.search),key=p.get('course'),moduleNo=Number(p.get('module'));let course=null,attemptId=null,questions=[];function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function authHeaders(){const {data:{session}}=await supabaseClient.auth.getSession();return {'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY}}async function init(){const u=await requireAuth();if(!u)return;if(!key||!Number.isInteger(moduleNo)||moduleNo<1){location.replace('my-courses.html');return}if(key==='direct-taxes-law-practice-1'){location.replace('direct-tax-module-assignment.html?module='+moduleNo);return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace('course-info.html?course='+encodeURIComponent(key));return}const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',key).maybeSingle();course=c;if(!course||moduleNo>Number(course.assignment_count||course.module_count||0)){document.body.innerHTML='<div class="wrap"><div class="box">Invalid assignment.</div></div>';return}const {data:m}=await supabaseClient.from('course_modules').select('module_title').eq('course_key',key).eq('module_no',moduleNo).maybeSingle();title.textContent='Module '+moduleNo+' Assignment';courseTitle.textContent=course.title+(m?.module_title?' • '+m.module_title:'');back.href='course-assessment.html?course='+encodeURIComponent(key);rules.innerHTML='<strong>Official CA Assignment</strong><br>'+Number(course.assignment_questions||0)+' random MCQs • Maximum '+Number(course.assignment_marks_each||0)+' marks • No time limit<br>Questions and options are shuffled.<br><strong>Only one official attempt is permitted for each module.</strong>';document.body.style.visibility='visible'}async function startAssignment(){startMsg.style.display='block';startMsg.textContent='Preparing your assignment...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/assignment-start',{method:'POST',headers:await authHeaders(),body:JSON.stringify({course_key:key,module_no:moduleNo})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to start assignment');if(d.status==='submitted'){startBox.style.display='none';examArea.innerHTML='<div class="box result">You have already completed this assignment.<br>Score: '+d.score+' / '+Number(course.assignment_marks_each||0)+'<br>Correct Answers: '+d.correct_count+' / '+Number(course.assignment_questions||0)+'<br><br><a href="course-scorecard.html?course='+encodeURIComponent(key)+'">View My Scorecard →</a></div>';return}attemptId=d.attempt_id;questions=d.questions||[];render();startBox.style.display='none'}catch(e){startMsg.textContent=e.message}}function render(){examArea.innerHTML=questions.map(q=>'<div class="question"><h3>Q'+q.number+'. '+esc(q.question_text)+'</h3>'+q.options.map(o=>'<label class="option"><input type="radio" name="q_'+q.question_id+'" value="'+o.key+'"> '+esc(o.text)+'</label>').join('')+'</div>').join('')+'<button class="submitbtn" onclick="submitAssignment()">SUBMIT ASSIGNMENT</button><div id="submitMsg" class="msg" style="display:none"></div>'}async function submitAssignment(){const a={};questions.forEach(q=>{const x=document.querySelector('input[name="q_'+q.question_id+'"]:checked');if(x)a[String(q.question_id)]=x.value});const unanswered=questions.length-Object.keys(a).length;if(unanswered&&!confirm(unanswered+' question(s) are unanswered. Submit anyway?'))return;submitMsg.style.display='block';submitMsg.textContent='Submitting and evaluating...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/assignment-submit',{method:'POST',headers:await authHeaders(),body:JSON.stringify({attempt_id:attemptId,answers:a})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to submit');examArea.innerHTML='<div class="box result">Assignment submitted successfully.<br>Score: '+d.score+' / '+Number(course.assignment_marks_each||0)+'<br>Correct Answers: '+d.correct_count+' / '+questions.length+'<br><br><a href="course-scorecard.html?course='+encodeURIComponent(key)+'">View My Scorecard →</a></div>'}catch(e){submitMsg.textContent=e.message}}init();</script></body></html>
