<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scorecard | Learning Portal</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.header{background:#111827;color:#fff;padding:25px 16px;text-align:center}.wrap{max-width:900px;margin:26px auto;padding:0 16px}.back{color:#1d4ed8;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:14px}.item strong{display:block;font-size:12px;color:#6b7280}.big{font-size:24px;font-weight:800}.passed{color:#166534}.failed{color:#b91c1c}.pending{color:#92400e}.modules{margin-top:16px}.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #e5e7eb;padding:10px 0}.footer{text-align:center;padding:28px;color:#6b7280;font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body style="visibility:hidden"><div class="header"><h1>My Course Scorecard</h1><p id="courseTitle">Loading...</p></div><div class="wrap"><a id="back" class="back" href="#">← Course Home</a><div id="main" class="box">Loading...</div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){const u=await requireAuth();if(!u)return;if(!key){location.replace('my-courses.html');return}if(key==='direct-taxes-law-practice-1'){location.replace('direct-tax-scorecard.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace('course-info.html?course='+encodeURIComponent(key));return}const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',key).maybeSingle();if(!c){main.textContent='Course unavailable.';document.body.style.visibility='visible';return}courseTitle.textContent=c.title;back.href='course.html?course='+encodeURIComponent(key);const [{data:a},{data:e}]=await Promise.all([supabaseClient.from('assignment_attempts').select('module_no,status,score,submitted_at').eq('user_id',u.id).eq('course_key',key).order('module_no'),supabaseClient.from('final_exam_attempts').select('status,score,correct_count,submitted_at').eq('user_id',u.id).eq('course_key',key).maybeSingle()]);const latest=new Map();(a||[]).forEach(x=>{const old=latest.get(x.module_no);if(!old||String(x.submitted_at||'')>String(old.submitted_at||''))latest.set(x.module_no,x)});let ca=0,done=0;const rows=[];for(let i=1;i<=Number(c.assignment_count||c.module_count||0);i++){const x=latest.get(i),ok=x&&x.status==='submitted';if(ok){done++;ca+=Number(x.score||0)}rows.push('<div class="row"><span>Module '+i+' Assignment</span><strong>'+(ok?Number(x.score||0)+' / '+Number(c.assignment_marks_each||0):'Pending')+'</strong></div>')}const caComplete=done===Number(c.assignment_count||c.module_count||0),caPass=caComplete&&ca>=Number(c.ca_marks||0)*Number(c.ca_pass_percent||40)/100,eseDone=e&&['submitted','expired'].includes(e.status),ese=eseDone?Number(e.score||0):null,esePass=eseDone&&ese>=Number(c.ese_marks||0)*Number(c.ese_pass_percent||40)/100,total=caComplete&&eseDone?ca+ese:null,overall=caComplete&&eseDone?(caPass&&esePass?'Passed':'Not Passed'):'Incomplete';const cls=overall==='Passed'?'passed':overall==='Not Passed'?'failed':'pending';main.innerHTML='<div class="grid"><div class="item"><strong>CA</strong><span class="big">'+(caComplete?ca+' / '+Number(c.ca_marks||0):'Incomplete')+'</span><div>'+(caComplete?(caPass?'Passed':'Not Passed'):'Pending')+'</div></div><div class="item"><strong>ESE</strong><span class="big">'+(eseDone?ese+' / '+Number(c.ese_marks||0):'Incomplete')+'</span><div>'+(eseDone?(esePass?'Passed':'Not Passed'):'Pending')+'</div></div><div class="item"><strong>Overall Result</strong><span class="big '+cls+'">'+esc(overall)+'</span><div>'+(total!==null?'Total: '+total+' / '+(Number(c.ca_marks||0)+Number(c.ese_marks||0)):'Both components required')+'</div></div></div><div class="modules"><h3>Module Assignments</h3>'+rows.join('')+'</div>';document.body.style.visibility='visible'}load();</script></body></html>
