<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Scorecard | Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#172033;--muted:#667085;--line:#e4e7ec;--head:#111827;--green:#15803d;--greenSoft:#ecfdf3;--blue:#2563eb;--purple:#7c3aed;--amber:#b45309;--red:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:linear-gradient(180deg,#eef3fb 0,#f7f8fb 240px,#f4f6f9 100%);color:var(--text)}.header{background:#111827;color:#fff}.wrap{max-width:980px;margin:26px auto;padding:0 16px}.back{color:#1d4ed8;text-decoration:none;font-weight:700}.shell{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:16px;box-shadow:0 12px 28px rgba(15,23,42,.08)}.resultHero{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(135deg,#ecfdf3,#f0fdf4);border:1px solid #bbf7d0;border-radius:16px;padding:18px 20px;margin-bottom:18px}.resultHero.pendingHero{background:#fffbeb;border-color:#fde68a}.resultHero.failHero{background:#fef2f2;border-color:#fecaca}.resultTitle{font-size:22px;font-weight:800;margin-bottom:5px}.resultSub{color:var(--muted);font-size:13px}.resultBadge{font-size:14px;font-weight:800;border-radius:999px;padding:9px 12px;background:#dcfce7;color:#166534;white-space:nowrap}.failHero .resultBadge{background:#fee2e2;color:#991b1b}.pendingHero .resultBadge{background:#fef3c7;color:#92400e}.summaryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.summaryCard{position:relative;background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:16px;overflow:hidden}.summaryCard:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--accent,#2563eb)}.summaryLabel{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.summaryValue{font-size:27px;font-weight:800;margin:8px 0 4px}.statusText{font-size:13px;font-weight:700}.passed{color:var(--green)}.failed{color:var(--red)}.pending{color:var(--amber)}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:24px 0 10px}.sectionHead h3{margin:0;font-size:19px}.rule{font-size:12px;color:var(--muted)}.modules{border:1px solid var(--line);border-radius:14px;overflow:hidden}.row{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:13px 15px;border-bottom:1px solid #edf0f3}.row:last-child{border-bottom:0}.modNo{width:40px;height:40px;border-radius:10px;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}.rowTitle{font-weight:700}.rowMeta{font-size:12px;color:var(--muted);margin-top:3px}.scorePill{font-weight:800;border-radius:999px;padding:7px 10px;background:#eff6ff;color:#1d4ed8;white-space:nowrap}.completionNote{margin-top:18px;border:1px solid #dbeafe;background:#eff6ff;border-radius:12px;padding:13px 15px;font-size:13px;line-height:1.5}.footer{text-align:center;padding:28px;color:#6b7280;font-size:13px}@media(max-width:700px){.summaryGrid{grid-template-columns:1fr}.resultHero{align-items:flex-start;flex-direction:column}.row{grid-template-columns:44px 1fr}.scorePill{grid-column:2;justify-self:start}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-scorecard2"></script></head><body style="visibility:hidden"><div class="header"><div class="headin"><h1>My Course Scorecard</h1><p id="courseTitle">Loading...</p></div></div><div class="wrap"><a id="back" class="back" href="#">← Course Home</a><div id="main" class="shell">Loading...</div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function pct(a,b){return b>0?((a/b)*100):0}async function load(){const u=await requireAuth();if(!u)return;if(!key){location.replace('my-courses.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace('course-info.html?course='+encodeURIComponent(key));return}const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',key).maybeSingle();if(!c){main.textContent='Course unavailable.';document.body.style.visibility='visible';return}courseTitle.textContent=c.title;back.href='course.html?course='+encodeURIComponent(key);const [{data:a},{data:e}]=await Promise.all([supabaseClient.from('assignment_attempts').select('module_no,status,score,submitted_at').eq('user_id',u.id).eq('course_key',key).order('module_no'),supabaseClient.from('final_exam_attempts').select('status,score,correct_count,submitted_at').eq('user_id',u.id).eq('course_key',key).maybeSingle()]);const latest=new Map();(a||[]).forEach(x=>{const old=latest.get(x.module_no);if(!old||String(x.submitted_at||'')>String(old.submitted_at||''))latest.set(x.module_no,x)});let ca=0,done=0;const rows=[];const assignmentTotal=Number(c.assignment_count||c.module_count||0);for(let i=1;i<=assignmentTotal;i++){const x=latest.get(i),ok=x&&x.status==='submitted';if(ok){done++;ca+=Number(x.score||0)}rows.push(`<div class="row"><div class="modNo">M${i}</div><div><div class="rowTitle">Module ${i} Assignment</div><div class="rowMeta">${ok?'Completed':'Pending'}</div></div><div class="scorePill">${ok?Number(x.score||0)+' / '+Number(c.assignment_marks_each||0):'Pending'}</div></div>`)}const caComplete=done===assignmentTotal,caMax=Number(c.ca_marks||0),eseMax=Number(c.ese_marks||0),caPass=caComplete&&pct(ca,caMax)>=40,eseDone=e&&['submitted','expired'].includes(e.status),ese=eseDone?Number(e.score||0):null,esePass=eseDone&&pct(ese,eseMax)>=40,total=caComplete&&eseDone?ca+ese:null,totalMax=caMax+eseMax,overall=caComplete&&eseDone?(caPass&&esePass?'Passed':'Not Passed'):'Incomplete';const heroClass=overall==='Passed'?'':overall==='Not Passed'?'failHero':'pendingHero';const badge=overall==='Passed'?'✓ COURSE COMPLETED':overall==='Not Passed'?'NOT PASSED':'INCOMPLETE';const message=overall==='Passed'?'You have successfully completed all assessment requirements for this course.':overall==='Not Passed'?'Both CA and ESE require a minimum of 40% separately.':'Complete all required assessments to receive your final result.';main.innerHTML=`<div class="resultHero ${heroClass}"><div><div class="resultTitle">${esc(overall==='Passed'?'Congratulations!':'Course Result')}</div><div class="resultSub">${esc(message)}</div></div><div class="resultBadge">${badge}</div></div><div class="summaryGrid"><div class="summaryCard" style="--accent:#2563eb"><div class="summaryLabel">Continuous Assessment (CA)</div><div class="summaryValue">${caComplete?ca+' / '+caMax:'Incomplete'}</div><div class="statusText ${caComplete?(caPass?'passed':'failed'):'pending'}">${caComplete?(caPass?'Passed':'Not Passed'):'Pending'}${caComplete?` • ${pct(ca,caMax).toFixed(1)}%`:''}</div></div><div class="summaryCard" style="--accent:#7c3aed"><div class="summaryLabel">End Semester Examination (ESE)</div><div class="summaryValue">${eseDone?ese+' / '+eseMax:'Incomplete'}</div><div class="statusText ${eseDone?(esePass?'passed':'failed'):'pending'}">${eseDone?(esePass?'Passed':'Not Passed'):'Pending'}${eseDone?` • ${pct(ese,eseMax).toFixed(1)}%`:''}</div></div><div class="summaryCard" style="--accent:#059669"><div class="summaryLabel">Overall Result</div><div class="summaryValue ${overall==='Passed'?'passed':overall==='Not Passed'?'failed':'pending'}">${esc(overall)}</div><div class="statusText">${total!==null?`Total: ${total} / ${totalMax} • ${pct(total,totalMax).toFixed(1)}%`:'Both components required'}</div></div></div><div class="sectionHead"><h3>Module Assignments</h3><div class="rule">Passing rule: minimum 40% separately in CA and ESE</div></div><div class="modules">${rows.join('')}</div>${overall==='Passed'?`<div class="completionNote"><strong>Course completion confirmed.</strong> Your result satisfies the portal's universal passing rule. ${c.certificate_enabled?'You are eligible for the course certificate.':'Certificate is not enabled for this course.'}</div>`:''}`;document.body.style.visibility='visible'}load();</script></body></html>
