<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--purple:#7c3aed;--head:#111827;--green:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.header{background:var(--head);color:#fff;padding:24px 16px}.headin{max-width:1050px;margin:auto}.header h1{margin:0;font-size:25px}.header p{margin:6px 0 0;color:#d1d5db}.wrap{max-width:1050px;margin:24px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:15px}.details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:17px}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta div{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:12px}.meta strong{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;min-height:145px;display:flex;flex-direction:column}.card h3{margin:0 0 7px}.card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}.open{margin-top:auto;padding-top:14px;color:var(--accent);font-size:12px;font-weight:700}.disabled{opacity:.5}.modules{margin-top:17px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.module{padding:12px 0;border-bottom:1px solid var(--line)}.module:last-child{border-bottom:0}.module strong{display:block}.module span{color:var(--muted);font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.meta{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.meta{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-dyncourse2"></script></head><body><div class="header"><div class="headin"><h1 id="title">Loading course...</h1><p id="subtitle">Commerce and Management Learning Portal</p></div></div><div class="wrap"><a class="back" href="my-courses.html">← My Courses</a><div id="content"><div class="details">Loading...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function sectionUrl(s){return `course-section.html?course=${encodeURIComponent(key)}&section=${encodeURIComponent(s)}`}async function load(){const user=await requireAuth();if(!user)return;if(!key){location.replace('my-courses.html');return}if(key==='direct-taxes-law-practice-1'){location.replace('direct-tax-course.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',user.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace(`course-info.html?course=${encodeURIComponent(key)}`);return}const {data:c,error}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(error||!c){content.innerHTML='<div class="details">This course is not currently available.</div>';document.body.style.visibility='visible';return}const {data:mods}=await supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('module_no');title.textContent=c.title;subtitle.textContent=[c.course_code,c.programme,c.semester_level].filter(Boolean).join(' • ');const cards=[['E-Tutorial','Topic-wise video learning resources.',c.tutorial_enabled,'tutorial'],['E-Content','Study material and structured course notes.',c.econtent_enabled,'content'],['Web Resources','Curated academic references and external resources.',c.web_resources_enabled,'resources'],['Self-Assessment','Practice activities and module assignments.',c.self_assessment_enabled,'assessment'],['Discussion Forum','Course-wise learner discussion forum.',c.discussion_forum_enabled,'forum'],['Final Examination','Final course assessment according to configured rules.',true,'exam'],['Scorecard','View CA, ESE and overall course result.',true,'scorecard']];content.innerHTML=`<div class="details"><div class="meta"><div><strong>Course Code</strong>${esc(c.course_code||'—')}</div><div><strong>Credits</strong>${c.credits??0}</div><div><strong>Teaching Hours</strong>${c.teaching_hours??0}</div><div><strong>Modules</strong>${c.module_count??0}</div><div><strong>University / Institution</strong>${esc(c.university_name||'—')}</div><div><strong>Course Content Creator</strong>${esc(c.content_creator||'—')}</div></div></div><div class="grid">${cards.map(x=>`<${x[2]?'a':'div'} class="card ${x[2]?'':'disabled'}" ${x[2]?`href="${sectionUrl(x[3])}" style="text-decoration:none;color:inherit"`:''}><h3>${x[0]}</h3><p>${x[1]}</p><div class="open">${x[2]?'OPEN →':'NOT ENABLED'}</div></${x[2]?'a':'div'}>`).join('')}</div><div class="modules"><h2 style="margin-top:0">Course Modules</h2>${(mods||[]).map(m=>`<div class="module"><strong>Module ${m.module_no} — ${esc(m.module_title)}</strong><span>${esc(m.module_description||'')}</span></div>`).join('')||'<p>No modules configured.</p>'}</div>`;document.body.style.visibility='visible'}load();</script></body></html>
