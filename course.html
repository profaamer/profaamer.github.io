<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course | Y-MOOC</title><style>:root{--bg:#f4f6f9;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--green:#059669;--week:#eef2ff;--weektext:#3730a3}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6f9;color:var(--text);visibility:hidden}.header{background:#111827;color:#fff}.headin,.wrap{max-width:1000px;margin:auto}.headin{padding:20px 16px}.headin h1{margin:0;font-size:25px}.headin p{margin:5px 0 0}.wrap{padding:24px 16px}.back{color:#1d4ed8;font-weight:700;text-decoration:none}.hero,.week,.module{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}.meta{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:14px}.meta div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:11px}.meta strong{display:block;font-size:10px;color:var(--muted);text-transform:uppercase;margin-bottom:5px}.week{padding:0;overflow:hidden}.weekHead{background:var(--week);color:var(--weektext);padding:14px 18px;border-bottom:1px solid #c7d2fe;font-weight:800}.weekBody{padding:0 18px 18px}.module{box-shadow:none;margin-top:16px}.moduleHead{display:flex;gap:13px;align-items:start}.no{width:46px;height:46px;flex:0 0 46px;border-radius:12px;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:800}.module h2{font-size:18px;margin:2px 0 4px}.desc{color:var(--muted);font-size:13px}.quadrants{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:17px}.q{border:1px solid var(--line);border-radius:12px;padding:14px;text-decoration:none;color:inherit;min-height:115px;display:flex;flex-direction:column}.q.disabled{opacity:.42;pointer-events:none}.q strong{font-size:13px;margin:7px 0 4px}.q span{font-size:11px;color:var(--muted)}.open{margin-top:auto;font-size:10px;font-weight:800;color:var(--accent);padding-top:9px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.action{background:#fff;border:1px solid var(--line);border-radius:12px;padding:15px;text-decoration:none;color:inherit;font-weight:700}.completion{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:12px;padding:14px;margin-top:16px;font-weight:700}.footer{text-align:center;padding:28px;color:var(--muted);font-size:12px}@media(max-width:800px){.quadrants,.meta{grid-template-columns:1fr 1fr}.actions{grid-template-columns:1fr}}@media(max-width:500px){.quadrants,.meta{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260826-week-structure"></script></head><body><div class="header"><div class="headin"><h1 id="title">Loading...</h1><p>Y-MOOC • Course → Week → Module → Quadrants</p></div></div><div class="wrap"><a class="back" href="my-courses.html">← My Learning Courses</a><div id="out"></div></div><div class="footer">© 2026 Y-MOOC • Yeshwant Mahavidyalaya, Nanded</div><script>const key=new URLSearchParams(location.search).get('course'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function link(page,m){return `${page}?course=${encodeURIComponent(key)}&module=${m}`}function q(icon,name,desc,on,page,m){return `<a class="q ${on?'':'disabled'}" ${on?`href="${link(page,m)}"`:''}><div>${icon}</div><strong>${name}</strong><span>${desc}</span><div class="open">${on?'OPEN →':'NOT ENABLED'}</div></a>`}function moduleHtml(m,c){return `<section class="module"><div class="moduleHead"><div class="no">M${m.module_no}</div><div><h2>Module ${m.module_no}: ${esc(m.module_title)}</h2><div class="desc">${esc(m.module_description||'Study this module through all four learning quadrants.')}</div></div></div><div class="quadrants">${q('🎥','Quadrant I — E-Tutorial','Video / multimedia learning',c.tutorial_enabled,'course-tutorial.html',m.module_no)}${q('📘','Quadrant II — E-Content','Notes and study material',c.econtent_enabled,'course-content.html',m.module_no)}${q('🌐','Quadrant III — Web Resources','References and external resources',c.web_resources_enabled,'course-resources.html',m.module_no)}${q('📝','Quadrant IV — Self-Assessment','Module assignment / practice',c.self_assessment_enabled,'course-assessment.html',m.module_no)}</div></section>`}async function load(){const u=await requireAuth();if(!u)return;const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(!en||!['active','completed'].includes(en.status)){location.replace('course-info.html?course='+encodeURIComponent(key));return}const [{data:c},{data:mods}]=await Promise.all([supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle(),supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('week_no').order('module_no')]);if(!c){out.innerHTML='<div class="hero">Course unavailable.</div>';document.body.style.visibility='visible';return}title.textContent=c.title;const completed=en.status==='completed'?'<div class="completion">✓ Course Completed</div>':'';const weeks=Number(c.week_count||c.credits||1);const grouped=Array.from({length:weeks},(_,i)=>({week:i+1,modules:(mods||[]).filter(m=>Number(m.week_no)===i+1)}));const weekHtml=grouped.map(g=>`<section class="week"><div class="weekHead">Week ${g.week} of ${weeks}</div><div class="weekBody">${g.modules.length?g.modules.map(m=>moduleHtml(m,c)).join(''):'<div class="desc" style="padding:18px 0">No module assigned to this week.</div>'}</div></section>`).join('');out.innerHTML=`${completed}<div class="hero"><strong>Course Overview</strong><div class="meta"><div><strong>Course Code</strong>${esc(c.course_code||'—')}</div><div><strong>Credits</strong>${c.credits??0}</div><div><strong>Weeks</strong>${weeks}</div><div><strong>Modules</strong>${c.module_count??0}</div><div><strong>Creator</strong>${esc(c.content_creator||'—')}</div></div></div><h2 style="margin:24px 0 0">Course Weeks</h2><p class="desc">1 Credit = 1 Week. Each week contains one or more modules, and every module follows the four-quadrant learning model.</p>${weekHtml||'<div class="hero">No weeks/modules configured.</div>'}<div class="actions"><a class="action" href="course-forum.html?course=${encodeURIComponent(key)}">💬 Discussion Forum</a><a class="action" href="course-final-exam.html?course=${encodeURIComponent(key)}">🎯 Final Examination</a><a class="action" href="course-scorecard.html?course=${encodeURIComponent(key)}">📊 Scorecard</a></div>`;document.body.style.visibility='visible'}load();</script></body></html>
