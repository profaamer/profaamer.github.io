<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--head:#111827;--purple:#7c3aed;--green:#059669;--amber:#d97706;--rose:#e11d48;--cyan:#0891b2}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:linear-gradient(180deg,#eef3fb 0,#f7f8fb 260px,#f4f6f9 100%);color:var(--text);visibility:hidden}.header{background:#111827;color:#fff}.headin{max-width:980px;margin:auto;display:block!important;text-align:left!important}.header .headin h1,.header .headin p{display:block!important;width:100%!important;text-align:left!important}.wrap{max-width:980px;margin:26px auto 28px;padding:0 16px}.back{display:inline-block;color:#1d4ed8;font-weight:700;text-decoration:none;margin:0 0 14px;padding:0}.completion{display:none;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:16px 18px;margin-bottom:16px}.completion.show{display:flex;justify-content:space-between;align-items:center;gap:14px}.completionTitle{font-size:18px;font-weight:800;color:#166534}.completionSub{font-size:13px;color:#4b5563;margin-top:4px}.completionTag{background:#dcfce7;color:#166534;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;white-space:nowrap}.courseHero{background:#fff;border:1px solid rgba(255,255,255,.8);border-radius:18px;padding:22px;box-shadow:0 12px 32px rgba(15,23,42,.12);margin-bottom:18px}.heroTop{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px}.heroTitle{font-size:18px;font-weight:800}.heroSub{color:var(--muted);font-size:13px;margin-top:5px}.heroActions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#eef2ff;color:#4338ca;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:800;white-space:nowrap}.infoBtn{display:inline-block;background:#fff;color:var(--accent);border:1px solid #bfdbfe;border-radius:9px;padding:8px 12px;text-decoration:none;font-size:12px;font-weight:800;white-space:nowrap}.infoBtn:hover{background:#eff6ff}.meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.meta div{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:13px 14px}.meta strong{display:block;font-size:11px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.35px}.meta span{font-weight:700;font-size:14px}.sectionTitle{margin:24px 0 12px;font-size:20px}.twoGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.twoGrid+.twoGrid{margin-top:14px}.threeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:16px;padding:21px;min-height:170px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 14px rgba(15,23,42,.045);transition:.18s ease}.twoGrid .card{min-height:180px}.threeGrid .card{min-height:150px}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--card-accent,var(--accent))}.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(15,23,42,.09);border-color:#cbd5e1}.cardIcon{font-size:29px;margin:3px 0 13px}.threeGrid .cardIcon{font-size:25px}.card h3{margin:0 0 7px;font-size:17px}.card p{font-size:13px;color:var(--muted);line-height:1.5;margin:0}.open{margin-top:auto;padding-top:16px;color:var(--card-accent,var(--accent));font-size:12px;font-weight:800}.disabled{opacity:.5;box-shadow:none}.disabled:hover{transform:none}.modules{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 4px 14px rgba(15,23,42,.04)}.modules h2{margin:0 0 12px;font-size:20px}.module{display:grid;grid-template-columns:48px 1fr;gap:13px;align-items:start;padding:14px 2px;border-bottom:1px solid #edf0f3}.module:last-child{border-bottom:0}.moduleNo{width:42px;height:42px;border-radius:12px;background:#eef2ff;color:#4338ca;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}.module strong{display:block;font-size:14px;margin-top:2px}.module span{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.45}.footer{text-align:center;padding:30px;color:var(--muted);font-size:13px}@media(max-width:700px){.threeGrid{grid-template-columns:1fr}.meta{grid-template-columns:1fr 1fr}.completion.show{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.twoGrid,.threeGrid,.meta{grid-template-columns:1fr}.heroTop{display:block}.heroActions{justify-content:flex-start;margin-top:12px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-mooc-cert1"></script></head><body><div class="header"><div class="headin"><h1 id="title">Loading course...</h1><p id="subtitle">Commerce and Management Learning Portal</p></div></div><div class="wrap"><a class="back" href="my-courses.html">← My Courses</a><div id="completion" class="completion"></div><div id="content"><div class="courseHero">Loading...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function page(name){return name+'?course='+encodeURIComponent(key)}function fmt(n){const x=Number(n);return Number.isInteger(x)?String(x):String(Number(x.toFixed(2)))}function renderCard(x){return `<${x[3]?'a':'div'} class="card ${x[3]?'':'disabled'}" style="--card-accent:${x[5]};${x[3]?'text-decoration:none;color:inherit':''}" ${x[3]?`href="${page(x[4])}"`:''}><div class="cardIcon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><div class="open">${x[3]?'OPEN →':'NOT ENABLED'}</div></${x[3]?'a':'div'}>`}async function completionState(userId,c){const required=Number(c.assignment_count||c.module_count||0);const [{data:a},{data:e}]=await Promise.all([supabaseClient.from('assignment_attempts').select('module_no,status,score,submitted_at').eq('user_id',userId).eq('course_key',key),supabaseClient.from('final_exam_attempts').select('status,score').eq('user_id',userId).eq('course_key',key).maybeSingle()]);const latest=new Map();(a||[]).forEach(x=>{const old=latest.get(Number(x.module_no));if(!old||String(x.submitted_at||'')>String(old.submitted_at||''))latest.set(Number(x.module_no),x)});let ca=0,done=0;for(let i=1;i<=required;i++){const x=latest.get(i);if(x&&x.status==='submitted'){done++;ca+=Number(x.score||0)}}const caPass=required>0&&done===required&&ca>=Number(c.ca_marks||0)*.4,eseDone=e&&['submitted','expired'].includes(e.status),ese=eseDone?Number(e.score||0):0,esePass=!!eseDone&&ese>=Number(c.ese_marks||0)*.4;return{complete:caPass&&esePass,total:ca+ese,certificateEligible:caPass&&esePass&&c.category==='mooc'&&!!c.certificate_enabled}}async function load(){const user=await requireAuth();if(!user)return;if(!key){location.replace('my-courses.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',user.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace('course-info.html?course='+encodeURIComponent(key));return}const {data:c,error}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(error||!c){content.innerHTML='<div class="courseHero">This course is not currently available.</div>';document.body.style.visibility='visible';return}const [{data:mods},state]=await Promise.all([supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('module_no'),completionState(user.id,c)]);title.textContent=c.title;subtitle.textContent=[c.course_code,c.programme,c.semester_level].filter(Boolean).join(' • ');if(state.complete){completion.className='completion show';completion.innerHTML=`<div><div class="completionTitle">✓ Course Completed</div><div class="completionSub">You have passed both CA and ESE. Final score: <strong>${fmt(state.total)} / ${fmt(Number(c.ca_marks||0)+Number(c.ese_marks||0))}</strong>.</div></div><div class="completionTag">${state.certificateEligible?'CERTIFICATE ELIGIBLE':'COMPLETED'}</div>`}const cards=[['🎥','E-Tutorial','Topic-wise video learning resources.',c.tutorial_enabled,'course-tutorial.html','#2563eb'],['📘','E-Content','Study material and structured course notes.',c.econtent_enabled,'course-content.html','#7c3aed'],['🌐','Web Resources','Curated academic references and external resources.',c.web_resources_enabled,'course-resources.html','#0891b2'],['📝','Self-Assessment','Practice activities and module assignments.',c.self_assessment_enabled,'course-assessment.html','#059669'],['💬','Discussion Forum','Course-wise learner discussion forum.',c.discussion_forum_enabled,'course-forum.html','#d97706'],['🎯','Final Examination','Final course assessment according to configured rules.',true,'course-final-exam.html','#e11d48'],['📊','Scorecard','View CA, ESE and overall course result.',true,'course-scorecard.html','#4f46e5']];content.innerHTML=`<div class="courseHero"><div class="heroTop"><div><div class="heroTitle">Course Overview</div><div class="heroSub">Your learning resources, assessments and course progress are available from this dashboard.</div></div><div class="heroActions"><a class="infoBtn" href="${page('course-info.html')}">ℹ️ COURSE INFORMATION</a><div class="pill">${esc(c.course_type||'E-Content Course')}</div></div></div><div class="meta"><div><strong>Course Code</strong><span>${esc(c.course_code||'—')}</span></div><div><strong>Credits</strong><span>${c.credits??0}</span></div><div><strong>Teaching Hours</strong><span>${c.teaching_hours??0}</span></div><div><strong>Modules</strong><span>${c.module_count??0}</span></div><div><strong>University / Institution</strong><span>${esc(c.university_name||'—')}</span></div><div><strong>Course Content Creator</strong><span>${esc(c.content_creator||'—')}</span></div></div></div><h2 class="sectionTitle">Learning & Assessment</h2><div class="twoGrid">${cards.slice(0,2).map(renderCard).join('')}</div><div class="twoGrid">${cards.slice(2,4).map(renderCard).join('')}</div><div class="threeGrid">${cards.slice(4).map(renderCard).join('')}</div><div class="modules"><h2>Course Modules</h2>${(mods||[]).map(m=>`<div class="module"><div class="moduleNo">M${m.module_no}</div><div><strong>Module ${m.module_no} — ${esc(m.module_title)}</strong><span>${esc(m.module_description||'')}</span></div></div>`).join('')||'<p>No modules configured.</p>'}</div>`;document.body.style.visibility='visible'}load();</script></body></html>
