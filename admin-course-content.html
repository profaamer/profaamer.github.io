<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course Content Manager | Admin</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827;--red:#b91c1c;--green:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.logout{border:1px solid #64748b;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:700;margin-bottom:15px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.field textarea{min-height:80px}.full{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:#fff;border:1px solid #cbd5e1}.danger{background:#fff;border:1px solid #fecaca;color:var(--red)}.status{margin-top:10px;font-size:13px;color:var(--green)}.items{display:grid;gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:14px;background:#f8fafc;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item strong{display:block}.meta{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:7px;flex-wrap:wrap}.empty{text-align:center;color:var(--muted);padding:20px}.toast{position:fixed;top:20px;right:20px;z-index:9999;min-width:290px;max-width:420px;padding:14px 17px;border-radius:10px;color:#fff;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(15,23,42,.22);opacity:0;transform:translateY(-10px);pointer-events:none;transition:.22s ease}.toast.show{opacity:1;transform:translateY(0)}.toast.success{background:#15803d}.toast.error{background:#b91c1c}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.item{flex-direction:column}.toast{left:16px;right:16px;top:16px;min-width:0;max-width:none}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-content2"></script></head><body><div id="toast" class="toast"></div><div class="header"><div class="headin"><div><h1>Course Content Manager</h1><p>Manage E-Tutorial, E-Content and Web Resources</p></div><button class="logout" onclick="adminLogout()">LOGOUT</button></div></div><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="box"><div class="grid"><div class="field"><label>Course</label><select id="course" onchange="loadModulesAndItems()"></select></div><div class="field"><label>Module</label><select id="moduleNo" onchange="loadItems()"></select></div><div class="field"><label>Quadrant</label><select id="quadrant" onchange="loadItems()"><option value="tutorial">Quadrant I — E-Tutorial</option><option value="econtent">Quadrant II — E-Content</option><option value="web_resources">Quadrant III — Web Resources</option></select></div><div class="field"><label>Item Type</label><select id="itemType"><option value="video">Video</option><option value="pdf">PDF / Document Link</option><option value="link">Web Link</option><option value="text">Text / Note</option></select></div><div class="field full"><label>Title</label><input id="itemTitle" placeholder="Topic / resource title"></div><div class="field full"><label>Description</label><textarea id="description" placeholder="Short description"></textarea></div><div class="field full"><label>Resource URL</label><input id="resourceUrl" placeholder="YouTube, PDF, Drive or website URL"></div><div class="field full"><label>Text / Note Body</label><textarea id="bodyText" placeholder="Optional text content"></textarea></div><div class="field"><label>Display Order</label><input id="sortOrder" type="number" min="1" value="1"></div><div class="field"><label>Status</label><select id="active"><option value="true">Active</option><option value="false">Inactive</option></select></div></div><div style="margin-top:14px"><button class="btn primary" onclick="saveItem()" id="saveBtn">ADD CONTENT ITEM</button> <button class="btn secondary" onclick="resetForm()">CLEAR</button></div><div id="status" class="status"></div></div><div class="box"><h2 style="margin-top:0">Current Content Items</h2><div id="items" class="items"><div class="empty">Loading...</div></div></div></div><script>let editingId=null,modules=[],toastTimer=null;function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function notify(message,type='success'){const t=document.getElementById('toast');clearTimeout(toastTimer);t.textContent=message;t.className='toast '+type+' show';toastTimer=setTimeout(()=>t.classList.remove('show'),3200)}async function guard(){const u=await getCurrentUser();if(!u){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!data){await supabaseClient.auth.signOut();location.replace('admin-login.html');return false}document.body.style.visibility='visible';return true}async function loadCourses(){const {data,error}=await supabaseClient.from('courses').select('course_key,title,course_code').order('title');if(error){status.textContent=error.message;return}course.innerHTML=(data||[]).map(c=>`<option value="${esc(c.course_key)}">${esc(c.title)}${c.course_code?' — '+esc(c.course_code):''}</option>`).join('');await loadModulesAndItems()}async function loadModulesAndItems(){const {data}=await supabaseClient.from('course_modules').select('module_no,module_title').eq('course_key',course.value).eq('is_active',true).order('module_no');modules=data||[];moduleNo.innerHTML=modules.map(m=>`<option value="${m.module_no}">Module ${m.module_no} — ${esc(m.module_title)}</option>`).join('');if(!modules.length)moduleNo.innerHTML='<option value="">No modules configured</option>';resetForm();await loadItems()}async function loadItems(){if(!course.value||!moduleNo.value){items.innerHTML='<div class="empty">No module available.</div>';return}const {data,error}=await supabaseClient.from('course_content_items').select('*').eq('course_key',course.value).eq('module_no',Number(moduleNo.value)).eq('quadrant',quadrant.value).order('sort_order').order('id');if(error){items.innerHTML='<div class="empty">'+esc(error.message)+'</div>';return}items.innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="item"><div><strong>${esc(x.title)}</strong><div class="meta">${esc(x.item_type.toUpperCase())} • Order ${x.sort_order} • ${x.is_active?'Active':'Inactive'}</div><div class="meta">${esc(x.description||'')}</div></div><div class="actions"><button class="btn secondary" onclick='editItem(${JSON.stringify(x)})'>EDIT</button><button class="btn danger" onclick="deleteItem(${x.id})">DELETE</button></div></div>`).join(''):'<div class="empty">No content items added for this module and quadrant.</div>'}function resetForm(){editingId=null;itemTitle.value='';description.value='';resourceUrl.value='';bodyText.value='';sortOrder.value=1;active.value='true';saveBtn.textContent='ADD CONTENT ITEM';status.textContent=''}function editItem(x){editingId=x.id;itemType.value=x.item_type;itemTitle.value=x.title||'';description.value=x.description||'';resourceUrl.value=x.resource_url||'';bodyText.value=x.body||'';sortOrder.value=x.sort_order||1;active.value=String(!!x.is_active);saveBtn.textContent='SAVE CHANGES';window.scrollTo({top:0,behavior:'smooth'})}async function saveItem(){if(!course.value||!moduleNo.value)return;const wasEditing=!!editingId;const row={course_key:course.value,module_no:Number(moduleNo.value),quadrant:quadrant.value,item_type:itemType.value,title:itemTitle.value.trim(),description:description.value.trim()||null,resource_url:resourceUrl.value.trim()||null,body:bodyText.value.trim()||null,sort_order:Number(sortOrder.value||1),is_active:active.value==='true',updated_at:new Date().toISOString()};if(!row.title){status.textContent='Please enter a title.';notify('Please enter a title.','error');return}status.textContent='Saving...';let error;if(editingId){({error}=await supabaseClient.from('course_content_items').update(row).eq('id',editingId))}else{({error}=await supabaseClient.from('course_content_items').insert(row))}if(error){status.textContent=error.message;notify(error.message,'error');return}resetForm();await loadItems();notify(wasEditing?'Content item updated successfully.':'Content item added successfully.');status.textContent=wasEditing?'Content item updated successfully.':'Content item added successfully.';setTimeout(()=>{status.textContent=''},3500)}async function deleteItem(id){if(!confirm('Delete this content item?'))return;const {error}=await supabaseClient.from('course_content_items').delete().eq('id',id);if(error){notify(error.message,'error');return}await loadItems();notify('Content item deleted successfully.')}async function adminLogout(){await supabaseClient.auth.signOut();location.replace('index.html')}(async()=>{if(await guard())await loadCourses()})();</script></body></html>
