<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Module 1 Assignment | Direct Taxes Law & Practice-I</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#b45309;--head:#111827;--green:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:25px 16px;text-align:center}.header h1{margin:0;font-size:25px}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:900px;margin:26px auto;padding:0 16px}.back{color:#1d4ed8;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.rules{line-height:1.65}.startbtn,.submitbtn{border:0;border-radius:8px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--accent);color:#fff}.submitbtn{background:#1d4ed8;margin-top:16px}.question{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}.question h3{font-size:16px;margin:0 0 12px}.option{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-top:8px;cursor:pointer}.option input{margin-right:8px}.msg{padding:14px;border-radius:9px;margin-top:14px;background:#f8fafc;color:var(--muted)}.result{background:#ecfdf5;border:1px solid #bbf7d0;color:var(--green);padding:16px;border-radius:10px;font-weight:700}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><h1>Module 1 Assignment</h1><p>Direct Taxes Law &amp; Practice-I</p></div><div class="wrap"><a class="back" href="direct-tax-self-assessment.html">← Self-Assessment</a><div class="box rules"><strong>Assignment Pattern</strong><br>16 random MCQs • 0.5 mark each • Maximum 8 marks • No time limit<br>Questions and answer options are shuffled for each attempt.</div><div class="box" id="startBox"><button class="startbtn" onclick="startAssignment()">START ASSIGNMENT</button><div id="startMsg" class="msg" style="display:none"></div></div><div id="examArea"></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>let attemptId=null;let questions=[];async function authHeaders(){const {data:{session}}=await supabaseClient.auth.getSession();return {'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY}}
async function startAssignment(){const user=await requireAuth();if(!user)return;const msg=document.getElementById('startMsg');msg.style.display='block';msg.textContent='Preparing your assignment...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/assignment-start',{method:'POST',headers:await authHeaders(),body:JSON.stringify({course_key:'direct-taxes-law-practice-1',module_no:1})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to start assignment');attemptId=data.attempt_id;questions=data.questions||[];renderQuestions();document.getElementById('startBox').style.display='none'}catch(e){msg.textContent=e.message==='Question bank needs at least 16 active questions'?'Module 1 question bank is not ready yet. At least 16 active MCQs are required before this assignment can start.':e.message}}
function renderQuestions(){const area=document.getElementById('examArea');area.innerHTML=questions.map(q=>'<div class="question"><h3>Q'+q.number+'. '+escapeHtml(q.question_text)+'</h3>'+q.options.map(o=>'<label class="option"><input type="radio" name="q_'+q.question_id+'" value="'+o.key+'" '+(q.selected===o.key?'checked':'')+'> '+escapeHtml(o.text)+'</label>').join('')+'</div>').join('')+'<button class="submitbtn" onclick="submitAssignment()">SUBMIT ASSIGNMENT</button><div id="submitMsg" class="msg" style="display:none"></div>'}
async function submitAssignment(){const answers={};questions.forEach(q=>{const el=document.querySelector('input[name="q_'+q.question_id+'"]:checked');if(el)answers[String(q.question_id)]=el.value});const unanswered=16-Object.keys(answers).length;if(unanswered>0&&!confirm(unanswered+' question(s) are unanswered. Submit anyway?'))return;const msg=document.getElementById('submitMsg');msg.style.display='block';msg.textContent='Submitting and evaluating...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/assignment-submit',{method:'POST',headers:await authHeaders(),body:JSON.stringify({attempt_id:attemptId,answers})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Unable to submit');document.getElementById('examArea').innerHTML='<div class="box result">Assignment submitted successfully.<br>Score: '+data.score+' / 8<br>Correct Answers: '+data.correct_count+' / 16</div>'}catch(e){msg.textContent=e.message}}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
requireAuth();</script></body></html>
