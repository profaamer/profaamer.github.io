<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Progress & Results | Content Creator</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:20px}.wrap{max-width:1250px;margin:24px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.toolbar select,.toolbar input,.toolbar button{padding:9px;border:1px solid #cbd5e1;border-radius:7px}.toolbar button{font-weight:700}.primary{background:#7c3aed;color:#fff;border-color:#7c3aed!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.stat{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:12px}.stat strong{display:block;font-size:23px;color:#7c3aed}.table{overflow:auto;margin-top:14px}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #e5e7eb;font-size:12px;text-align:left}.pass{color:#166534;font-weight:700}.pending{color:#b45309;font-weight:700}@media(max-width:700px){.stats{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator3"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1250px;margin:auto">Student Progress & Results</h1></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><div class="toolbar"><select id="course"></select><input id="search" placeholder="Search student"><button class="primary" onclick="loadResults()">REFRESH</button><button onclick="exportCSV()">EXPORT CSV</button></div><div class="stats"><div class="stat"><strong id="enrolCount">0</strong><span>Enrolled Students</span></div><div class="stat"><strong id="submittedCount">0</strong><span>Final Exams Submitted</span></div><div class="stat"><strong id="passedCount">0</strong><span>Passed Final Exam</span></div></div><div class="table"><table><thead><tr><th>Student</th><th>Email</th><th>College</th><th>Enrolled</th><th>Completed Items</th><th>Assignments Submitted</th><th>CA Score</th><th>Final Exam</th><th>ESE Score</th></tr></thead><tbody id="rows"><tr><td colspan="9">Select a course.</td></tr></tbody></table></div></div></div><script>let creator=null,all=[];const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString('en-IN'):'—'}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function loadCourses(){const {data}=await supabaseClient.from('courses').select('course_key,title,ese_marks,ese_pass_percent').eq('creator_user_id',creator.id).order('title');$('course').innerHTML=(data||[]).map(c=>`<option value="${esc(c.course_key)}" data-esemarks="${c.ese_marks||60}" data-pass="${c.ese_pass_percent||40}">${esc(c.title)}</option>`).join('');loadResults()}async function loadResults(){const k=$('course').value;if(!k){$('rows').innerHTML='<tr><td colspan="9">No courses created yet.</td></tr>';return}const [er,pr,ar,fr]=await Promise.all([supabaseClient.from('course_enrollments').select('*').eq('course_key',k).eq('status','active'),supabaseClient.from('course_progress').select('*').eq('course_key',k),supabaseClient.from('assignment_attempts').select('*').eq('course_key',k),supabaseClient.from('final_exam_attempts').select('*').eq('course_key',k)]);const enrols=er.data||[],ids=enrols.map(x=>x.user_id);let profiles=[];if(ids.length){const r=await supabaseClient.from('student_profiles').select('*').in('user_id',ids);profiles=r.data||[]}const pm=new Map(profiles.map(x=>[x.user_id,x]));const prog=new Map(),asg=new Map(),fin=new Map();(pr.data||[]).forEach(x=>{if(x.completed)prog.set(x.user_id,(prog.get(x.user_id)||0)+1)});(ar.data||[]).forEach(x=>{if(x.status==='submitted'){const o=asg.get(x.user_id)||{count:0,score:0};o.count++;o.score+=Number(x.score||0);asg.set(x.user_id,o)}});(fr.data||[]).forEach(x=>{if(x.status==='submitted'&&!fin.has(x.user_id))fin.set(x.user_id,x)});const opt=$('course').selectedOptions[0],eseMax=Number(opt?.dataset.esemarks||60),passPct=Number(opt?.dataset.pass||40);all=enrols.map(e=>{const p=pm.get(e.user_id)||{},a=asg.get(e.user_id)||{count:0,score:0},f=fin.get(e.user_id);const passed=f?Number(f.score||0)>=eseMax*passPct/100:false;return{...p,enrolled_at:e.enrolled_at,completed:prog.get(e.user_id)||0,assignments:a.count,ca_score:a.score,final_status:f?.status||'Not Attempted',ese_score:f?.score??null,passed}});render()}function render(){const q=$('search').value.toLowerCase();const d=all.filter(x=>[x.full_name,x.email,x.college_name].join(' ').toLowerCase().includes(q));$('enrolCount').textContent=all.length;$('submittedCount').textContent=all.filter(x=>x.final_status==='submitted').length;$('passedCount').textContent=all.filter(x=>x.passed).length;$('rows').innerHTML=d.length?d.map(x=>`<tr><td><strong>${esc(x.full_name||'—')}</strong></td><td>${esc(x.email||'—')}</td><td>${esc(x.college_name||'—')}</td><td>${fmt(x.enrolled_at)}</td><td>${x.completed}</td><td>${x.assignments}</td><td>${x.ca_score}</td><td class="${x.final_status==='submitted'?'pass':'pending'}">${esc(x.final_status)}</td><td>${x.ese_score??'—'}</td></tr>`).join(''):'<tr><td colspan="9">No students found.</td></tr>'}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){const h=['Student','Email','College','Enrolled At','Completed Items','Assignments Submitted','CA Score','Final Status','ESE Score'];const lines=[h.map(csv).join(',')];all.forEach(x=>lines.push([x.full_name,x.email,x.college_name,x.enrolled_at,x.completed,x.assignments,x.ca_score,x.final_status,x.ese_score].map(csv).join(',')));const b=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='creator-course-results.csv';a.click();URL.revokeObjectURL(u)}$('course').addEventListener('change',loadResults);$('search').addEventListener('input',render);guard().then(ok=>{if(ok)loadCourses()});</script></body></html>
