<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Profile | Content Creator</title><style>:root{--p:#7c3aed;--red:#b91c1c}body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:22px}.headin,.wrap{max-width:800px;margin:auto}.wrap{padding:25px 16px}.back{color:var(--p);font-weight:700;text-decoration:none}.card,.danger{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:20px;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{padding:10px 0;border-bottom:1px solid #f1f5f9}.field small{display:block;color:#6b7280;margin-bottom:4px}.danger{border-color:#fecaca}.danger h3{color:var(--red);margin-top:0}.danger p{font-size:13px;color:#6b7280;line-height:1.5}.delete{padding:11px 14px;background:#fff;color:var(--red);border:1px solid #ef4444;border-radius:8px;font-weight:700;cursor:pointer}.msg{margin-top:10px;color:var(--red);font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creatorprofile1"></script></head><body style="visibility:hidden"><div class="head"><div class="headin"><h1 style="margin:0">My Profile</h1><div>Content Creator</div></div></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="card"><div class="grid" id="details"></div></div><div class="danger"><h3>Delete My Account</h3><p>This closes your active Content Creator account. Your historical account record is archived for administrative records, and courses already created by you remain under administrator control.</p><button class="delete" onclick="del()">DELETE MY ACCOUNT</button><div id="msg" class="msg"></div></div></div><script>const E=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return}const vals=[['Full Name',data.full_name],['Email',data.email],['Department',data.department],['Designation',data.designation],['Nature of Appointment',data.nature_of_appointment],['State',data.state],['District',data.district],['College / Institute',data.college_name],['Account Status','Approved']];details.innerHTML=vals.map(x=>`<div class="field"><small>${E(x[0])}</small><strong>${E(x[1])}</strong></div>`).join('');document.body.style.visibility='visible'}async function del(){if(prompt('Type DELETE to permanently close your active Content Creator account.')!=='DELETE')return;msg.textContent='Deleting account...';const {error}=await supabaseClient.rpc('delete_my_account');if(error){msg.textContent=error.message;return}try{await supabaseClient.auth.signOut()}catch(e){}location.replace('index.html')}load();</script></body></html>
