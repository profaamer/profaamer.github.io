<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner Certificate | Y-MOOC</title><style>:root{--bg:#f4f6f9;--text:#111827;--muted:#6b7280;--p:#7c3aed;--gold:#a16207}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.wrap{max-width:1100px;margin:25px auto;padding:0 16px}.back{color:var(--p);text-decoration:none;font-weight:700}.tools{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:#1f2937}.primary{background:var(--p);color:#fff;border-color:var(--p)}.certificate{width:100%;aspect-ratio:297/210;background:#fff;border:14px solid #111827;outline:3px solid #c89b3c;outline-offset:-24px;text-align:center;padding:36px}.inner{border:1px solid #d6b66c;height:100%;padding:25px 48px;display:flex;flex-direction:column;align-items:center}.brand{font-size:18px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:10px}.brandSub{font-size:11px;letter-spacing:1px;color:#6b7280;margin-top:4px}.certificate h1{font-family:Georgia,serif;font-size:43px;margin:8px 0 14px}.sub{font-size:14px;color:var(--muted)}.name{font-family:Georgia,serif;font-size:32px;font-weight:700;margin:25px 0 20px;border-bottom:1px solid #c9a959;padding:0 38px 8px;min-width:55%}.intro{font-size:15px;margin-bottom:13px}.title{font-family:Georgia,serif;font-size:24px;font-weight:700;margin-bottom:18px}.statement{font-size:14px}.score{margin-top:17px;font-size:13px;color:#4b5563}.completionDate{margin-top:12px;font-size:11px;color:#6b7280}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;width:100%;margin-top:auto;align-items:end;padding:0 10px 18px}.sig,.verify{font-size:11px}.sigImage{height:55px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}.sigImage img{max-height:53px;max-width:175px;object-fit:contain}.principalSig img{max-height:54px;max-width:185px}.line{border-top:1px solid #374151;padding-top:7px;font-weight:700}.qr{width:90px;height:90px;margin:0 auto 5px}.code{font-family:monospace;font-weight:700;font-size:11px}.error{background:#fff;border:1px solid #fecaca;color:#991b1b;padding:18px;border-radius:10px;margin-top:16px}@media(max-width:800px){.certificate{aspect-ratio:auto;min-height:650px;padding:24px}.inner{padding:22px 14px}.certificate h1{font-size:31px}.name{font-size:25px}.bottom{grid-template-columns:1fr;gap:18px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="auth.js?v=20260826-creator-principal"></script></head><body><div class="wrap"><a class="back" href="creator-student-results.html">← Course Analytics & Learner Results</a><div class="tools"><button class="btn primary" id="download" disabled onclick="downloadJPG()">DOWNLOAD HIGH-QUALITY JPG</button><a class="btn" id="verify" target="_blank">VERIFY CERTIFICATE</a></div><div id="stage"><div class="error">Loading certificate...</div></div></div><script>let cert=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number.isInteger(Number(n))?String(Number(n)):Number(n||0).toFixed(1);const date=v=>new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'});async function load(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return}const p=new URLSearchParams(location.search),course=p.get('course'),learner=p.get('learner');const {data,error}=await supabaseClient.functions.invoke('creator-certificate-view',{body:{course_key:course,learner_id:learner}});if(error||data?.error||!data?.certificate){stage.innerHTML='<div class="error">'+esc(data?.error||error?.message||'Certificate unavailable.')+'</div>';document.body.style.visibility='visible';return}cert=data.certificate;const verifyUrl=location.origin+location.pathname.replace('creator-certificate-view.html','verify-certificate.html')+'?code='+encodeURIComponent(cert.verification_code);verify.href=verifyUrl;stage.innerHTML=`<div class="certificate" id="certificate"><div class="inner"><div class="brand">Y-MOOC</div><div class="brandSub">YESHWANT – MASSIVE OPEN ONLINE COURSES</div><h1>Certificate of Completion</h1><div class="sub">This is to certify that</div><div class="name">${esc(cert.student_name)}</div><div class="intro">has successfully completed the self-designed MOOC</div><div class="title">${esc(cert.course_title)}</div><div class="statement">and fulfilled the prescribed Continuous Assessment and End Semester Examination requirements.</div><div class="score">CA: ${num(cert.ca_score)} &nbsp; • &nbsp; ESE: ${num(cert.ese_score)} &nbsp; • &nbsp; Total: ${num(cert.total_score)} / 100</div><div class="completionDate">Date of Completion: <strong>${date(cert.completion_date)}</strong></div><div class="bottom"><div class="sig"><div class="sigImage">${cert.creator_signature_data?`<img src="${cert.creator_signature_data}" alt="Course creator signature">`:''}</div><div class="line">${esc(cert.content_creator||'Course Content Creator')}</div><div>Course Content Creator</div></div><div class="verify"><div id="qr" class="qr"></div><div class="code">${esc(cert.verification_code)}</div><div>Verification Code</div></div><div class="sig"><div class="sigImage principalSig"><img src="principal-signature.png" alt="Principal signature"></div><div class="line">Dr. G. N. Shinde</div><div>Principal</div></div></div></div></div>`;new QRCode(document.getElementById('qr'),{text:verifyUrl,width:90,height:90,correctLevel:QRCode.CorrectLevel.M});download.disabled=false;document.body.style.visibility='visible'}async function downloadJPG(){const node=document.getElementById('certificate');if(!node||!cert)return;download.disabled=true;const old=download.textContent;download.textContent='CREATING JPG...';try{if(document.fonts?.ready)await document.fonts.ready;await Promise.all([...node.querySelectorAll('img')].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));const scale=Math.max(5,4960/node.getBoundingClientRect().width),canvas=await html2canvas(node,{scale,backgroundColor:'#fff',useCORS:true,allowTaint:true,logging:false});const a=document.createElement('a');a.download=`Certificate-${cert.course_code||cert.course_key}-${cert.student_name.replace(/[^a-z0-9]+/gi,'-')}.jpg`;a.href=canvas.toDataURL('image/jpeg',1);a.click()}finally{download.disabled=false;download.textContent=old}}load();</script></body></html>
