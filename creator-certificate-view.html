<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learner Certificate | Y-MOOC</title><style>:root{--bg:#f4f6f9;--navy:#0d275c;--gold:#a96f08;--muted:#667085;--p:#7c3aed}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:#101828;visibility:hidden}.wrap{max-width:1160px;margin:25px auto;padding:0 16px}.back{color:var(--p);text-decoration:none;font-weight:700}.tools{display:flex;gap:8px;margin:15px 0;flex-wrap:wrap}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:#1f2937}.primary{background:var(--p);color:#fff;border-color:var(--p)}.certificate{width:100%;aspect-ratio:297/210;background:#fff;border:16px solid var(--navy);position:relative;text-align:center;padding:14px}.certificate:before{content:"";position:absolute;inset:8px;border:3px solid var(--gold);pointer-events:none}.certificate:after{content:"";position:absolute;inset:15px;border:1px solid #d4b36d;pointer-events:none}.inner{height:100%;padding:32px 54px 28px;display:flex;flex-direction:column;align-items:center;position:relative;z-index:1}.certNo{position:absolute;right:10px;top:2px;text-align:right;font-size:11px;color:#475467}.certNo strong{display:block;color:var(--navy);font-size:12px;margin-top:3px}.brand{font-family:Georgia,serif;font-size:48px;line-height:1;font-weight:700;letter-spacing:3px;color:var(--navy);margin-top:2px}.brandSub{font-family:Georgia,serif;font-size:18px;font-weight:700;color:var(--gold);margin-top:4px}.ornament{width:270px;border-top:1px solid #d5a642;margin:11px auto 8px;position:relative}.ornament:after{content:"◆";position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:#fff;color:var(--gold);padding:0 9px;font-size:12px}.certificate h1{font-family:Georgia,serif;text-transform:uppercase;color:var(--navy);font-size:34px;letter-spacing:1px;margin:8px 0 10px}.sub{font-family:Georgia,serif;font-size:16px}.name{font-family:Georgia,serif;font-size:34px;font-weight:700;color:var(--gold);margin:13px 0 12px;padding:0 48px 7px;border-bottom:1px solid #d5a642;min-width:55%}.intro{font-family:Georgia,serif;font-size:16px;margin-bottom:8px}.title{font-family:Georgia,serif;font-size:25px;color:var(--navy);font-weight:700;margin:0 0 8px}.statement{font-family:Georgia,serif;font-size:14px}.scores{display:grid;grid-template-columns:repeat(3,1fr);width:68%;margin-top:16px;border-top:1px solid #d5a642;border-bottom:1px solid #d5a642}.scoreCell{padding:8px 10px}.scoreCell+.scoreCell{border-left:1px solid #d5a642}.scoreCell span{display:block;font-size:10px;color:#667085;text-transform:uppercase;letter-spacing:.5px}.scoreCell strong{display:block;color:var(--navy);font-size:17px;margin-top:3px}.completionDate{font-family:Georgia,serif;margin-top:10px;font-size:13px}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:34px;width:100%;margin-top:auto;align-items:end;padding:0 16px 3px}.sig,.verify{font-size:11px;text-align:center}.sigImage{height:58px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}.sigImage img{max-height:57px;max-width:185px;object-fit:contain}.principalSig img{max-height:58px;max-width:190px}.line{border-top:1px solid var(--gold);padding-top:6px;color:var(--navy);font-weight:800;font-size:12px}.role{margin-top:3px;font-family:Georgia,serif;font-size:11px}.qr{width:88px;height:88px;margin:0 auto 5px}.code{font-family:monospace;font-weight:700;font-size:10px;color:var(--navy)}.verifyText{font-size:9px;color:#667085;margin-top:3px}.digital{font-family:Georgia,serif;font-style:italic;color:#667085;font-size:9px;margin-top:7px}.error{background:#fff;border:1px solid #fecaca;color:#991b1b;padding:18px;border-radius:10px;margin-top:16px}@media(max-width:800px){.certificate{aspect-ratio:auto;min-height:760px}.inner{padding:32px 20px}.brand{font-size:37px}.brandSub{font-size:14px}.certificate h1{font-size:27px}.name{font-size:27px}.scores{width:95%}.bottom{grid-template-columns:1fr;gap:18px;margin-top:25px}.certNo{position:static;align-self:flex-end;margin-bottom:8px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="auth.js?v=20260826-creator-cert-v2"></script></head><body><div class="wrap"><a class="back" href="creator-student-results.html">← Course Analytics & Learner Results</a><div class="tools"><button class="btn primary" id="download" disabled onclick="downloadJPG()">DOWNLOAD HIGH-QUALITY JPG</button><a class="btn" id="verify" target="_blank">VERIFY CERTIFICATE</a></div><div id="stage"><div class="error">Loading certificate...</div></div></div><script>let cert=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const num=n=>Number.isInteger(Number(n))?String(Number(n)):Number(n||0).toFixed(1);const date=v=>new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'});async function load(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return}const p=new URLSearchParams(location.search),course=p.get('course'),learner=p.get('learner');const {data,error}=await supabaseClient.functions.invoke('creator-certificate-view',{body:{course_key:course,learner_id:learner}});if(error||data?.error||!data?.certificate){stage.innerHTML='<div class="error">'+esc(data?.error||error?.message||'Certificate unavailable.')+'</div>';document.body.style.visibility='visible';return}cert=data.certificate;const verifyUrl=location.origin+location.pathname.replace('creator-certificate-view.html','verify-certificate.html')+'?code='+encodeURIComponent(cert.verification_code);verify.href=verifyUrl;stage.innerHTML=`<div class="certificate" id="certificate"><div class="inner"><div class="certNo">Certificate No.<strong>${esc(cert.verification_code)}</strong></div><div class="brand">Y-MOOC</div><div class="brandSub">Yeshwant – Massive Open Online Courses</div><div class="ornament"></div><h1>Certificate of Completion</h1><div class="sub">This is to certify that</div><div class="name">${esc(cert.student_name)}</div><div class="intro">has successfully completed the MOOC course</div><div class="title">${esc(cert.course_title)}</div><div class="statement">and fulfilled the prescribed Continuous Assessment and End Semester Examination requirements.</div><div class="scores"><div class="scoreCell"><span>Continuous Assessment</span><strong>${num(cert.ca_score)}</strong></div><div class="scoreCell"><span>End Semester Exam</span><strong>${num(cert.ese_score)}</strong></div><div class="scoreCell"><span>Total Score</span><strong>${num(cert.total_score)} / 100</strong></div></div><div class="completionDate">Date of Completion: <strong>${date(cert.completion_date)}</strong></div><div class="bottom"><div class="sig"><div class="sigImage">${cert.creator_signature_data?`<img src="${cert.creator_signature_data}" alt="Course Content Creator signature">`:''}</div><div class="line">${esc(cert.content_creator||'Course Content Creator')}</div><div class="role">Course Content Creator</div></div><div class="verify"><div id="qr" class="qr"></div><div class="code">${esc(cert.verification_code)}</div><div class="verifyText">Verification Code</div></div><div class="sig"><div class="sigImage principalSig"><img src="principal-signature.png" alt="Principal signature"></div><div class="line">Dr. G. N. Shinde</div><div class="role">Principal</div></div></div><div class="digital">This certificate is digitally verifiable through ymooc.in using the QR code or verification code.</div></div></div>`;new QRCode(document.getElementById('qr'),{text:verifyUrl,width:88,height:88,correctLevel:QRCode.CorrectLevel.M});download.disabled=false;document.body.style.visibility='visible'}async function downloadJPG(){const node=document.getElementById('certificate');if(!node||!cert)return;download.disabled=true;const old=download.textContent;download.textContent='CREATING JPG...';try{if(document.fonts?.ready)await document.fonts.ready;await Promise.all([...node.querySelectorAll('img')].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));const scale=Math.max(5,4960/node.getBoundingClientRect().width),canvas=await html2canvas(node,{scale,backgroundColor:'#fff',useCORS:true,allowTaint:true,logging:false});const a=document.createElement('a');a.download=`Certificate-${cert.course_code||cert.course_key}-${cert.student_name.replace(/[^a-z0-9]+/gi,'-')}.jpg`;a.href=canvas.toDataURL('image/jpeg',1);a.click()}finally{download.disabled=false;download.textContent=old}}load();</script></body></html>
