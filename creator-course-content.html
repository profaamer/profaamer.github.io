<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Content | Content Creator</title><style>:root{--p:#7c3aed;--line:#e5e7eb;--muted:#6b7280}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937;visibility:hidden}.head{height:106px;background:#111827;color:#fff;padding:0 16px;display:flex;align-items:center}.headin,.wrap{max-width:1100px;width:100%;margin:auto}.head h1{font-size:25px;margin:0}.head p{font-size:14px;margin:5px 0 0}.wrap{padding:24px 16px}.back{color:var(--p);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.field textarea{min-height:75px}.full{grid-column:1/-1}.btn{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff;border-color:var(--p)}.danger{color:#b91c1c;border-color:#fecaca}.topicbar{display:flex;gap:10px;align-items:end}.topicbar .field{flex:1}.quadrants{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}.q{border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:#fff;font-weight:700;text-align:left}.q.active{border-color:var(--p);background:#f5f3ff;color:#6d28d9}.item{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:9px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.actions{margin-top:8px}.empty{color:var(--muted);padding:16px;text-align:center}@media(max-width:800px){.quadrants{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.topicbar{display:block}.topicbar .btn{margin-top:8px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-topic1"></script></head><body><div class="head"><div class="headin"><h1>Course Content Manager</h1><p>Build your course by Module → Topic → Four Quadrants</p></div></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><div class="grid"><div class="field"><label>My Course</label><select id="course" onchange="loadModules()"></select></div><div class="field"><label>Module</label><select id="module" onchange="loadTopics()"></select></div></div><div class="topicbar" style="margin-top:12px"><div class="field"><label>Topic</label><select id="topic" onchange="loadItems()"></select></div><button class="btn primary" onclick="addTopic()">+ ADD TOPIC</button><button class="btn" onclick="renameTopic()">RENAME</button><button class="btn danger" onclick="deleteTopic()">DELETE TOPIC</button></div><div class="quadrants"><button class="q active" data-q="tutorial" onclick="chooseQ(this)">🎥 Quadrant I<br>E-Tutorial</button><button class="q" data-q="econtent" onclick="chooseQ(this)">📘 Quadrant II<br>E-Content</button><button class="q" data-q="web_resources" onclick="chooseQ(this)">🌐 Quadrant III<br>Web Resources</button><button class="q" data-q="self_assessment" onclick="chooseQ(this)">📝 Quadrant IV<br>Self-Assessment</button></div></div><div class="box"><h2 style="margin-top:0">Add Content Item</h2><div class="grid"><div class="field"><label>Item Type</label><select id="type"><option value="video">Video</option><option value="pdf">PDF / Notes</option><option value="link">Web Link</option><option value="text">Text Content</option><option value="assessment">Assessment / Activity</option></select></div><div class="field"><label>Display Order</label><input id="sort" type="number" min="1" value="1"></div><div class="field full"><label>Title</label><input id="title"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>Resource URL</label><input id="url"></div><div class="field full"><label>Text / Body</label><textarea id="body"></textarea></div></div><button class="btn primary" onclick="addItem()">ADD CONTENT</button><span id="msg" class="meta"></span></div><div class="box"><h2 style="margin-top:0">Current Topic Content</h2><div id="items" class="empty">Select a topic.</div></div></div><script>let creator=null,currentQ='tutorial';const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function loadCourses(){const {data}=await supabaseClient.from('courses').select('course_key,title').eq('creator_user_id',creator.id).order('title');$('course').innerHTML=(data||[]).map(c=>`<option value="${esc(c.course_key)}">${esc(c.title)}</option>`).join('');await loadModules()}async function loadModules(){const k=$('course').value;if(!k){$('module').innerHTML='';$('topic').innerHTML='';$('items').textContent='No courses created yet.';return}const {data}=await supabaseClient.from('course_modules').select('module_no,module_title').eq('course_key',k).eq('is_active',true).order('module_no');$('module').innerHTML=(data||[]).map(m=>`<option value="${m.module_no}">Module ${m.module_no}: ${esc(m.module_title)}</option>`).join('');await loadTopics()}async function loadTopics(){const k=$('course').value,m=+$('module').value;if(!k||!m){$('topic').innerHTML='';return}const {data,error}=await supabaseClient.from('course_topics').select('*').eq('course_key',k).eq('module_no',m).eq('is_active',true).order('sort_order').order('topic_no');if(error){$('items').textContent=error.message;return}$('topic').innerHTML=(data||[]).map(t=>`<option value="${t.id}">Topic ${t.topic_no}: ${esc(t.topic_title)}</option>`).join('');if(!(data||[]).length)$('topic').innerHTML='<option value="">No topics yet</option>';await loadItems()}async function addTopic(){const k=$('course').value,m=+$('module').value;if(!k||!m)return;const name=prompt('Enter topic title:');if(!name?.trim())return;const {data}=await supabaseClient.from('course_topics').select('topic_no').eq('course_key',k).eq('module_no',m).order('topic_no',{ascending:false}).limit(1);const no=(data?.[0]?.topic_no||0)+1;const {error}=await supabaseClient.from('course_topics').insert({course_key:k,module_no:m,topic_no:no,topic_title:name.trim(),sort_order:no,is_active:true});if(error){alert(error.message);return}await loadTopics()}async function renameTopic(){const id=+$('topic').value;if(!id)return;const current=$('topic').selectedOptions[0]?.textContent.replace(/^Topic \d+: /,'')||'';const name=prompt('Rename topic:',current);if(!name?.trim())return;const {error}=await supabaseClient.from('course_topics').update({topic_title:name.trim(),updated_at:new Date().toISOString()}).eq('id',id);if(error)return alert(error.message);await loadTopics()}async function deleteTopic(){const id=+$('topic').value;if(!id)return;if(!confirm('Delete this topic and all content attached to it?'))return;const {error}=await supabaseClient.from('course_topics').delete().eq('id',id);if(error)return alert(error.message);await loadTopics()}function chooseQ(btn){document.querySelectorAll('.q').forEach(x=>x.classList.remove('active'));btn.classList.add('active');currentQ=btn.dataset.q;loadItems()}async function addItem(){const k=$('course').value,m=+$('module').value,t=+$('topic').value;if(!k||!m||!t){$('msg').textContent='Add/select a topic first.';return}const ttl=$('title').value.trim();if(!ttl){$('msg').textContent='Title is required.';return}const row={course_key:k,module_no:m,topic_id:t,quadrant:currentQ,item_type:$('type').value,title:ttl,description:$('description').value.trim()||null,resource_url:$('url').value.trim()||null,body:$('body').value.trim()||null,sort_order:+$('sort').value||1,is_active:true};const {error}=await supabaseClient.from('course_content_items').insert(row);if(error){$('msg').textContent=error.message;return}$('msg').textContent='Content added.';['title','description','url','body'].forEach(i=>$(i).value='');await loadItems()}async function loadItems(){const t=+$('topic').value;if(!t){$('items').innerHTML='<div class="empty">Add a topic to begin building content.</div>';return}const {data,error}=await supabaseClient.from('course_content_items').select('*').eq('topic_id',t).eq('quadrant',currentQ).order('sort_order').order('id');if(error){$('items').textContent=error.message;return}$('items').innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><div class="meta">${esc(x.item_type)} • Order ${x.sort_order} • ${x.is_active?'Active':'Inactive'}</div><div class="meta">${esc(x.description||'')}</div><div class="actions"><button class="btn" onclick="toggleItem(${x.id},${!x.is_active})">${x.is_active?'DEACTIVATE':'ACTIVATE'}</button> <button class="btn danger" onclick="deleteItem(${x.id})">DELETE</button></div></div>`).join(''):'<div class="empty">No items in this quadrant for the selected topic.</div>'}async function toggleItem(id,v){const {error}=await supabaseClient.from('course_content_items').update({is_active:v}).eq('id',id);if(error)return alert(error.message);loadItems()}async function deleteItem(id){if(!confirm('Delete this content item?'))return;const {error}=await supabaseClient.from('course_content_items').delete().eq('id',id);if(error)return alert(error.message);loadItems()}guard().then(ok=>{if(ok)loadCourses()});</script></body></html>
