<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Content | Content Creator</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:20px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.full{grid-column:1/-1}.btn{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.primary{background:#7c3aed;color:#fff;border-color:#7c3aed}.item{border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin-top:9px}.meta{font-size:12px;color:#6b7280}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator3"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1100px;margin:auto">Course Content</h1></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><div class="grid"><div class="field"><label>My Course</label><select id="course"></select></div><div class="field"><label>Module</label><select id="module"></select></div><div class="field"><label>Quadrant</label><select id="quadrant"><option value="tutorial">E-Tutorial</option><option value="econtent">E-Content</option><option value="web">Web Resources</option></select></div><div class="field"><label>Item Type</label><select id="type"><option value="video">Video</option><option value="pdf">PDF / Notes</option><option value="link">Web Link</option><option value="text">Text Content</option></select></div><div class="field full"><label>Title</label><input id="title"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>Resource URL</label><input id="url"></div><div class="field full"><label>Text / Body</label><textarea id="body"></textarea></div></div><button class="btn primary" onclick="addItem()">ADD CONTENT</button><div id="msg"></div></div><div class="box"><h2>Existing Content</h2><div id="items">Select a course.</div></div></div><script>let creator=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function loadCourses(){const {data}=await supabaseClient.from('courses').select('course_key,title').eq('creator_user_id',creator.id).order('title');$('course').innerHTML=(data||[]).map(c=>`<option value="${esc(c.course_key)}">${esc(c.title)}</option>`).join('');await loadModules()}async function loadModules(){const k=$('course').value;if(!k){$('module').innerHTML='';$('items').textContent='No courses created yet.';return}const {data}=await supabaseClient.from('course_modules').select('*').eq('course_key',k).order('module_no');$('module').innerHTML=(data||[]).map(m=>`<option value="${m.module_no}">Module ${m.module_no}: ${esc(m.module_title)}</option>`).join('');loadItems()}async function addItem(){const k=$('course').value;if(!k)return;const r=await supabaseClient.from('course_content_items').insert({course_key:k,module_no:+$('module').value,quadrant:$('quadrant').value,item_type:$('type').value,title:$('title').value.trim(),description:$('description').value.trim()||null,resource_url:$('url').value.trim()||null,body:$('body').value.trim()||null,sort_order:0,is_active:true});if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent='Content added.';['title','description','url','body'].forEach(i=>$(i).value='');loadItems()}async function loadItems(){const k=$('course').value;if(!k)return;const {data,error}=await supabaseClient.from('course_content_items').select('*').eq('course_key',k).order('module_no').order('quadrant').order('sort_order');if(error){$('items').textContent=error.message;return}$('items').innerHTML=(data||[]).length?(data||[]).map(x=>`<div class="item"><strong>${esc(x.title)}</strong><div class="meta">Module ${x.module_no} • ${esc(x.quadrant)} • ${esc(x.item_type)} • ${x.is_active?'Active':'Inactive'}</div><div style="margin-top:8px"><button class="btn" onclick="toggleItem(${x.id},${!x.is_active})">${x.is_active?'DEACTIVATE':'ACTIVATE'}</button> <button class="btn" onclick="deleteItem(${x.id})">DELETE</button></div></div>`).join(''):'No content added yet.'}async function toggleItem(id,v){await supabaseClient.from('course_content_items').update({is_active:v}).eq('id',id);loadItems()}async function deleteItem(id){if(!confirm('Delete this content item?'))return;await supabaseClient.from('course_content_items').delete().eq('id',id);loadItems()}$('course').addEventListener('change',loadModules);guard().then(ok=>{if(ok)loadCourses()});</script></body></html>
