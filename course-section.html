<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course Section | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.header{background:var(--head);color:#fff;padding:24px 16px}.headin{max-width:950px;margin:auto}.header h1{margin:0;font-size:25px}.header p{margin:6px 0 0;color:#d1d5db}.wrap{max-width:950px;margin:24px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);font-weight:700;text-decoration:none;margin-bottom:15px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:15px}.module{padding:13px 0;border-bottom:1px solid var(--line)}.module:last-child{border-bottom:0}.module strong{display:block}.module span{font-size:13px;color:var(--muted)}.note{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:13px;color:var(--muted);font-size:13px;line-height:1.55}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-dynsection1"></script></head><body><div class="header"><div class="headin"><h1 id="sectionTitle">Loading...</h1><p id="courseTitle"></p></div></div><div class="wrap"><a id="back" class="back" href="my-courses.html">← Course Home</a><div id="content"><div class="box">Loading...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const p=new URLSearchParams(location.search),key=p.get('course'),section=p.get('section');const names={tutorial:'E-Tutorial',content:'E-Content',resources:'Web Resources',assessment:'Self-Assessment',forum:'Discussion Forum',exam:'Final Examination',scorecard:'Scorecard'};const flags={tutorial:'tutorial_enabled',content:'econtent_enabled',resources:'web_resources_enabled',assessment:'self_assessment_enabled',forum:'discussion_forum_enabled'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}async function load(){const user=await requireAuth();if(!user)return;if(!key||!section||!names[section]){location.replace('my-courses.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',user.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace(`course-info.html?course=${encodeURIComponent(key)}`);return}const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(!c){content.innerHTML='<div class="box">Course unavailable.</div>';document.body.style.visibility='visible';return}if(flags[section]&&!c[flags[section]]){content.innerHTML='<div class="box">This learning component is not enabled for this course.</div>';document.body.style.visibility='visible';return}back.href=`course.html?course=${encodeURIComponent(key)}`;sectionTitle.textContent=names[section];courseTitle.textContent=c.title;const {data:mods}=await supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('module_no');let note='';if(section==='tutorial')note='Module-wise E-Tutorial items will appear here as the administrator adds video resources.';if(section==='content')note='Module-wise E-Content/study material will appear here as the administrator adds learning resources.';if(section==='resources')note='Curated web resources will appear here as they are added for each module.';if(section==='assessment')note=`This course is configured for ${c.assignment_count??0} assignment(s), ${c.assignment_questions??0} questions per assignment and ${c.ca_marks??0} CA marks. Assignment availability will depend on the course question bank.`;if(section==='forum')note='This page is reserved for the course-specific discussion forum.';if(section==='exam')note=`Final Examination: ${c.final_exam_questions??0} questions • ${c.final_exam_minutes??0} minutes • ${c.ese_marks??0} marks • ${c.ese_pass_percent??0}% passing requirement.`;if(section==='scorecard')note=`The scorecard will combine CA (${c.ca_marks??0}) and ESE (${c.ese_marks??0}) according to the configured separate passing rules.`;content.innerHTML=`<div class="box"><div class="note">${esc(note)}</div></div><div class="box"><h2 style="margin-top:0">Course Modules</h2>${(mods||[]).map(m=>`<div class="module"><strong>Module ${m.module_no} — ${esc(m.module_title)}</strong><span>${esc(m.module_description||'')}</span></div>`).join('')||'<p>No modules configured.</p>'}</div>`;document.body.style.visibility='visible'}load();</script></body></html>
