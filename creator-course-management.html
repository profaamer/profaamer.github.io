<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Courses | Content Creator</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.full{grid-column:1/-1}.btn{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.primary{background:#7c3aed;color:#fff;border-color:#7c3aed}.row{border:1px solid #e5e7eb;border-radius:9px;padding:13px;margin:9px 0;display:flex;justify-content:space-between;gap:12px}.meta{font-size:12px;color:#6b7280}.modules{margin-top:10px}.module{border:1px solid #e5e7eb;padding:10px;border-radius:8px;margin-top:8px}.policy{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:12px;line-height:1.55;font-size:13px}.note{background:#f8fafc;border:1px solid #e5e7eb;border-radius:9px;padding:10px 12px;font-size:13px;color:#475569}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-creator-mooc2"></script></head><body style="visibility:hidden"><div class="head"><div class="headin"><h1>My Courses</h1><p>Content Creator Course Management</p></div></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><button class="btn primary" onclick="openForm()">+ ADD NEW COURSE</button><div id="list">Loading...</div></div><div id="formBox" class="box" style="display:none"><h2 id="formTitle">Create Course</h2><div class="grid"><div class="field full"><label>Course Title</label><input id="title"></div><div class="field"><label>Course Key</label><input id="key"></div><div class="field"><label>Course Code</label><input id="code"></div><div class="field"><label>Category</label><select id="category" onchange="syncCreatorCategory()"><option value="econtent">E-Content</option><option value="mooc">MOOC</option></select></div><div class="field" id="eligibilityField" style="display:none"><label>Minimum Eligibility</label><select id="eligibility"><option value="">Select eligibility</option><option>SSC Completed</option><option>HSC Completed</option><option>UG Completed</option><option>PG Completed</option></select></div><div class="field academicOnly"><label>Programme</label><input id="programme"></div><div class="field academicOnly"><label>Semester / Level</label><input id="semester"></div><div class="field"><label>Credits</label><input id="credits" type="number" value="4"></div><div class="field"><label>Teaching Hours</label><input id="hours" type="number" value="60"></div><div class="field full academicOnly"><label>University / Institution</label><input id="university"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field full"><label>Prerequisite</label><textarea id="prerequisite" placeholder="Enter None if not applicable"></textarea></div><div class="field"><label>Number of Modules / Assignments</label><input id="moduleCount" type="number" min="1" value="5" onchange="buildModules()"></div><div class="field"><label>CA Marks</label><input id="ca" type="number" value="40"></div><div class="field"><label>ESE Marks</label><input id="ese" type="number" value="60"></div><div class="field"><label>Questions per Assignment</label><input id="assignmentQuestions" type="number" min="1" value="16" oninput="showPolicy()"></div><div class="field"><label>Final Exam Questions</label><input id="finalQuestions" type="number" min="1" value="60" oninput="showPolicy()"></div><div class="field"><label>Final Exam Minutes</label><input id="minutes" type="number" min="1" value="60"></div><div class="full policy" id="policyBox"></div><div class="full note"><strong>Passing Rule:</strong> 40% separately in CA and ESE is locked. CA and ESE weightage may vary but must total 100.</div></div><div id="modules" class="modules"></div><p><label><input id="published" type="checkbox"> Published</label> &nbsp; <label><input id="enrol" type="checkbox" checked> Enrolment Open</label> &nbsp; <label id="certLabel" style="display:none"><input id="cert" type="checkbox"> Certificate Enabled</label></p><button class="btn primary" onclick="saveCourse()">SAVE COURSE</button> <button class="btn" onclick="closeForm()">CANCEL</button><div id="msg"></div></div></div><script>let creator=null,editing=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slug(v){return v.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}function assignmentMix(n){n=Math.max(0,Math.floor(Number(n)||0));return{easy:Math.ceil(n/2),moderate:Math.floor(n/2),hard:0}}function finalMix(n){n=Math.max(0,Math.floor(Number(n)||0));const a=[{k:'easy',p:.2},{k:'moderate',p:.5},{k:'hard',p:.3}].map(x=>({...x,v:n*x.p,b:Math.floor(n*x.p)}));let left=n-a.reduce((s,x)=>s+x.b,0);a.sort((x,y)=>(y.v-y.b)-(x.v-x.b));for(let i=0;i<left;i++)a[i%3].b++;const o={easy:0,moderate:0,hard:0};a.forEach(x=>o[x.k]=x.b);return o}function showPolicy(){const a=assignmentMix($('assignmentQuestions').value),f=finalMix($('finalQuestions').value);$('policyBox').innerHTML='<strong>Automatic Difficulty Policy</strong><br>Assignments: 50% Easy + 50% Moderate + 0% Hard → <b>'+a.easy+' Easy + '+a.moderate+' Moderate + '+a.hard+' Hard</b><br>Final Examination: preferred 20% Easy + 50% Moderate + 30% Hard → <b>'+f.easy+' Easy + '+f.moderate+' Moderate + '+f.hard+' Hard</b><br><span style="color:#64748b">If the preferred difficulty mix is unavailable, the final exam fills from other unseen unique questions.</span>'}function syncCreatorCategory(){const mooc=$('category').value==='mooc';document.querySelectorAll('.academicOnly').forEach(x=>x.style.display=mooc?'none':'');$('eligibilityField').style.display=mooc?'':'none';$('certLabel').style.display=mooc?'':'none';if(!mooc){$('eligibility').value='';$('cert').checked=false}else{$('programme').value='';$('semester').value='';$('university').value=''}}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function load(){const {data,error}=await supabaseClient.from('courses').select('*').eq('creator_user_id',creator.id).order('title');if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).length?(data||[]).map(c=>`<div class="row"><div><strong>${esc(c.title)}</strong><div class="meta">${esc(c.course_code||'No code')} • ${c.category==='mooc'?'MOOC':'E-Content'}${c.category==='mooc'&&c.eligibility_level?' • '+esc(c.eligibility_level):''} • ${c.module_count||0} modules • ${c.assignment_questions||0} questions/assignment • ${c.final_exam_questions||0} final questions • ${c.is_published?'Published':'Draft'}</div></div><div><button class="btn" onclick="editCourse('${c.course_key}')">EDIT</button></div></div>`).join(''):'No courses created yet.'}function openForm(){editing=null;$('formTitle').textContent='Create Course';['title','key','code','programme','semester','university','description','prerequisite'].forEach(i=>$(i).value='');$('category').value='econtent';$('eligibility').value='';$('key').disabled=false;$('credits').value=4;$('hours').value=60;$('moduleCount').value=5;$('ca').value=40;$('ese').value=60;$('assignmentQuestions').value=16;$('finalQuestions').value=60;$('minutes').value=60;$('published').checked=false;$('enrol').checked=true;$('cert').checked=false;buildModules();showPolicy();syncCreatorCategory();$('formBox').style.display='block'}function closeForm(){$('formBox').style.display='none'}function buildModules(existing=[]){const n=Math.max(1,+$('moduleCount').value||1);$('modules').innerHTML=Array.from({length:n},(_,i)=>`<div class="module"><strong>Module ${i+1}</strong><input class="mt" style="width:100%;box-sizing:border-box;margin-top:6px;padding:8px" placeholder="Module title" value="${esc(existing[i]?.module_title||'')}"></div>`).join('')}async function editCourse(k){const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',k).single();const {data:m}=await supabaseClient.from('course_modules').select('*').eq('course_key',k).order('module_no');editing=k;$('formTitle').textContent='Edit Course';$('title').value=c.title||'';$('key').value=c.course_key||'';$('key').disabled=true;$('code').value=c.course_code||'';$('category').value=c.category||'econtent';$('eligibility').value=c.eligibility_level||'';$('programme').value=c.programme||'';$('semester').value=c.semester_level||'';$('credits').value=c.credits||0;$('hours').value=c.teaching_hours||0;$('university').value=c.university_name||'';$('description').value=c.course_description||'';$('prerequisite').value=c.prerequisite||'';$('moduleCount').value=c.module_count||1;$('ca').value=c.ca_marks||40;$('ese').value=c.ese_marks||60;$('assignmentQuestions').value=c.assignment_questions||16;$('finalQuestions').value=c.final_exam_questions||60;$('minutes').value=c.final_exam_minutes||60;$('published').checked=!!c.is_published;$('enrol').checked=!!c.enrollment_open;$('cert').checked=!!c.certificate_enabled;buildModules(m||[]);showPolicy();syncCreatorCategory();$('formBox').style.display='block'}$('title').addEventListener('input',()=>{if(!editing){$('key').disabled=false;$('key').value=slug($('title').value)}});function validate(){const mooc=$('category').value==='mooc';const req=[['title','Course Title'],['key','Course Key'],['code','Course Code'],['description','Course Description'],['prerequisite','Prerequisite']];if(!mooc)req.push(['programme','Programme'],['semester','Semester / Level'],['university','University / Institution']);else req.push(['eligibility','Minimum Eligibility']);for(const [id,label] of req){if(!$(id).value.trim()){msg.textContent=label+' is required.';$(id).focus();return false}}const ca=+$('ca').value,ese=+$('ese').value;if(!(ca>0&&ese>0&&Math.abs(ca+ese-100)<.001)){msg.textContent='CA Marks + ESE Marks must equal 100.';return false}const mods=[...document.querySelectorAll('.mt')];for(let i=0;i<mods.length;i++){if(!mods[i].value.trim()){msg.textContent=`Module ${i+1} title is required.`;mods[i].focus();return false}}return true}async function saveCourse(){if(!validate())return;const k=$('key').value.trim(),mooc=$('category').value==='mooc';const aq=Math.floor(+$('assignmentQuestions').value||0),fq=Math.floor(+$('finalQuestions').value||0),mins=Math.floor(+$('minutes').value||0);if(aq<1||fq<1||mins<1){msg.textContent='Assignment questions, Final Exam questions and duration must be at least 1.';return}const am=assignmentMix(aq),fm=finalMix(fq),modsCount=+$('moduleCount').value||1;const payload={course_key:k,title:$('title').value.trim(),course_code:$('code').value.trim(),category:$('category').value,programme:mooc?null:$('programme').value.trim(),semester_level:mooc?null:$('semester').value.trim(),course_type:mooc?'Self-Designed MOOC':'E-Content Course',academic_framework:mooc?'Self-Designed':'NEP-2020',university_name:mooc?null:$('university').value.trim(),eligibility_level:mooc?$('eligibility').value:null,content_creator:creator.full_name||creator.email,creator_user_id:creator.id,course_description:$('description').value.trim(),prerequisite:$('prerequisite').value.trim(),credits:+$('credits').value||0,teaching_hours:+$('hours').value||0,module_count:modsCount,ca_marks:+$('ca').value,ese_marks:+$('ese').value,assessment_marks:(+$('ca').value)+(+ $('ese').value),ca_pass_percent:40,ese_pass_percent:40,final_exam_minutes:mins,certificate_enabled:mooc&&$('cert').checked,enrollment_open:$('enrol').checked,is_published:$('published').checked,tutorial_enabled:true,econtent_enabled:true,web_resources_enabled:true,self_assessment_enabled:true,discussion_forum_enabled:true,assignment_count:modsCount,assignment_marks_each:(+$('ca').value)/modsCount,assignment_questions:aq,assignment_easy_questions:am.easy,assignment_moderate_questions:am.moderate,assignment_hard_questions:am.hard,final_exam_questions:fq,final_easy_questions:fm.easy,final_moderate_questions:fm.moderate,final_hard_questions:fm.hard};const r=editing?await supabaseClient.from('courses').update(payload).eq('course_key',editing):await supabaseClient.from('courses').insert(payload);if(r.error){msg.textContent=r.error.message;return}await supabaseClient.from('course_modules').delete().eq('course_key',k);const mods=[...document.querySelectorAll('.mt')].map((x,i)=>({course_key:k,module_no:i+1,module_title:x.value.trim(),module_description:null,is_active:true}));const mr=await supabaseClient.from('course_modules').insert(mods);if(mr.error){msg.textContent=mr.error.message;return}msg.textContent='Course saved successfully.';$('key').disabled=false;closeForm();load()}guard().then(ok=>{if(ok)load()});</script></body></html>
