<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Courses | Content Creator</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:20px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.full{grid-column:1/-1}.btn{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.primary{background:#7c3aed;color:#fff;border-color:#7c3aed}.row{border:1px solid #e5e7eb;border-radius:9px;padding:13px;margin:9px 0;display:flex;justify-content:space-between;gap:12px}.meta{font-size:12px;color:#6b7280}.modules{margin-top:10px}.module{border:1px solid #e5e7eb;padding:10px;border-radius:8px;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator3"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1100px;margin:auto">My Courses</h1></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><button class="btn primary" onclick="openForm()">+ ADD NEW COURSE</button><div id="list">Loading...</div></div><div id="formBox" class="box" style="display:none"><h2 id="formTitle">Create Course</h2><div class="grid"><div class="field full"><label>Course Title</label><input id="title"></div><div class="field"><label>Course Key</label><input id="key"></div><div class="field"><label>Course Code</label><input id="code"></div><div class="field"><label>Category</label><select id="category"><option value="econtent">E-Content</option><option value="mooc">MOOC</option></select></div><div class="field"><label>Programme</label><input id="programme"></div><div class="field"><label>Semester / Level</label><input id="semester"></div><div class="field"><label>Credits</label><input id="credits" type="number" value="4"></div><div class="field"><label>Teaching Hours</label><input id="hours" type="number" value="60"></div><div class="field full"><label>University / Institution</label><input id="university"></div><div class="field full"><label>Description</label><textarea id="description"></textarea></div><div class="field"><label>Number of Modules</label><input id="moduleCount" type="number" min="1" value="5" onchange="buildModules()"></div><div class="field"><label>CA Marks</label><input id="ca" type="number" value="40"></div><div class="field"><label>ESE Marks</label><input id="ese" type="number" value="60"></div><div class="field"><label>Final Exam Minutes</label><input id="minutes" type="number" value="60"></div></div><div id="modules" class="modules"></div><p><label><input id="published" type="checkbox"> Published</label> &nbsp; <label><input id="enrol" type="checkbox" checked> Enrolment Open</label> &nbsp; <label><input id="cert" type="checkbox"> Certificate Enabled</label></p><button class="btn primary" onclick="saveCourse()">SAVE COURSE</button> <button class="btn" onclick="closeForm()">CANCEL</button><div id="msg"></div></div></div><script>let creator=null,editing=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function slug(v){return v.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function load(){const {data,error}=await supabaseClient.from('courses').select('*').eq('creator_user_id',creator.id).order('title');if(error){$('list').textContent=error.message;return}$('list').innerHTML=(data||[]).length?(data||[]).map(c=>`<div class="row"><div><strong>${esc(c.title)}</strong><div class="meta">${esc(c.course_code||'No code')} • ${c.category==='mooc'?'MOOC':'E-Content'} • ${c.module_count||0} modules • ${c.is_published?'Published':'Draft'}</div></div><div><button class="btn" onclick="editCourse('${c.course_key}')">EDIT</button></div></div>`).join(''):'No courses created yet.'}function openForm(){editing=null;$('formTitle').textContent='Create Course';['title','key','code','programme','semester','university','description'].forEach(i=>$(i).value='');$('credits').value=4;$('hours').value=60;$('moduleCount').value=5;$('ca').value=40;$('ese').value=60;$('minutes').value=60;$('published').checked=false;$('enrol').checked=true;$('cert').checked=false;buildModules();$('formBox').style.display='block'}function closeForm(){$('formBox').style.display='none'}function buildModules(existing=[]){const n=Math.max(1,+$('moduleCount').value||1);$('modules').innerHTML=Array.from({length:n},(_,i)=>`<div class="module"><strong>Module ${i+1}</strong><input class="mt" style="width:100%;box-sizing:border-box;margin-top:6px;padding:8px" placeholder="Module title" value="${esc(existing[i]?.module_title||'')}"></div>`).join('')}async function editCourse(k){const {data:c}=await supabaseClient.from('courses').select('*').eq('course_key',k).single();const {data:m}=await supabaseClient.from('course_modules').select('*').eq('course_key',k).order('module_no');editing=k;$('formTitle').textContent='Edit Course';$('title').value=c.title||'';$('key').value=c.course_key||'';$('key').disabled=true;$('code').value=c.course_code||'';$('category').value=c.category||'econtent';$('programme').value=c.programme||'';$('semester').value=c.semester_level||'';$('credits').value=c.credits||0;$('hours').value=c.teaching_hours||0;$('university').value=c.university_name||'';$('description').value=c.course_description||'';$('moduleCount').value=c.module_count||1;$('ca').value=c.ca_marks||40;$('ese').value=c.ese_marks||60;$('minutes').value=c.final_exam_minutes||60;$('published').checked=!!c.is_published;$('enrol').checked=!!c.enrollment_open;$('cert').checked=!!c.certificate_enabled;buildModules(m||[]);$('formBox').style.display='block'}$('title').addEventListener('input',()=>{if(!editing){$('key').disabled=false;$('key').value=slug($('title').value)}});async function saveCourse(){const k=$('key').value.trim();if(!k||!$('title').value.trim()){msg.textContent='Course title and key are required.';return}const payload={course_key:k,title:$('title').value.trim(),course_code:$('code').value.trim()||null,category:$('category').value,programme:$('programme').value.trim()||null,semester_level:$('semester').value.trim()||null,credits:+$('credits').value||0,teaching_hours:+$('hours').value||0,module_count:+$('moduleCount').value||1,university_name:$('university').value.trim()||null,content_creator:creator.full_name||creator.email,creator_user_id:creator.id,course_description:$('description').value.trim()||null,ca_marks:+$('ca').value||40,ese_marks:+$('ese').value||60,assessment_marks:(+$('ca').value||40)+(+$('ese').value||60),ca_pass_percent:40,ese_pass_percent:40,final_exam_minutes:+$('minutes').value||60,certificate_enabled:$('cert').checked,enrollment_open:$('enrol').checked,is_published:$('published').checked,tutorial_enabled:true,econtent_enabled:true,web_resources_enabled:true,self_assessment_enabled:true,discussion_forum_enabled:true,assignment_count:+$('moduleCount').value||1,assignment_marks_each:(+$('ca').value||40)/(+$('moduleCount').value||1),assignment_questions:16,assignment_easy_questions:8,assignment_moderate_questions:8,assignment_hard_questions:0,final_exam_questions:60,final_easy_questions:12,final_moderate_questions:30,final_hard_questions:18};let r=editing?await supabaseClient.from('courses').update(payload).eq('course_key',editing):await supabaseClient.from('courses').insert(payload);if(r.error){msg.textContent=r.error.message;return}await supabaseClient.from('course_modules').delete().eq('course_key',k);const mods=[...document.querySelectorAll('.mt')].map((x,i)=>({course_key:k,module_no:i+1,module_title:x.value.trim()||`Module ${i+1}`,module_description:null,is_active:true}));const mr=await supabaseClient.from('course_modules').insert(mods);if(mr.error){msg.textContent=mr.error.message;return}msg.textContent='Course saved.';$('key').disabled=false;closeForm();load()}guard().then(ok=>{if(ok)load()});</script></body></html>
