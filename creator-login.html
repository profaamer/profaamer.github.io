<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Creator Login</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.wrap{max-width:460px;margin:70px auto;padding:20px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:26px}.card h1{margin-top:0}.btn{width:100%;padding:12px;border:0;border-radius:8px;background:#7c3aed;color:#fff;font-weight:700;cursor:pointer}.muted{color:#6b7280;font-size:13px;line-height:1.5}.status{margin-top:14px;font-size:13px}.back{display:block;margin-top:18px;text-align:center;color:#7c3aed;text-decoration:none;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator2"></script></head><body><div class="wrap"><div class="card"><h1>Content Creator Login</h1><p class="muted">Sign in with Google. New Content Creator accounts require administrator approval before course-management access is enabled.</p><button class="btn" onclick="creatorGoogle()">CONTINUE WITH GOOGLE</button><div id="status" class="status"></div><a class="back" href="index.html">← Learning Portal</a></div></div><script>async function creatorGoogle(){const {error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/creator-login.html'}});if(error)status.textContent=error.message}async function check(){const {data:{user}}=await supabaseClient.auth.getUser();if(!user)return;const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',user.id).maybeSingle();if(data?.status==='approved'){location.replace('creator-dashboard.html');return}if(!data){const name=user.user_metadata?.full_name||user.user_metadata?.name||'';const {error}=await supabaseClient.from('content_creators').insert({user_id:user.id,email:user.email,full_name:name,status:'pending'});if(error){status.textContent=error.message;return}}status.innerHTML='<strong>Approval pending.</strong><br>Your Content Creator account has been received. An administrator must approve it before you can create or manage courses.'}check();</script></body></html>
