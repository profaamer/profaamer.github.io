<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course Information | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--green:#166534;--red:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:27px 16px;text-align:center}.header h1{margin:0;font-size:27px}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:980px;margin:26px auto;padding:0 16px}.back{color:var(--accent);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.box h2{margin:0 0 14px;font-size:20px}.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.fact{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px}.fact strong{display:block;font-size:20px;color:var(--accent)}.fact span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{width:32%;color:#374151}ol{padding-left:22px;line-height:1.65}.modules{display:grid;gap:9px}.module{border:1px solid var(--line);border-radius:9px;padding:13px}.module strong{display:block}.module span{font-size:13px;color:var(--muted)}.cta{display:flex;justify-content:center;margin-top:18px}.actionbtn{border:0;border-radius:9px;padding:12px 20px;font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;background:var(--accent);color:#fff}.actionbtn:disabled{background:#94a3b8}.status{text-align:center;margin-top:10px;color:var(--green);font-size:13px}.warn{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:13px;margin-top:10px;color:#7f1d1d;font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:700px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:430px){.facts{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-dyninfo1"></script><script src="course-actions.js?v=20260816-dyninfo1"></script></head><body><div class="header"><h1>Course Information</h1><p id="headTitle">Loading course...</p></div><div class="wrap"><a id="back" class="back" href="dashboard.html">← Courses</a><div id="content"><div class="box">Loading course information...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');let course=null,isEnrolled=false;const legacyHome={'direct-taxes-law-practice-1':'direct-tax-course.html'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function homeUrl(){return legacyHome[key]||`course.html?course=${encodeURIComponent(key)}`}function listHtml(arr){return Array.isArray(arr)&&arr.length?'<ol>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>':'<p style="color:#6b7280">Not specified.</p>'}async function load(){const user=await requireAuth();if(!user)return;if(!key){content.innerHTML='<div class="box">Course not specified.</div>';return}const {data,error}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(error||!data){content.innerHTML='<div class="box">This course is not available.</div>';return}course=data;headTitle.textContent=course.title;back.href=course.category==='mooc'?'mooc.html':'econtent.html';const {data:mods}=await supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('module_no');const en=await getEnrollment(key);isEnrolled=!!(en&&en.status==='active');const assessmentTotal=Number(course.ca_marks||0)+Number(course.ese_marks||0);content.innerHTML=`<div class="box"><div class="facts"><div class="fact"><strong>${course.credits??0}</strong><span>Credits</span></div><div class="fact"><strong>${course.teaching_hours??0}</strong><span>Teaching Hours</span></div><div class="fact"><strong>${course.module_count??0}</strong><span>Course Modules</span></div><div class="fact"><strong>${assessmentTotal}</strong><span>Assessment Marks</span></div></div></div><div class="cta"><button class="actionbtn" id="topAction" onclick="act()">${isEnrolled?'OPEN COURSE':(course.enrollment_open?'ENROL NOW':'ENROLMENT CLOSED')}</button></div><div class="box"><h2>Course Details</h2><table><tr><th>Course Title</th><td>${esc(course.title)}</td></tr><tr><th>Course Code</th><td>${esc(course.course_code||'—')}</td></tr><tr><th>Programme</th><td>${esc(course.programme||'—')}</td></tr><tr><th>Semester / Level</th><td>${esc(course.semester_level||'—')}</td></tr><tr><th>Course Type</th><td>${esc(course.course_type||'—')}</td></tr><tr><th>Category</th><td>${course.category==='mooc'?'MOOC':'E-Content'}</td></tr><tr><th>Academic Framework</th><td>${esc(course.academic_framework||'—')}</td></tr><tr><th>Effective From</th><td>${esc(course.effective_from||'—')}</td></tr><tr><th>University / Institution</th><td>${esc(course.university_name||'—')}</td></tr><tr><th>Course Content Creator</th><td>${esc(course.content_creator||'—')}</td></tr><tr><th>Prerequisite</th><td>${esc(course.prerequisite||'—')}</td></tr></table></div>${course.course_description?`<div class="box"><h2>Course Description</h2><p>${esc(course.course_description)}</p></div>`:''}<div class="box"><h2>Course Objectives</h2>${listHtml(course.objectives)}</div><div class="box"><h2>Course Outcomes</h2>${listHtml(course.outcomes)}</div><div class="box"><h2>Assessment & Passing Scheme</h2><table><tr><th>Continuous Assessment (CA)</th><td>${course.ca_marks} Marks</td></tr><tr><th>Final Examination (ESE)</th><td>${course.ese_marks} Marks</td></tr><tr><th>CA Passing Requirement</th><td>${course.ca_pass_percent}%</td></tr><tr><th>ESE Passing Requirement</th><td>${course.ese_pass_percent}%</td></tr><tr><th>Final Exam Questions</th><td>${course.final_exam_questions??'—'}</td></tr><tr><th>Final Exam Duration</th><td>${course.final_exam_minutes??'—'} Minutes</td></tr></table><div class="warn">CA and ESE passing requirements are evaluated separately according to the course settings.</div></div><div class="box"><h2>Course Content</h2><div class="modules">${(mods||[]).map(m=>`<div class="module"><strong>Module ${m.module_no} — ${esc(m.module_title)}</strong><span>${esc(m.module_description||'')}</span></div>`).join('')||'<p>No modules available.</p>'}</div></div><div class="box"><h2>Learning Framework</h2><table><tr><th>Quadrant I</th><td>${course.tutorial_enabled?'E-Tutorial enabled':'Not enabled'}</td></tr><tr><th>Quadrant II</th><td>${course.econtent_enabled?'E-Content enabled':'Not enabled'}</td></tr><tr><th>Quadrant III</th><td>${course.web_resources_enabled?'Web Resources enabled':'Not enabled'}</td></tr><tr><th>Quadrant IV</th><td>${course.self_assessment_enabled?'Self-Assessment enabled':'Not enabled'}</td></tr><tr><th>Discussion Forum</th><td>${course.discussion_forum_enabled?'Enabled':'Not enabled'}</td></tr><tr><th>Certificate</th><td>${course.certificate_enabled?'Available subject to eligibility':'Not applicable'}</td></tr></table></div><div class="cta"><button class="actionbtn" id="bottomAction" onclick="act()">${isEnrolled?'OPEN COURSE':(course.enrollment_open?'ENROL NOW':'ENROLMENT CLOSED')}</button></div><div id="status" class="status"></div>`;if(!course.enrollment_open&&!isEnrolled){topAction.disabled=bottomAction.disabled=true}}async function act(){if(isEnrolled){location.href=homeUrl();return}if(!course.enrollment_open)return;topAction.disabled=bottomAction.disabled=true;topAction.textContent=bottomAction.textContent='ENROLLING...';await enrollInCourse(key,course.category,'topAction','status');const en=await getEnrollment(key);if(en&&en.status==='active'){isEnrolled=true;topAction.disabled=bottomAction.disabled=false;topAction.textContent=bottomAction.textContent='OPEN COURSE';status.textContent='Enrolment successful. You can now open the course.'}else{topAction.disabled=bottomAction.disabled=false;topAction.textContent=bottomAction.textContent='ENROL NOW'}}load();</script></body></html>
