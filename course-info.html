<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Course Information | Y-MOOC</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--green:#166534;--week:#eef2ff;--weektext:#3730a3}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff}.wrap{max-width:980px;margin:26px auto;padding:0 16px}.back{color:var(--accent);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.facts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.fact{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px}.fact strong{display:block;font-size:20px;color:var(--accent)}.fact span{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{width:32%}ol{line-height:1.65}.week{border:1px solid #c7d2fe;border-radius:10px;margin-top:12px;overflow:hidden}.weekHead{background:var(--week);color:var(--weektext);padding:10px 13px;font-weight:800}.module{border-top:1px solid var(--line);padding:13px}.module strong{display:block}.module span{font-size:13px;color:var(--muted)}.cta{text-align:center;margin-top:18px}.btn{border:0;border-radius:9px;padding:12px 20px;font-weight:700;background:var(--accent);color:#fff;cursor:pointer}.btn:disabled{background:#94a3b8}.status{text-align:center;margin-top:10px;color:var(--green);font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#ede9fe;color:#6d28d9;font-size:11px;font-weight:800}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:700px){.facts{grid-template-columns:1fr 1fr}}@media(max-width:430px){.facts{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260826-week-structure"></script><script src="course-actions.js?v=20260821-creator-learner1"></script></head><body><div class="header"><div class="headin"><h1>Course Information</h1><p id="headTitle">Loading course...</p></div></div><div class="wrap"><a id="back" class="back" href="dashboard.html">← Courses</a><div id="content"><div class="box">Loading course information...</div></div></div><div class="footer">© 2026 Y-MOOC • Yeshwant Mahavidyalaya, Nanded</div><script>const key=new URLSearchParams(location.search).get('course');let course=null,isEnrolled=false,isOwnCourse=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function listHtml(arr){return Array.isArray(arr)&&arr.length?'<ol>'+arr.map(x=>`<li>${esc(x)}</li>`).join('')+'</ol>':'<p style="color:#6b7280">Not specified.</p>'}async function load(){const user=await requireAuth();if(!user)return;if(!key){content.innerHTML='<div class="box">Course not specified.</div>';return}const {data,error}=await supabaseClient.from('courses').select('*').eq('course_key',key).eq('is_published',true).maybeSingle();if(error||!data){content.innerHTML='<div class="box">This course is not available.</div>';return}course=data;const isMooc=course.category==='mooc';headTitle.textContent=course.title;back.href=isMooc?'mooc.html':'econtent.html';const [{data:mods},en,{data:creator}]=await Promise.all([supabaseClient.from('course_modules').select('*').eq('course_key',key).eq('is_active',true).order('week_no').order('module_no'),getEnrollment(key),supabaseClient.from('content_creators').select('user_id,status').eq('user_id',user.id).maybeSingle()]);isEnrolled=!!(en&&['active','completed'].includes(en.status));isOwnCourse=creator?.status==='approved'&&course.creator_user_id===user.id;const total=Number(course.ca_marks||0)+Number(course.ese_marks||0),weeks=Number(course.week_count||course.credits||1);const detailRows=isMooc?`<tr><th>Course Title</th><td>${esc(course.title)}</td></tr><tr><th>Course Code</th><td>${esc(course.course_code||'—')}</td></tr><tr><th>Category</th><td><span class="pill">MOOC</span></td></tr><tr><th>Minimum Eligibility</th><td>${esc(course.eligibility_level||'—')}</td></tr><tr><th>Academic Framework</th><td>${esc(course.academic_framework||'Self-Designed')}</td></tr><tr><th>Effective From</th><td>${esc(course.effective_from||'—')}</td></tr><tr><th>Course Content Creator</th><td>${esc(course.content_creator||'—')}</td></tr><tr><th>Prerequisite</th><td>${esc(course.prerequisite||'—')}</td></tr>`:`<tr><th>Course Title</th><td>${esc(course.title)}</td></tr><tr><th>Course Code</th><td>${esc(course.course_code||'—')}</td></tr><tr><th>Programme</th><td>${esc(course.programme||'—')}</td></tr><tr><th>Semester / Level</th><td>${esc(course.semester_level||'—')}</td></tr><tr><th>Course Type</th><td>${esc(course.course_type||'—')}</td></tr><tr><th>Category</th><td>E-Content</td></tr><tr><th>Academic Framework</th><td>${esc(course.academic_framework||'—')}</td></tr><tr><th>Effective From</th><td>${esc(course.effective_from||'—')}</td></tr><tr><th>University / Institution</th><td>${esc(course.university_name||'—')}</td></tr><tr><th>Course Content Creator</th><td>${esc(course.content_creator||'—')}</td></tr><tr><th>Prerequisite</th><td>${esc(course.prerequisite||'—')}</td></tr>`;const certificateRow=isMooc?`<tr><th>Certificate</th><td>${course.certificate_enabled?'Available after successful completion':'Not enabled'}</td></tr>`:'';const actionLabel=isOwnCourse?'YOUR COURSE':(isEnrolled?'OPEN COURSE':(course.enrollment_open?'ENROL NOW':'ENROLMENT CLOSED'));const weekHtml=Array.from({length:weeks},(_,i)=>{const ms=(mods||[]).filter(m=>Number(m.week_no)===i+1);return `<div class="week"><div class="weekHead">Week ${i+1} of ${weeks}</div>${ms.length?ms.map(m=>`<div class="module"><strong>Module ${m.module_no} — ${esc(m.module_title)}</strong><span>${esc(m.module_description||'')}</span></div>`).join(''):'<div class="module"><span>No module assigned to this week.</span></div>'}</div>`}).join('');content.innerHTML=`<div class="box"><div class="facts"><div class="fact"><strong>${course.credits??0}</strong><span>Credits</span></div><div class="fact"><strong>${weeks}</strong><span>Weeks</span></div><div class="fact"><strong>${course.teaching_hours??0}</strong><span>Teaching Hours</span></div><div class="fact"><strong>${course.module_count??0}</strong><span>Modules</span></div><div class="fact"><strong>${total}</strong><span>Assessment Marks</span></div></div><p style="font-size:12px;color:#6b7280;margin:12px 2px 0"><strong>Y-MOOC course structure:</strong> Course → Week → Module → Quadrants. 1 Credit = 1 Week.</p></div><div class="cta"><button id="topAction" class="btn" onclick="act()">${actionLabel}</button></div><div class="box"><h2>Course Details</h2><table>${detailRows}<tr><th>Credits / Duration</th><td>${course.credits??0} Credits • ${weeks} Weeks</td></tr></table></div>${course.course_description?`<div class="box"><h2>Course Description</h2><p>${esc(course.course_description)}</p></div>`:''}<div class="box"><h2>Course Objectives</h2>${listHtml(course.objectives)}</div><div class="box"><h2>Course Outcomes</h2>${listHtml(course.outcomes)}</div><div class="box"><h2>Assessment & Passing Scheme</h2><table><tr><th>Continuous Assessment (CA)</th><td>${course.ca_marks} Marks</td></tr><tr><th>Final Examination (ESE)</th><td>${course.ese_marks} Marks</td></tr><tr><th>CA Passing Requirement</th><td>40% (Locked)</td></tr><tr><th>ESE Passing Requirement</th><td>40% (Locked)</td></tr><tr><th>Questions per Assignment</th><td>${course.assignment_questions??'—'}</td></tr><tr><th>Final Exam Questions</th><td>${course.final_exam_questions??'—'}</td></tr><tr><th>Final Exam Duration</th><td>${course.final_exam_minutes??'—'} Minutes</td></tr></table></div><div class="box"><h2>Weeks & Modules</h2>${weekHtml}</div><div class="box"><h2>Four-Quadrant Learning Framework</h2><table><tr><th>Quadrant I</th><td>${course.tutorial_enabled?'E-Tutorial enabled':'Not enabled'}</td></tr><tr><th>Quadrant II</th><td>${course.econtent_enabled?'E-Content enabled':'Not enabled'}</td></tr><tr><th>Quadrant III</th><td>${course.web_resources_enabled?'Web Resources enabled':'Not enabled'}</td></tr><tr><th>Quadrant IV</th><td>${course.self_assessment_enabled?'Self-Assessment enabled':'Not enabled'}</td></tr><tr><th>Discussion Forum</th><td>${course.discussion_forum_enabled?'Enabled':'Not enabled'}</td></tr>${certificateRow}</table></div><div class="cta"><button id="bottomAction" class="btn" onclick="act()">${actionLabel}</button></div><div id="status" class="status">${isOwnCourse?'You are the Course Content Creator of this course. Enrolment in your own course is not permitted.':''}</div>`;if(isOwnCourse||(!course.enrollment_open&&!isEnrolled)){topAction.disabled=bottomAction.disabled=true}}async function act(){if(isOwnCourse)return;if(isEnrolled){location.href=`course.html?course=${encodeURIComponent(key)}`;return}if(!course.enrollment_open)return;topAction.disabled=bottomAction.disabled=true;topAction.textContent=bottomAction.textContent='ENROLLING...';await enrollInCourse(key,course.category,'topAction','status');const en=await getEnrollment(key);if(en&&['active','completed'].includes(en.status)){isEnrolled=true;topAction.disabled=bottomAction.disabled=false;topAction.textContent=bottomAction.textContent='OPEN COURSE';status.textContent='Enrolment successful.'}else{topAction.disabled=bottomAction.disabled=false;topAction.textContent=bottomAction.textContent='ENROL NOW'}}load();</script></body></html>
