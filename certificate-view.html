<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certificate | Commerce and Management Learning</title><style>:root{--bg:#f4f6f9;--text:#111827;--muted:#6b7280;--accent:#7c3aed;--gold:#a16207}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.container{max-width:1100px;margin:26px auto;padding:0 16px}.back{color:var(--accent);text-decoration:none;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:#1f2937}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.certificateWrap{background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.08);padding:0}.certificate{width:100%;aspect-ratio:297/210;background:#fff;border:14px solid #111827;outline:3px solid #c89b3c;outline-offset:-24px;position:relative;text-align:center;padding:36px}.inner{border:1px solid #d6b66c;height:100%;padding:28px 48px;display:flex;flex-direction:column;align-items:center}.eyebrow{font-size:13px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:18px;margin-bottom:0}.certificate h1{font-family:Georgia,serif;font-size:43px;margin:10px 0 14px}.sub{font-size:14px;color:var(--muted)}.name{font-family:Georgia,serif;font-size:32px;font-weight:700;margin:25px 0 20px;border-bottom:1px solid #c9a959;padding:0 38px 8px;min-width:55%}.courseIntro{font-size:15px;margin-bottom:13px}.courseTitle{font-family:Georgia,serif;font-size:24px;font-weight:700;margin:0 0 18px}.statement{font-size:14px;line-height:1.5;max-width:760px}.score{margin-top:17px;font-size:13px;color:#4b5563}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:28px;width:100%;margin-top:auto;align-items:end;padding:0 10px 18px}.sig,.verify{text-align:center;font-size:11px}.sigImage{height:55px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:4px}.sigImage img{max-height:53px;max-width:175px;object-fit:contain}.line{border-top:1px solid #374151;padding-top:7px;font-weight:700}.qr{width:90px;height:90px;margin:0 auto 5px}.code{font-family:monospace;font-weight:700;font-size:11px;margin-top:4px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}.error{background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:20px;margin-top:16px}@media(max-width:800px){.certificate{aspect-ratio:auto;min-height:650px;padding:24px}.inner{padding:22px 14px}.certificate h1{font-size:31px}.name{font-size:25px}.bottom{grid-template-columns:1fr;gap:18px;margin-top:28px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="auth.js?v=20260821-cert-jpg2"></script></head><body><div class="container"><a class="back" href="certificates.html">← My Certificates</a><div class="toolbar"><button class="btn primary" id="downloadBtn" onclick="downloadJPG()" disabled>DOWNLOAD HIGH-QUALITY JPG</button><a class="btn" id="verifyBtn" href="#">VERIFY CERTIFICATE</a></div><div id="stage"><div class="error">Loading certificate...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let cert=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number.isInteger(Number(n))?String(Number(n)):String(Number(Number(n).toFixed(2)));function d(v){return new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})}function sigHtml(){return cert.creator_signature_data?`<div class="sigImage"><img src="${cert.creator_signature_data}" alt="Course creator signature"></div>`:'<div class="sigImage"></div>'}async function load(){const u=await requireAuth();if(!u)return;const key=new URLSearchParams(location.search).get('course');if(!key){stage.innerHTML='<div class="error">Course not specified.</div>';return}const {data,error}=await supabaseClient.from('course_certificates').select('*').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(error||!data){stage.innerHTML='<div class="error">No issued certificate found for this course.</div>';return}cert=data;const verifyUrl=location.origin+location.pathname.replace('certificate-view.html','verify-certificate.html')+'?code='+encodeURIComponent(cert.verification_code);verifyBtn.href=verifyUrl;stage.innerHTML=`<div class="certificateWrap"><div class="certificate" id="certificate"><div class="inner"><div class="eyebrow">Commerce and Management Learning</div><h1>Certificate of Completion</h1><div class="sub">This is to certify that</div><div class="name">${esc(cert.student_name)}</div><div class="courseIntro">has successfully completed the self-designed MOOC</div><div class="courseTitle">${esc(cert.course_title)}</div><div class="statement">and fulfilled the prescribed Continuous Assessment and End Semester Examination requirements.</div><div class="score">CA: ${fmt(cert.ca_score)} &nbsp; • &nbsp; ESE: ${fmt(cert.ese_score)} &nbsp; • &nbsp; Total: ${fmt(cert.total_score)} / 100</div><div class="bottom"><div class="sig">${sigHtml()}<div class="line">${esc(cert.content_creator||'Course Content Creator')}</div><div>Course Content Creator</div></div><div class="verify"><div id="qr" class="qr"></div><div class="code">${esc(cert.verification_code)}</div><div>Verification Code</div></div><div class="sig"><div class="sigImage"></div><div class="line">${d(cert.completion_date)}</div><div>Date of Completion</div></div></div></div></div></div>`;new QRCode(document.getElementById('qr'),{text:verifyUrl,width:90,height:90,correctLevel:QRCode.CorrectLevel.M});downloadBtn.disabled=false}async function downloadJPG(){if(!cert)return;const btn=document.getElementById('downloadBtn'),node=document.getElementById('certificate');btn.disabled=true;const old=btn.textContent;btn.textContent='CREATING JPG...';try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;const imgs=[...node.querySelectorAll('img')];await Promise.all(imgs.map(img=>img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r})));const targetWidth=4960;const scale=Math.max(5,targetWidth/node.getBoundingClientRect().width);const canvas=await html2canvas(node,{scale,backgroundColor:'#ffffff',useCORS:true,allowTaint:true,logging:false,imageTimeout:15000,removeContainer:true});const a=document.createElement('a');a.download=`Certificate-${cert.course_code||cert.course_key}-${cert.student_name.replace(/[^a-z0-9]+/gi,'-')}.jpg`;a.href=canvas.toDataURL('image/jpeg',1.0);document.body.appendChild(a);a.click();a.remove()}catch(e){console.error(e);alert('Certificate image could not be created. Please try again.')}finally{btn.disabled=false;btn.textContent=old}}load();</script></body></html>
