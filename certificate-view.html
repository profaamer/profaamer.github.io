<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certificate | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#111827;--muted:#6b7280;--line:#d1d5db;--accent:#7c3aed;--gold:#a16207}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:#111827;color:#fff}.container{max-width:1100px;margin:26px auto;padding:0 16px}.back{color:var(--accent);text-decoration:none;font-weight:700}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.btn{border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;color:#1f2937}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.certificate{background:#fff;aspect-ratio:1.414/1;border:14px solid #111827;outline:3px solid #c89b3c;outline-offset:-24px;position:relative;padding:58px 70px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.08)}.inner{border:1px solid #d6b66c;height:100%;padding:34px 48px;display:flex;flex-direction:column;align-items:center;justify-content:center}.eyebrow{font-size:14px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);font-weight:700}.certificate h1{font-family:Georgia,serif;font-size:46px;margin:10px 0 3px}.sub{font-size:15px;color:var(--muted)}.name{font-family:Georgia,serif;font-size:34px;font-weight:700;margin:22px 0 9px;border-bottom:1px solid #c9a959;padding:0 30px 7px}.courseTitle{font-family:Georgia,serif;font-size:25px;font-weight:700;margin:14px 0 6px}.statement{font-size:16px;line-height:1.7;max-width:760px}.bottom{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;width:100%;margin-top:26px;align-items:end}.sig,.verify{text-align:center;font-size:12px}.sigImage{height:58px;display:flex;align-items:flex-end;justify-content:center;margin-bottom:2px}.sigImage img{max-height:56px;max-width:170px;object-fit:contain}.line{border-top:1px solid #374151;padding-top:7px;font-weight:700}.code{font-family:monospace;font-weight:700;font-size:12px;margin-top:4px}.score{margin-top:14px;font-size:13px;color:#4b5563}.qr{width:92px;height:92px;margin:0 auto 5px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}.error{background:#fff;border:1px solid #fecaca;color:#991b1b;border-radius:10px;padding:20px;margin-top:16px}@media(max-width:800px){.certificate{aspect-ratio:auto;padding:30px 20px}.inner{padding:28px 16px}.certificate h1{font-size:32px}.name{font-size:26px}.bottom{grid-template-columns:1fr;gap:18px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="auth.js?v=20260818-cert-signature1"></script></head><body><div class="header"><div class="headin"><h1>Course Certificate</h1><p>Verified MOOC Completion Certificate</p></div></div><div class="container"><a class="back" href="certificates.html">← My Certificates</a><div class="toolbar"><button class="btn primary" id="downloadBtn" onclick="downloadPDF()" disabled>DOWNLOAD PDF</button><a class="btn" id="verifyBtn" href="#">VERIFY CERTIFICATE</a></div><div id="stage"><div class="error">Loading certificate...</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let cert=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number.isInteger(Number(n))?String(Number(n)):String(Number(Number(n).toFixed(2)));function d(v){return new Date(v+'T00:00:00').toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})}function sigHtml(){return cert.creator_signature_data?`<div class="sigImage"><img src="${cert.creator_signature_data}" alt="Course creator signature"></div>`:'<div class="sigImage"></div>'}async function load(){const u=await requireAuth();if(!u)return;const key=new URLSearchParams(location.search).get('course');if(!key){stage.innerHTML='<div class="error">Course not specified.</div>';return}const {data,error}=await supabaseClient.from('course_certificates').select('*').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(error||!data){stage.innerHTML='<div class="error">No issued certificate found for this course.</div>';return}cert=data;const verifyUrl=location.origin+location.pathname.replace('certificate-view.html','verify-certificate.html')+'?code='+encodeURIComponent(cert.verification_code);verifyBtn.href=verifyUrl;stage.innerHTML=`<div class="certificate" id="certificate"><div class="inner"><div class="eyebrow">Commerce and Management Learning Portal</div><h1>Certificate of Completion</h1><div class="sub">This is to certify that</div><div class="name">${esc(cert.student_name)}</div><div class="statement">has successfully completed the self-designed MOOC</div><div class="courseTitle">${esc(cert.course_title)}</div><div class="statement">and fulfilled the prescribed Continuous Assessment and End Semester Examination requirements.</div><div class="score">CA: ${fmt(cert.ca_score)} • ESE: ${fmt(cert.ese_score)} • Total: ${fmt(cert.total_score)} / 100</div><div class="bottom"><div class="sig">${sigHtml()}<div class="line">${esc(cert.content_creator||'Course Content Creator')}</div><div>Course Content Creator</div></div><div class="verify"><div id="qr" class="qr"></div><div class="code">${esc(cert.verification_code)}</div><div>Verification Code</div></div><div class="sig"><div class="sigImage"></div><div class="line">${d(cert.completion_date)}</div><div>Date of Completion</div></div></div></div></div>`;new QRCode(document.getElementById('qr'),{text:verifyUrl,width:92,height:92,correctLevel:QRCode.CorrectLevel.M});downloadBtn.disabled=false}function imageFormat(data){return String(data||'').startsWith('data:image/png')?'PNG':String(data||'').startsWith('data:image/webp')?'WEBP':'JPEG'}async function downloadPDF(){if(!cert)return;const {jsPDF}=window.jspdf;const pdf=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});const W=297,H=210;pdf.setDrawColor(17,24,39);pdf.setLineWidth(5);pdf.rect(5,5,W-10,H-10);pdf.setDrawColor(161,98,7);pdf.setLineWidth(.7);pdf.rect(12,12,W-24,H-24);pdf.setTextColor(161,98,7);pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text('COMMERCE AND MANAGEMENT LEARNING PORTAL',W/2,28,{align:'center'});pdf.setTextColor(17,24,39);pdf.setFont('times','bold');pdf.setFontSize(30);pdf.text('Certificate of Completion',W/2,48,{align:'center'});pdf.setFont('helvetica','normal');pdf.setFontSize(12);pdf.setTextColor(75,85,99);pdf.text('This is to certify that',W/2,62,{align:'center'});pdf.setFont('times','bold');pdf.setFontSize(23);pdf.setTextColor(17,24,39);pdf.text(cert.student_name,W/2,79,{align:'center'});pdf.setDrawColor(201,169,89);pdf.line(75,84,222,84);pdf.setFont('helvetica','normal');pdf.setFontSize(12);pdf.setTextColor(55,65,81);pdf.text('has successfully completed the self-designed MOOC',W/2,96,{align:'center'});pdf.setFont('times','bold');pdf.setFontSize(18);pdf.setTextColor(17,24,39);const titleLines=pdf.splitTextToSize(cert.course_title,190);pdf.text(titleLines,W/2,109,{align:'center'});const after=109+(titleLines.length-1)*7;pdf.setFont('helvetica','normal');pdf.setFontSize(11);pdf.setTextColor(75,85,99);pdf.text('and fulfilled the prescribed Continuous Assessment and End Semester Examination requirements.',W/2,after+13,{align:'center'});pdf.text(`CA: ${fmt(cert.ca_score)}     ESE: ${fmt(cert.ese_score)}     Total: ${fmt(cert.total_score)} / 100`,W/2,after+25,{align:'center'});if(cert.creator_signature_data){try{pdf.addImage(cert.creator_signature_data,imageFormat(cert.creator_signature_data),39,145,42,14,undefined,'FAST')}catch(e){console.warn('Signature could not be embedded',e)}}pdf.setDrawColor(55,65,81);pdf.line(28,169,92,169);pdf.line(205,169,269,169);pdf.setFont('helvetica','bold');pdf.setTextColor(17,24,39);pdf.setFontSize(10);pdf.text(cert.content_creator||'Course Content Creator',60,176,{align:'center'});pdf.text(d(cert.completion_date),237,176,{align:'center'});pdf.setFont('helvetica','normal');pdf.setFontSize(9);pdf.setTextColor(75,85,99);pdf.text('Course Content Creator',60,181,{align:'center'});pdf.text('Date of Completion',237,181,{align:'center'});const canvas=document.querySelector('#qr canvas');if(canvas){pdf.addImage(canvas.toDataURL('image/png'),'PNG',133,151,30,30)}pdf.setFont('courier','bold');pdf.setFontSize(9);pdf.setTextColor(17,24,39);pdf.text(cert.verification_code,W/2,187,{align:'center'});pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.setTextColor(107,114,128);pdf.text('Verify this certificate using the verification code or QR code.',W/2,193,{align:'center'});pdf.save(`Certificate-${cert.course_code||cert.course_key}-${cert.student_name.replace(/[^a-z0-9]+/gi,'-')}.pdf`)}load();</script></body></html>
