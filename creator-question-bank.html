<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question Bank | Content Creator</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:20px}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:4px}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #cbd5e1;border-radius:7px}.full{grid-column:1/-1}.btn{padding:9px 12px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.primary{background:#7c3aed;color:#fff;border-color:#7c3aed}.q{border:1px solid #e5e7eb;border-radius:9px;padding:12px;margin-top:9px}.meta{font-size:12px;color:#6b7280}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator3"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1100px;margin:auto">Question Bank</h1></div><div class="wrap"><a class="back" href="creator-dashboard.html">← Content Creator Dashboard</a><div class="box"><div class="grid"><div class="field"><label>My Course</label><select id="course"></select></div><div class="field"><label>Module</label><select id="module"></select></div><div class="field"><label>Difficulty</label><select id="difficulty"><option value="easy">Easy</option><option value="moderate">Moderate</option><option value="hard">Hard</option></select></div><div class="field"><label>Correct Option</label><select id="correct"><option>A</option><option>B</option><option>C</option><option>D</option></select></div><div class="field full"><label>Question</label><textarea id="question"></textarea></div><div class="field"><label>Option A</label><input id="a"></div><div class="field"><label>Option B</label><input id="b"></div><div class="field"><label>Option C</label><input id="c"></div><div class="field"><label>Option D</label><input id="d"></div></div><button class="btn primary" onclick="addQuestion()">ADD QUESTION</button><div id="msg"></div></div><div class="box"><h2>Questions</h2><div id="questions">Select a course.</div></div></div><script>let creator=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function guard(){const u=await getCurrentUser();if(!u){location.replace('creator-login.html');return false}const {data}=await supabaseClient.from('content_creators').select('*').eq('user_id',u.id).maybeSingle();if(!data||data.status!=='approved'){location.replace('creator-login.html');return false}creator={...data,id:u.id};document.body.style.visibility='visible';return true}async function loadCourses(){const {data}=await supabaseClient.from('courses').select('course_key,title').eq('creator_user_id',creator.id).order('title');$('course').innerHTML=(data||[]).map(c=>`<option value="${esc(c.course_key)}">${esc(c.title)}</option>`).join('');await loadModules()}async function loadModules(){const k=$('course').value;if(!k){$('module').innerHTML='';$('questions').textContent='No courses created yet.';return}const {data}=await supabaseClient.from('course_modules').select('*').eq('course_key',k).order('module_no');$('module').innerHTML=(data||[]).map(m=>`<option value="${m.module_no}">Module ${m.module_no}: ${esc(m.module_title)}</option>`).join('');loadQuestions()}async function addQuestion(){const k=$('course').value;if(!k)return;const payload={course_key:k,module_no:+$('module').value,question_text:$('question').value.trim(),option_a:$('a').value.trim(),option_b:$('b').value.trim(),option_c:$('c').value.trim(),option_d:$('d').value.trim(),correct_option:$('correct').value,difficulty:$('difficulty').value,is_active:true};if(!payload.question_text||!payload.option_a||!payload.option_b||!payload.option_c||!payload.option_d){$('msg').textContent='Question and all four options are required.';return}const r=await supabaseClient.from('assignment_questions').insert(payload);if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent='Question added.';['question','a','b','c','d'].forEach(i=>$(i).value='');loadQuestions()}async function loadQuestions(){const k=$('course').value;if(!k)return;const {data,error}=await supabaseClient.from('assignment_questions').select('*').eq('course_key',k).order('module_no').order('id');if(error){$('questions').textContent=error.message;return}$('questions').innerHTML=(data||[]).length?(data||[]).map((x,i)=>`<div class="q"><strong>${i+1}. ${esc(x.question_text)}</strong><div class="meta">Module ${x.module_no} • ${esc(x.difficulty||'moderate')} • Correct: ${esc(x.correct_option)} • ${x.is_active?'Active':'Inactive'}</div><div style="margin-top:7px"><button class="btn" onclick="toggleQ(${x.id},${!x.is_active})">${x.is_active?'DEACTIVATE':'ACTIVATE'}</button> <button class="btn" onclick="deleteQ(${x.id})">DELETE</button></div></div>`).join(''):'No questions added yet.'}async function toggleQ(id,v){await supabaseClient.from('assignment_questions').update({is_active:v}).eq('id',id);loadQuestions()}async function deleteQ(id){if(!confirm('Delete this question?'))return;await supabaseClient.from('assignment_questions').delete().eq('id',id);loadQuestions()}$('course').addEventListener('change',loadModules);guard().then(ok=>{if(ok)loadCourses()});</script></body></html>
