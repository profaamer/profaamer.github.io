<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Progress & Results | Admin</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--purple:#7c3aed;--head:#111827;--green:#166534;--red:#b91c1c;--amber:#92400e}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text);visibility:hidden}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:1350px;margin:auto;display:flex;justify-content:space-between;align-items:center}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.logout{border:1px solid #64748b;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.wrap{max-width:1350px;margin:24px auto;padding:0 16px}.back{display:inline-block;color:var(--purple);text-decoration:none;font-weight:700;margin-bottom:15px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:5px}.field input,.field select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;min-width:190px}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.primary{background:var(--purple);color:#fff}.secondary{background:#fff;border:1px solid #cbd5e1}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:14px}.stat strong{display:block;font-size:22px;color:var(--purple)}.stat span{font-size:12px;color:var(--muted)}.tableWrap{overflow:auto}.results{width:100%;border-collapse:collapse;font-size:12px;min-width:1500px}.results th,.results td{padding:9px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}.results th{background:#f8fafc;position:sticky;top:0}.results td.name{text-align:left;font-weight:700}.sub{display:block;color:var(--muted);font-weight:400;margin-top:3px}.pass{color:var(--green);font-weight:700}.fail{color:var(--red);font-weight:700}.incomplete{color:var(--amber);font-weight:700}.progress{min-width:100px}.track{height:7px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:4px}.fill{height:100%;background:var(--purple)}.empty{text-align:center;padding:25px;color:var(--muted)}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}@media(max-width:700px){.summary{grid-template-columns:1fr 1fr}.field input,.field select{min-width:100%;width:100%}.filters{display:grid;grid-template-columns:1fr;width:100%}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="auth.js?v=20260816-dynresults1"></script></head><body><div class="header"><div class="headin"><div><h1>Student Progress & Results</h1><p>Administrator Reporting • Commerce and Management Learning Portal</p></div><button class="logout" onclick="adminLogoutTracked()">LOGOUT</button></div></div><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="box"><div class="filters"><div class="field"><label>Course</label><select id="course" onchange="courseChanged()"></select></div><div class="field"><label>Search Student</label><input id="search" placeholder="Name, email or mobile" oninput="render()"></div><div class="field"><label>Result Filter</label><select id="resultFilter" onchange="render()"><option value="all">All Students</option><option value="Passed">Passed</option><option value="Not Passed">Not Passed</option><option value="Incomplete">Incomplete</option></select></div><button class="btn primary" id="refreshBtn" onclick="loadData()">REFRESH</button><button class="btn secondary" onclick="exportCsv()">RESULTS CSV</button><button class="btn secondary" onclick="exportExcel()">ALL DETAILS EXCEL</button><button class="btn secondary" onclick="exportActivityCsv()">ACTIVITY CSV</button></div></div><div class="box"><div class="summary"><div class="stat"><strong id="totalStudents">0</strong><span>Enrolled Students</span></div><div class="stat"><strong id="completedStudents">0</strong><span>Assessment Completed</span></div><div class="stat"><strong id="passedStudents">0</strong><span>Passed</span></div><div class="stat"><strong id="avgProgress">0%</strong><span>Average Course Progress</span></div></div></div><div class="box"><div id="status" style="color:#6b7280;font-size:13px;margin-bottom:10px">Loading...</div><div class="tableWrap"><table class="results"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Administrator Area</div><script>let rows=[],activity=[],courseInfo=null,courses=[];function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function cls(v){return v==='Passed'?'pass':v==='Not Passed'?'fail':'incomplete'}function fmtDate(v){return v?new Date(v).toLocaleDateString('en-IN'):'—'}function fmtDateTime(v){return v?new Date(v).toLocaleString('en-IN'):'—'}function safeName(s){return String(s||'course').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')}async function guardAdmin(){const user=await getCurrentUser();if(!user){location.replace('admin-login.html');return null}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!data){await supabaseClient.auth.signOut();location.replace('admin-login.html');return null}document.body.style.visibility='visible';return user}async function loadCourses(){const {data,error}=await supabaseClient.from('courses').select('course_key,title,course_code,module_count,assignment_marks_each,ca_marks,ese_marks').order('title');if(error){status.textContent='Unable to load courses.';return}courses=data||[];if(!courses.length){course.innerHTML='<option value="">No courses available</option>';course.disabled=true;refreshBtn.disabled=true;status.textContent='No courses are currently available. Create a course in Course Management first.';renderHeaders(null);tbody.innerHTML='<tr><td class="empty">No course data available.</td></tr>';return}course.disabled=false;refreshBtn.disabled=false;course.innerHTML=courses.map(c=>`<option value="${esc(c.course_key)}">${esc(c.title)}${c.course_code?' — '+esc(c.course_code):''}</option>`).join('');await courseChanged()}async function courseChanged(){const c=courses.find(x=>x.course_key===course.value);courseInfo=c||null;renderHeaders(courseInfo);await loadData()}function renderHeaders(c){const mc=Number(c?.module_count||0),am=Number(c?.assignment_marks_each||0),ca=Number(c?.ca_marks||0),ese=Number(c?.ese_marks||0),total=ca+ese;const mods=Array.from({length:mc},(_,i)=>`<th>M${i+1} /${am}</th>`).join('');thead.innerHTML=`<tr><th>Student</th><th>Mobile</th><th>State</th><th>District</th><th>College / Institute</th><th>Enrolled</th><th>Status</th><th>Progress</th>${mods}<th>CA /${ca}</th><th>CA Result</th><th>ESE /${ese}</th><th>ESE Result</th><th>Total /${total}</th><th>Overall Result</th><th>Last Login</th><th>Last Logout</th><th>Login Count</th></tr>`}async function loadData(){if(!course.value){rows=[];activity=[];updateSummary();render();return}status.textContent='Loading student records...';const {data,error}=await supabaseClient.functions.invoke('admin-student-results',{body:{course_key:course.value}});if(error||data?.error){status.textContent='Unable to load records: '+(data?.error||error?.message||'Unknown error');return}rows=data.students||[];activity=data.activity||[];courseInfo=data.course||courseInfo;renderHeaders(courseInfo);status.textContent=rows.length+' enrolled student(s) found. '+activity.length+' login/logout event(s) recorded.';updateSummary();render()}function updateSummary(){totalStudents.textContent=rows.length;completedStudents.textContent=rows.filter(x=>x.overall_result!=='Incomplete').length;passedStudents.textContent=rows.filter(x=>x.overall_result==='Passed').length;avgProgress.textContent=(rows.length?Math.round(rows.reduce((a,b)=>a+Number(b.progress_percent||0),0)/rows.length):0)+'%'}function filtered(){const q=search.value.trim().toLowerCase(),rf=resultFilter.value;return rows.filter(x=>(rf==='all'||x.overall_result===rf)&&(!q||[x.full_name,x.email,x.mobile].some(v=>String(v||'').toLowerCase().includes(q))))}function render(){const data=filtered(),cols=(courseInfo?Number(courseInfo.module_count||0):0)+18;tbody.innerHTML=data.length?data.map(x=>`<tr><td class="name">${esc(x.full_name)}<span class="sub">${esc(x.email)}</span></td><td>${esc(x.mobile||'—')}</td><td>${esc(x.state||'—')}</td><td>${esc(x.district||'—')}</td><td>${esc(x.college_name||'—')}</td><td>${fmtDate(x.enrolled_at)}</td><td>${esc(x.enrollment_status)}</td><td class="progress"><strong>${x.progress_percent}%</strong><div class="track"><div class="fill" style="width:${x.progress_percent}%"></div></div></td>${(x.module_marks||[]).map(v=>`<td>${v==null?'—':v}</td>`).join('')}<td>${x.ca_total==null?'—':x.ca_total}</td><td class="${cls(x.ca_status)}">${x.ca_status}</td><td>${x.ese_total==null?'—':x.ese_total}</td><td class="${cls(x.ese_status)}">${x.ese_status}</td><td>${x.total==null?'—':x.total}</td><td class="${cls(x.overall_result)}">${x.overall_result}</td><td>${fmtDateTime(x.last_login_at)}</td><td>${fmtDateTime(x.last_logout_at)}</td><td>${x.login_count||0}</td></tr>`).join(''):`<tr><td colspan="${cols}" class="empty">No students match the current filter.</td></tr>`}function downloadCsv(name,headers,data){const csv=[headers,...data].map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href)}function exportCsv(){const data=filtered();if(!data.length)return alert('No student records to export.');const mc=Number(courseInfo.module_count||0),am=Number(courseInfo.assignment_marks_each||0),ca=Number(courseInfo.ca_marks||0),ese=Number(courseInfo.ese_marks||0),mods=Array.from({length:mc},(_,i)=>`Module ${i+1} /${am}`);const headers=['Name','Email','Mobile','State','District','College / Institute','Enrolled Date','Enrollment Status','Progress %',...mods,`CA /${ca}`,'CA Result',`ESE /${ese}`,'ESE Result',`Total /${ca+ese}`,'Overall Result','Last Login','Last Logout','Login Count','Logout Count'];downloadCsv(safeName(courseInfo.title)+'-student-results.csv',headers,data.map(x=>[x.full_name,x.email,x.mobile,x.state,x.district,x.college_name,fmtDateTime(x.enrolled_at),x.enrollment_status,x.progress_percent,...x.module_marks,x.ca_total??'',x.ca_status,x.ese_total??'',x.ese_status,x.total??'',x.overall_result,fmtDateTime(x.last_login_at),fmtDateTime(x.last_logout_at),x.login_count||0,x.logout_count||0]))}function exportActivityCsv(){if(!activity.length)return alert('No activity records have been recorded yet.');downloadCsv(safeName(courseInfo?.title)+'-activity.csv',['Name','Email','Mobile','Event','Timestamp','Portal Area','User Agent'],activity.map(x=>[x.full_name,x.email,x.mobile,x.event_type,fmtDateTime(x.event_at),x.portal_area,x.user_agent]))}function exportExcel(){if(!rows.length)return alert('No student records to export.');const wb=XLSX.utils.book_new(),mc=Number(courseInfo.module_count||0),am=Number(courseInfo.assignment_marks_each||0),ca=Number(courseInfo.ca_marks||0),ese=Number(courseInfo.ese_marks||0);const master=rows.map(x=>{const o={Name:x.full_name,Email:x.email,Mobile:x.mobile,State:x.state,District:x.district,'College / Institute':x.college_name,'Auth Created':fmtDateTime(x.auth_created_at),'Profile Created':fmtDateTime(x.profile_created_at),'Profile Updated':fmtDateTime(x.profile_updated_at),'Enrolled At':fmtDateTime(x.enrolled_at),'Enrollment Status':x.enrollment_status,'Course Type':x.course_type,'Progress %':x.progress_percent,'Completed Progress Items':(x.completed_progress_items||[]).join(', ')};for(let i=0;i<mc;i++)o[`Module ${i+1} /${am}`]=x.module_marks[i]??'';o[`CA /${ca}`]=x.ca_total??'';o['CA Result']=x.ca_status;o[`ESE /${ese}`]=x.ese_total??'';o['ESE Result']=x.ese_status;o[`Total /${ca+ese}`]=x.total??'';o['Overall Result']=x.overall_result;o['Final Exam Status']=x.final_exam_status;o['Final Exam Started']=fmtDateTime(x.final_exam_started_at);o['Final Exam Submitted']=fmtDateTime(x.final_exam_submitted_at);o['Last Sign-in (Auth)']=fmtDateTime(x.last_sign_in_at);o['Last Login (Portal)']=fmtDateTime(x.last_login_at);o['Last Logout']=fmtDateTime(x.last_logout_at);o['Login Count']=x.login_count||0;o['Logout Count']=x.logout_count||0;return o});XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(master),'Student Master');const moduleRows=[];rows.forEach(x=>(x.module_details||[]).forEach(m=>moduleRows.push({Name:x.full_name,Email:x.email,Module:m.module_no,Status:m.status,Score:m.score??'',Correct:m.correct_count??'',Started:fmtDateTime(m.started_at),Submitted:fmtDateTime(m.submitted_at)})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(moduleRows),'Module Attempts');const progRows=[];rows.forEach(x=>(x.progress_records||[]).forEach(p=>progRows.push({Name:x.full_name,Email:x.email,'Item Key':p.item_key,Completed:p.completed,'Completed At':fmtDateTime(p.completed_at)})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(progRows),'Progress Records');XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(activity.map(x=>({Name:x.full_name,Email:x.email,Mobile:x.mobile,Event:x.event_type,Timestamp:fmtDateTime(x.event_at),'Portal Area':x.portal_area,'User Agent':x.user_agent}))),'Login Logout Activity');XLSX.writeFile(wb,safeName(courseInfo.title)+'-all-student-details.xlsx')}(async()=>{const u=await guardAdmin();if(u)await loadCourses()})();</script></body></html>
