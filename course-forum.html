<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Discussion Forum | Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--soft:#f8fafc;--green:#166534}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:26px 16px;text-align:center}.wrap{max-width:920px;margin:26px auto;padding:0 16px}.back{display:inline-block;color:var(--accent);text-decoration:none;font-weight:700;margin-bottom:15px}.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:8px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer;margin-top:12px}.msg{font-size:13px;margin-top:8px;color:var(--green)}.topic{border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:10px}.topic-title{font-weight:700;font-size:16px}.meta{font-size:12px;color:var(--muted);margin-top:4px}.body{margin:10px 0;line-height:1.5;white-space:pre-wrap}.reply{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:8px}.reply-form{display:flex;gap:8px;margin-top:10px}.reply-form input{flex:1}.reply-form button{margin:0}.empty{text-align:center;color:var(--muted);padding:22px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:650px){.grid{grid-template-columns:1fr}.reply-form{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body style="visibility:hidden"><div class="header"><h1>💬 Course Discussion Forum</h1><p id="courseTitle">Loading...</p></div><div class="wrap"><a id="back" class="back" href="#">← Course Home</a><div id="accessBox" class="box"><div class="empty">Checking course enrolment...</div></div><div id="forumArea" style="display:none"><div class="box"><h2>Start a Discussion</h2><div class="grid"><div><label>Category</label><select id="category"></select></div><div><label>Topic Title</label><input id="topicTitle" maxlength="160"></div></div><label>Message / Doubt</label><textarea id="topicBody" maxlength="5000"></textarea><button class="btn" id="postBtn">POST DISCUSSION</button><div id="postMsg" class="msg"></div></div><div class="box"><h2>Course Discussions</h2><div id="topics"><div class="empty">Loading discussions...</div></div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');let currentUser=null,currentName='Student';function fmt(d){return new Date(d).toLocaleString()}function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n}async function replies(topicId,holder){const {data}=await supabaseClient.from('forum_replies').select('id,body,author_name,created_at').eq('topic_id',topicId).order('created_at');holder.innerHTML='';(data||[]).forEach(r=>{const x=el('div','reply');x.appendChild(el('strong','',r.author_name));x.appendChild(el('div','meta',fmt(r.created_at)));x.appendChild(el('div','body',r.body));holder.appendChild(x)})}async function addReply(topicId,input,holder){const body=input.value.trim();if(!body)return;const {error}=await supabaseClient.from('forum_replies').insert({topic_id:topicId,course_key:key,body,author_id:currentUser.id,author_name:currentName});if(!error){input.value='';await replies(topicId,holder)}}async function loadTopics(){const box=topics;const {data,error}=await supabaseClient.from('forum_topics').select('id,category,title,body,author_name,created_at').eq('course_key',key).order('created_at',{ascending:false});box.innerHTML='';if(error){box.appendChild(el('div','empty','Unable to load discussions.'));return}if(!data?.length){box.appendChild(el('div','empty','No discussions yet. Start the first topic above.'));return}for(const t of data){const card=el('div','topic');card.appendChild(el('div','topic-title',t.title));card.appendChild(el('div','meta',t.category+' • '+t.author_name+' • '+fmt(t.created_at)));card.appendChild(el('div','body',t.body));const h=el('div');card.appendChild(h);await replies(t.id,h);const f=el('div','reply-form'),inp=document.createElement('input'),btn=el('button','btn','REPLY');inp.placeholder='Write a reply...';btn.onclick=()=>addReply(t.id,inp,h);f.appendChild(inp);f.appendChild(btn);card.appendChild(f);box.appendChild(card)}}postBtn.onclick=async()=>{const title=topicTitle.value.trim(),body=topicBody.value.trim();postMsg.textContent='';if(title.length<3||body.length<2){postMsg.textContent='Please enter a topic title and message.';return}const {error}=await supabaseClient.from('forum_topics').insert({course_key:key,category:category.value,title,body,author_id:currentUser.id,author_name:currentName});if(error){postMsg.textContent='Unable to post discussion.';return}topicTitle.value='';topicBody.value='';postMsg.textContent='Discussion posted successfully.';await loadTopics()};(async()=>{currentUser=await requireAuth();if(!currentUser)return;if(!key){location.replace('my-courses.html');return}if(key==='direct-taxes-law-practice-1'){location.replace('direct-tax-discussion.html');return}const [{data:c},{data:profile},{data:en}]=await Promise.all([supabaseClient.from('courses').select('title,module_count,discussion_forum_enabled').eq('course_key',key).maybeSingle(),supabaseClient.from('student_profiles').select('full_name').eq('user_id',currentUser.id).maybeSingle(),supabaseClient.from('course_enrollments').select('id,status').eq('user_id',currentUser.id).eq('course_key',key).maybeSingle()]);if(!c||!c.discussion_forum_enabled||!en||en.status!=='active'){accessBox.innerHTML='<strong>Forum unavailable.</strong>';document.body.style.visibility='visible';return}currentName=profile?.full_name||'Student';courseTitle.textContent=c.title;back.href='course.html?course='+encodeURIComponent(key);category.innerHTML='<option>General Discussion</option>'+Array.from({length:Number(c.module_count||0)},(_,i)=>'<option>Module '+(i+1)+' Doubts</option>').join('');accessBox.innerHTML='<strong>Course Forum Access:</strong> Enrolled student ✓<br><span class="meta">Use this space for course-related doubts and academic discussion.</span>';forumArea.style.display='block';document.body.style.visibility='visible';await loadTopics()})();</script></body></html>
