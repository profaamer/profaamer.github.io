<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Details | Admin</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827;--green:#166534;--orange:#b45309}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:20px 16px}.headin{max-width:1180px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.logout{border:1px solid #64748b;background:transparent;color:#fff;border-radius:8px;padding:9px 13px;font-weight:700;cursor:pointer}.container{max-width:1180px;margin:24px auto;padding:0 16px}.back{color:var(--accent);font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:18px}.card h2{margin:0 0 14px}.profile{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{background:#f8fafc;border:1px solid var(--line);border-radius:9px;padding:12px}.field span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}.field strong{font-size:14px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat strong{display:block;font-size:28px;color:var(--accent)}.stat span{font-size:12px;color:var(--muted)}.course{border:1px solid var(--line);border-radius:11px;padding:16px;margin-top:12px}.courseTop{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.course h3{margin:0 0 5px;font-size:17px}.meta{color:var(--muted);font-size:12px;line-height:1.5}.badge{font-size:11px;font-weight:700;padding:6px 9px;border-radius:999px;background:#ecfdf5;color:var(--green);white-space:nowrap}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.metric{background:#f8fafc;border-radius:8px;padding:10px}.metric span{display:block;color:var(--muted);font-size:10px;margin-bottom:4px}.metric strong{font-size:13px}.empty{padding:22px;text-align:center;color:var(--muted)}.footer{text-align:center;padding:26px;color:var(--muted);font-size:13px}@media(max-width:760px){.profile,.summary,.metrics{grid-template-columns:1fr 1fr}.courseTop{flex-direction:column}}@media(max-width:480px){.profile,.summary,.metrics{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-studentdetail1"></script></head><body style="visibility:hidden"><div class="header"><div class="headin"><div><h1>Student Details</h1><p>Registered Student • Enrolments and Learning Activity</p></div><button class="logout" onclick="adminLogout()">LOGOUT</button></div></div><div class="container"><a class="back" href="admin-registered-students.html">← Registered Students</a><div class="card"><h2 id="studentName">Student Profile</h2><div id="profile" class="profile"></div></div><div class="summary"><div class="stat"><strong id="courseCount">0</strong><span>Courses Enrolled</span></div><div class="stat"><strong id="assignmentCount">0</strong><span>Submitted Assignments</span></div><div class="stat"><strong id="examCount">0</strong><span>Submitted Final Exams</span></div></div><div class="card"><h2>Enrolled Courses</h2><div id="courseList"><div class="empty">Loading...</div></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Administrator Area</div><script>const params=new URLSearchParams(location.search),studentId=params.get('student');const studentNameEl=document.getElementById('studentName'),profileEl=document.getElementById('profile'),courseListEl=document.getElementById('courseList'),courseCountEl=document.getElementById('courseCount'),assignmentCountEl=document.getElementById('assignmentCount'),examCountEl=document.getElementById('examCount');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function fmt(v){return v?new Date(v).toLocaleString('en-IN'):'—'}function field(label,value){return `<div class="field"><span>${esc(label)}</span><strong>${esc(value||'—')}</strong></div>`}async function guard(){const user=await getCurrentUser();if(!user){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!data){await supabaseClient.auth.signOut();location.replace('admin-login.html');return false}document.body.style.visibility='visible';return true}async function load(){if(!studentId){courseListEl.innerHTML='<div class="empty">Student ID is missing.</div>';return}const [{data:p,error:pe},{data:e,error:ee},{data:c,error:ce},{data:pr,error:pre},{data:aa,error:aae},{data:fa,error:fae}]=await Promise.all([supabaseClient.from('student_profiles').select('*').eq('user_id',studentId).maybeSingle(),supabaseClient.from('course_enrollments').select('*').eq('user_id',studentId).order('enrolled_at',{ascending:false}),supabaseClient.from('courses').select('course_key,title,course_code,category,programme,semester_level,module_count,assignment_count,ca_marks,ese_marks'),supabaseClient.from('course_progress').select('course_key,item_key,completed,completed_at').eq('user_id',studentId),supabaseClient.from('assignment_attempts').select('course_key,module_no,status,score,submitted_at').eq('user_id',studentId).order('submitted_at',{ascending:false}),supabaseClient.from('final_exam_attempts').select('course_key,status,score,submitted_at').eq('user_id',studentId).order('submitted_at',{ascending:false})]);if(pe||ee||ce||pre||aae||fae){courseListEl.innerHTML='<div class="empty">Unable to load student details.</div>';console.error(pe||ee||ce||pre||aae||fae);return}if(!p){courseListEl.innerHTML='<div class="empty">Student profile not found.</div>';return}studentNameEl.textContent=p.full_name||'Student Profile';profileEl.innerHTML=field('Email',p.email)+field('Mobile',p.mobile)+field('State',p.state)+field('District',p.district)+field('College / Institute',p.college_name)+field('Registered',fmt(p.created_at));const courseMap=new Map((c||[]).map(x=>[x.course_key,x]));const active=(e||[]).filter(x=>x.status==='active');courseCountEl.textContent=active.length;assignmentCountEl.textContent=(aa||[]).filter(x=>x.status==='submitted').length;examCountEl.textContent=(fa||[]).filter(x=>x.status==='submitted').length;if(!e?.length){courseListEl.innerHTML='<div class="empty">This student has not enrolled in any course.</div>';return}courseListEl.innerHTML=e.map(en=>{const course=courseMap.get(en.course_key)||{};const progress=(pr||[]).filter(x=>x.course_key===en.course_key&&x.completed).length;const assignments=(aa||[]).filter(x=>x.course_key===en.course_key&&x.status==='submitted');const latestExam=(fa||[]).find(x=>x.course_key===en.course_key&&x.status==='submitted');const assScores=assignments.map(x=>Number(x.score||0));const caTotal=assScores.reduce((a,b)=>a+b,0);return `<div class="course"><div class="courseTop"><div><h3>${esc(course.title||en.course_key)}</h3><div class="meta">${esc(course.course_code||'')} ${course.programme?'• '+esc(course.programme):''} ${course.semester_level?'• '+esc(course.semester_level):''}<br>Enrolled: ${fmt(en.enrolled_at)}</div></div><div class="badge">${esc(en.status||'active')}</div></div><div class="metrics"><div class="metric"><span>Completed Learning Items</span><strong>${progress}</strong></div><div class="metric"><span>Assignments Submitted</span><strong>${assignments.length}${course.assignment_count?' / '+course.assignment_count:''}</strong></div><div class="metric"><span>CA Score Recorded</span><strong>${caTotal}${course.ca_marks?' / '+course.ca_marks:''}</strong></div><div class="metric"><span>Final Exam</span><strong>${latestExam?Number(latestExam.score||0)+(course.ese_marks?' / '+course.ese_marks:''):'Not Submitted'}</strong></div></div></div>`}).join('')}async function adminLogout(){await supabaseClient.auth.signOut();location.replace('admin-login.html')}guard().then(ok=>{if(ok)load()});</script></body></html>
