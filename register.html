<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:26px 16px;text-align:center}.header h1{margin:0;font-size:27px}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:540px;margin:30px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:25px}.card h2{margin-top:0;text-align:center}label{display:block;font-weight:700;font-size:14px;margin:14px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}select:disabled{background:#f3f4f6;color:#9ca3af}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.message{margin-top:14px;font-size:14px;line-height:1.5}.success{background:#ecfdf5;border:1px solid #a7f3d0;border-radius:9px;padding:13px;color:#065f46}.error{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:13px;color:#9a3412}.switch{text-align:center;margin-top:18px;font-size:14px}.switch a{color:var(--accent);font-weight:700;text-decoration:none}.note{font-size:12px;color:var(--muted);margin-top:5px}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="college-directory-data.js?v=20260816-1"></script></head><body><div class="header"><h1>Commerce and Management Learning Portal</h1><p>Student Registration</p></div><div class="wrap"><div class="card"><h2>Create Student Account</h2><form id="registerForm"><label for="name">Full Name</label><input id="name" type="text" autocomplete="name" required minlength="2"><label for="email">Email Address</label><input id="email" type="email" autocomplete="email" required><label for="mobile">Mobile Number</label><input id="mobile" type="tel" autocomplete="tel" required pattern="[0-9+() -]{7,20}"><label for="state">State / Union Territory</label><select id="state" required><option value="">Loading states...</option></select><label for="district">District</label><select id="district" required disabled><option value="">Select state first</option></select><label for="college">College / Institute</label><select id="college" required disabled><option value="">Select district first</option></select><div id="otherCollegeWrap" class="hidden"><label for="otherCollege">Enter College / Institute Name</label><input id="otherCollege" type="text" minlength="2" placeholder="Full college or institute name"></div><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required minlength="6"><div class="note">Use at least 6 characters.</div><label for="confirmPassword">Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="6"><button id="registerBtn" type="submit">REGISTER</button><div id="message" class="message"></div></form><div class="switch">Already registered? <a href="login.html">Login here</a></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const stateEl=document.getElementById('state'),districtEl=document.getElementById('district'),collegeEl=document.getElementById('college'),otherWrap=document.getElementById('otherCollegeWrap'),otherEl=document.getElementById('otherCollege'),registerBtn=document.getElementById('registerBtn');let stateData=[],collegeDirectory={};const SPECIAL=['Nanded','Latur','Hingoli','Parbhani'];function opts(el,items,placeholder){el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(x=>'<option value="'+String(x).replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'">'+String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</option>').join('')}async function initLocation(){try{collegeDirectory=await loadCollegeDirectory();const r=await fetch('https://raw.githubusercontent.com/KTBsomen/Indian-state-district-json/main/india-states-districts-latest.json');stateData=await r.json();stateData.sort((a,b)=>a.state.localeCompare(b.state));opts(stateEl,stateData.map(x=>x.state),'Select state');}catch(e){stateEl.innerHTML='<option value="">Unable to load location list</option>'}}stateEl.addEventListener('change',()=>{const s=stateData.find(x=>x.state===stateEl.value);const ds=(s?.districts||[]).slice().sort((a,b)=>a.localeCompare(b));opts(districtEl,ds,'Select district');districtEl.disabled=!stateEl.value;collegeEl.disabled=true;collegeEl.innerHTML='<option value="">Select district first</option>';otherWrap.classList.add('hidden');otherEl.required=false});districtEl.addEventListener('change',()=>{const d=districtEl.value;let colleges=[];if(stateEl.value==='Maharashtra'&&SPECIAL.includes(d))colleges=(collegeDirectory[d]||[]).slice().sort((a,b)=>a.localeCompare(b));opts(collegeEl,[...colleges,'Other'],colleges.length?'Select college / institute':'Select option');collegeEl.disabled=!d;otherWrap.classList.add('hidden');otherEl.required=false;otherEl.value=''});collegeEl.addEventListener('change',()=>{const other=collegeEl.value==='Other';otherWrap.classList.toggle('hidden',!other);otherEl.required=other;if(!other)otherEl.value=''});document.getElementById('registerForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');m.className='message';const full_name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim(),mobile=document.getElementById('mobile').value.trim(),state=stateEl.value,district=districtEl.value,college=collegeEl.value==='Other'?otherEl.value.trim():collegeEl.value,password=document.getElementById('password').value,confirmPassword=document.getElementById('confirmPassword').value;if(!state||!district||!college){m.className='message error';m.textContent='Please complete State, District and College / Institute details.';return}if(password!==confirmPassword){m.className='message error';m.textContent='Passwords do not match.';return}registerBtn.disabled=true;registerBtn.textContent='CHECKING...';m.textContent='Checking existing registration...';const {data:check,error:checkError}=await supabaseClient.functions.invoke('registration-check',{body:{email,mobile}});if(checkError||check?.error){registerBtn.disabled=false;registerBtn.textContent='REGISTER';m.className='message error';m.textContent='Unable to verify registration details right now. Please try again.';return}if(check.email_exists||check.mobile_exists){registerBtn.disabled=false;registerBtn.textContent='REGISTER';m.className='message error';if(check.email_exists&&check.mobile_exists)m.innerHTML='<strong>This email address and mobile number are already registered.</strong><br>Please use your existing account and <a href="login.html">login here</a>.';else if(check.email_exists)m.innerHTML='<strong>This email address is already registered.</strong><br>Please use your existing account and <a href="login.html">login here</a>.';else m.innerHTML='<strong>This mobile number is already registered.</strong><br>Please use the email linked to your existing account or contact the administrator.';return}registerBtn.textContent='REGISTERING...';m.textContent='Creating your account...';const redirectUrl=window.location.origin+'/login.html?confirmed=1';const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name,mobile,state,district,college_name:college},emailRedirectTo:redirectUrl}});registerBtn.disabled=false;registerBtn.textContent='REGISTER';if(error){m.className='message error';m.textContent=error.message;return}if(data.session){window.location.href='dashboard.html'}else{m.className='message success';m.innerHTML='<strong>Registration successful.</strong><br>Please check your email inbox and click the confirmation link before logging in.<br><br>If you do not see the email, also check Spam/Junk.';document.getElementById('registerForm').reset();districtEl.disabled=true;collegeEl.disabled=true;otherWrap.classList.add('hidden')}});initLocation();</script></body></html>
