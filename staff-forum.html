<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Discussion Forum Manager</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827;--soft:#f8fafc;--green:#166534;--orange:#c2410c}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;height:106px;padding:0 16px;display:flex;align-items:center}.headin,.wrap{max-width:980px;width:100%;margin:auto}.headin{display:flex;align-items:center;justify-content:space-between}.header h1{margin:0;font-size:25px}.header p{margin:5px 0 0;color:#d1d5db}.wrap{padding:26px 16px}.back{color:#1d4ed8;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}select,input{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;font:inherit}.filters{display:grid;grid-template-columns:2fr 1fr;gap:12px}.topic{border:1px solid var(--line);border-radius:10px;padding:15px;margin-top:12px}.topic-title{font-weight:700;font-size:17px}.meta{font-size:12px;color:var(--muted);margin-top:5px}.body{white-space:pre-wrap;line-height:1.5;margin:10px 0}.reply{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:11px;margin-top:8px}.reply.staff{border-left:4px solid var(--accent)}.badge{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 7px;margin-left:6px;background:#ede9fe;color:#6d28d9}.closed{background:#fee2e2;color:#991b1b}.open{background:#dcfce7;color:#166534}.reply-form{display:flex;gap:8px;margin-top:10px}.reply-form input{flex:1}.btn{border:0;border-radius:8px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--orange);border:1px solid #fdba74}.actions{display:flex;gap:8px;margin-top:10px}.empty{text-align:center;color:var(--muted);padding:24px}.count{font-size:13px;color:var(--muted);margin-top:8px}@media(max-width:650px){.filters{grid-template-columns:1fr}.reply-form{flex-direction:column}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-logout-home1"></script></head><body style="visibility:hidden"><div class="header"><div class="headin"><div><h1>💬 Discussion Forum Manager</h1><p id="roleTitle">Loading...</p></div></div></div><div class="wrap"><a id="back" class="back">← Dashboard</a><div class="box"><div class="filters"><div><label><strong>Course</strong></label><select id="course"></select></div><div><label><strong>Filter</strong></label><select id="filter"><option value="all">All Topics</option><option value="unanswered">Unanswered</option><option value="open">Open</option><option value="closed">Closed</option></select></div></div><div id="count" class="count"></div></div><div class="box"><div id="topics"><div class="empty">Loading discussions...</div></div></div></div><script>let me=null,role='',name='',courses=[];const fmt=d=>new Date(d).toLocaleString();function node(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}async function loadReplies(topicId){const {data,error}=await supabaseClient.from('forum_replies').select('id,body,author_id,author_name,created_at').eq('topic_id',topicId).order('created_at');return error?[]:(data||[])}async function postReply(t,input,holder){const body=input.value.trim();if(!body)return;const {error}=await supabaseClient.from('forum_replies').insert({topic_id:t.id,course_key:t.course_key,body,author_id:me.id,author_name:name});if(error){alert('Unable to post reply: '+error.message);return}input.value='';await renderReplies(t,holder)}async function renderReplies(t,holder){const rs=await loadReplies(t.id);holder.innerHTML='';for(const r of rs){const d=node('div','reply'+(r.author_id===me.id?' staff':''));const head=node('strong','',r.author_name||'User');if(r.author_id===me.id)head.appendChild(node('span','badge',role==='admin'?'Administrator':'Content Creator'));d.appendChild(head);d.appendChild(node('div','meta',fmt(r.created_at)));d.appendChild(node('div','body',r.body));holder.appendChild(d)}return rs}async function toggle(t){const next=t.status==='closed'?'open':'closed';const {error}=await supabaseClient.from('forum_topics').update({status:next}).eq('id',t.id);if(error)alert('Unable to change topic status: '+error.message);else loadTopics()}async function loadTopics(){const key=course.value;if(!key){topics.innerHTML='<div class="empty">No courses available.</div>';return}const {data,error}=await supabaseClient.from('forum_topics').select('id,course_key,category,title,body,author_name,created_at,status').eq('course_key',key).order('created_at',{ascending:false});if(error){topics.innerHTML='<div class="empty">Unable to load discussions.</div>';return}const enriched=[];for(const t of data||[]){t.status=t.status||'open';t._replies=await loadReplies(t.id);t._staff=t._replies.some(r=>r.author_id===me.id);enriched.push(t)}let list=enriched;const f=filter.value;if(f==='unanswered')list=list.filter(t=>!t._staff);if(f==='open'||f==='closed')list=list.filter(t=>t.status===f);count.textContent=`${list.length} topic(s) shown • ${enriched.filter(t=>!t._staff).length} unanswered`;topics.innerHTML='';if(!list.length){topics.appendChild(node('div','empty','No discussions match this filter.'));return}for(const t of list){const card=node('div','topic');const title=node('div','topic-title',t.title);title.appendChild(node('span','badge '+t.status,t.status.toUpperCase()));card.appendChild(title);card.appendChild(node('div','meta',`${t.category} • ${t.author_name} • ${fmt(t.created_at)}`));card.appendChild(node('div','body',t.body));const holder=node('div');card.appendChild(holder);await renderReplies(t,holder);if(t.status==='open'){const form=node('div','reply-form'),inp=document.createElement('input'),btn=node('button','btn','REPLY');inp.placeholder=role==='admin'?'Reply as Administrator...':'Reply as Content Creator...';btn.onclick=()=>postReply(t,inp,holder);form.append(inp,btn);card.appendChild(form)}const acts=node('div','actions'),toggleBtn=node('button','btn secondary',t.status==='closed'?'REOPEN DISCUSSION':'CLOSE DISCUSSION');toggleBtn.onclick=()=>toggle(t);acts.appendChild(toggleBtn);card.appendChild(acts);topics.appendChild(card)}}course.onchange=loadTopics;filter.onchange=loadTopics;(async()=>{me=await getCurrentUser();if(!me){location.replace('index.html');return}const [{data:a},{data:cr}]=await Promise.all([supabaseClient.from('admin_users').select('user_id').eq('user_id',me.id).maybeSingle(),supabaseClient.from('content_creators').select('full_name,status').eq('user_id',me.id).maybeSingle()]);if(a){role='admin';name='Administrator';roleTitle.textContent='Administrator • All course discussions';back.href='admin-dashboard.html';const {data}=await supabaseClient.from('courses').select('course_key,title').eq('discussion_forum_enabled',true).order('title');courses=data||[]}else if(cr&&cr.status==='approved'){role='creator';name=cr.full_name||'Content Creator';roleTitle.textContent=name+' • Your course discussions';back.href='creator-dashboard.html';const {data}=await supabaseClient.from('courses').select('course_key,title').eq('creator_user_id',me.id).eq('discussion_forum_enabled',true).order('title');courses=data||[]}else{location.replace('index.html');return}course.innerHTML=courses.map(c=>`<option value="${c.course_key}">${c.title}</option>`).join('');document.body.style.visibility='visible';await loadTopics()})();</script></body></html>
