<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Creators | Admin</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:22px}.wrap{max-width:1050px;margin:25px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px}button{padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.approve{background:#7c3aed;color:#fff;border-color:#7c3aed}.status{font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator1"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1050px;margin:auto">Content Creators</h1></div><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="box"><table><thead><tr><th>Name</th><th>Email</th><th>Designation</th><th>Institution</th><th>Status</th><th>Registered</th><th>Courses</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="8">Loading...</td></tr></tbody></table></div></div><script>let adminId=null;function fmt(v){return v?new Date(v).toLocaleString('en-IN'):'—'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function guard(){const u=await getCurrentUser();if(!u){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!data){location.replace('admin-login.html');return false}adminId=u.id;document.body.style.visibility='visible';return true}async function load(){const [{data:c},{data:courses}]=await Promise.all([supabaseClient.from('content_creators').select('*').order('created_at',{ascending:false}),supabaseClient.from('courses').select('creator_user_id')]);const counts={};(courses||[]).forEach(x=>{if(x.creator_user_id)counts[x.creator_user_id]=(counts[x.creator_user_id]||0)+1});rows.innerHTML=(c||[]).length?(c||[]).map(x=>`<tr><td>${esc(x.full_name||'—')}</td><td>${esc(x.email)}</td><td>${esc(x.designation||'—')}</td><td>${esc(x.institution||'—')}</td><td class="status">${esc(x.status)}</td><td>${fmt(x.created_at)}</td><td>${counts[x.user_id]||0}</td><td>${x.status==='pending'?`<button class="approve" onclick="setStatus('${x.user_id}','approved')">APPROVE</button>`:''}${x.status==='approved'?`<button onclick="setStatus('${x.user_id}','inactive')">DEACTIVATE</button>`:''}${x.status==='inactive'?`<button class="approve" onclick="setStatus('${x.user_id}','approved')">REACTIVATE</button>`:''}</td></tr>`).join(''):'<tr><td colspan="8">No creator accounts yet.</td></tr>'}async function setStatus(id,status){const payload={status};if(status==='approved'){payload.approved_at=new Date().toISOString();payload.approved_by=adminId}const {error}=await supabaseClient.from('content_creators').update(payload).eq('user_id',id);if(error){alert(error.message);return}load()}guard().then(ok=>{if(ok)load()});</script></body></html>
