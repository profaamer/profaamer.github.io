<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Creators | Admin</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:22px}.wrap{max-width:1380px;margin:25px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.toolbar,.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.toolbar{justify-content:space-between}.filters input,.filters select{padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.filters input{min-width:250px}.export,.clear{padding:10px 14px;border-radius:8px;font-weight:700;cursor:pointer}.export{border:1px solid #7c3aed;background:#7c3aed;color:#fff}.clear{border:1px solid #cbd5e1;background:#fff;color:#1f2937}.summary{margin-top:10px;color:#6b7280;font-size:13px}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1650px}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}button{padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.approve{background:#7c3aed;color:#fff;border-color:#7c3aed}.status{font-weight:700}.incomplete{color:#b45309;font-weight:700}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-creator-admin-mobile1"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1380px;margin:auto">Content Creators</h1></div><div class="wrap"><div class="toolbar"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><button class="export" onclick="exportCSV()">EXPORT FILTERED CSV</button></div><div class="filters"><input id="searchBox" placeholder="Search name, email, mobile, department, college..."><select id="statusFilter"><option value="">All Status</option><option value="pending">Pending</option><option value="approved">Approved</option><option value="inactive">Inactive</option></select><select id="departmentFilter"><option value="">All Departments</option><option>Commerce</option><option>Management</option><option>Others</option></select><select id="designationFilter"><option value="">All Designations</option><option>Professor</option><option>Associate Professor</option><option>Assistant Professor</option></select><select id="appointmentFilter"><option value="">All Appointments</option></select><select id="stateFilter"><option value="">All States</option></select><select id="districtFilter"><option value="">All Districts</option></select><select id="collegeFilter"><option value="">All Colleges</option></select><button class="clear" onclick="clearFilters()">CLEAR FILTERS</button></div><div id="summary" class="summary"></div><div class="box"><table><thead><tr><th>Name</th><th>Email</th><th>Mobile</th><th>Department</th><th>Designation</th><th>Nature of Appointment</th><th>State</th><th>District</th><th>College / Institute</th><th>Profile</th><th>Status</th><th>Registered</th><th>Approved</th><th>Courses</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="15">Loading...</td></tr></tbody></table></div></div><script>let adminId=null,allCreators=[],filteredCreators=[],courseCounts={};const rowsEl=document.getElementById('rows'),searchBox=document.getElementById('searchBox'),statusFilter=document.getElementById('statusFilter'),departmentFilter=document.getElementById('departmentFilter'),designationFilter=document.getElementById('designationFilter'),appointmentFilter=document.getElementById('appointmentFilter'),stateFilter=document.getElementById('stateFilter'),districtFilter=document.getElementById('districtFilter'),collegeFilter=document.getElementById('collegeFilter'),summaryEl=document.getElementById('summary');function fmt(v){return v?new Date(v).toLocaleString('en-IN'):'—'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function complete(x){return !!(x.full_name&&x.email&&x.mobile&&x.department&&x.designation&&x.nature_of_appointment&&x.state&&x.district&&x.college_name)}function unique(field){return [...new Set(allCreators.map(x=>x[field]).filter(Boolean))].sort((a,b)=>a.localeCompare(b))}function fillSelect(el,items,label){const cur=el.value;el.innerHTML='<option value="">'+label+'</option>'+items.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');if(items.includes(cur))el.value=cur}function populateFilters(){fillSelect(appointmentFilter,unique('nature_of_appointment'),'All Appointments');fillSelect(stateFilter,unique('state'),'All States');fillSelect(districtFilter,unique('district'),'All Districts');fillSelect(collegeFilter,unique('college_name'),'All Colleges')}async function guard(){const u=await getCurrentUser();if(!u){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!data){location.replace('admin-login.html');return false}adminId=u.id;document.body.style.visibility='visible';return true}async function load(){const [{data:c,error:ce},{data:courses,error:co}]=await Promise.all([supabaseClient.from('content_creators').select('*').order('created_at',{ascending:false}),supabaseClient.from('courses').select('creator_user_id')]);if(ce||co){rowsEl.innerHTML='<tr><td colspan="15">Unable to load Content Creator records.</td></tr>';return}allCreators=c||[];courseCounts={};(courses||[]).forEach(x=>{if(x.creator_user_id)courseCounts[x.creator_user_id]=(courseCounts[x.creator_user_id]||0)+1});populateFilters();applyFilters()}function applyFilters(){const q=searchBox.value.trim().toLowerCase();filteredCreators=allCreators.filter(x=>{const hay=[x.full_name,x.email,x.mobile,x.department,x.designation,x.nature_of_appointment,x.state,x.district,x.college_name].join(' ').toLowerCase();return (!q||hay.includes(q))&&(!statusFilter.value||x.status===statusFilter.value)&&(!departmentFilter.value||x.department===departmentFilter.value)&&(!designationFilter.value||x.designation===designationFilter.value)&&(!appointmentFilter.value||x.nature_of_appointment===appointmentFilter.value)&&(!stateFilter.value||x.state===stateFilter.value)&&(!districtFilter.value||x.district===districtFilter.value)&&(!collegeFilter.value||x.college_name===collegeFilter.value)});render()}function render(){summaryEl.textContent=`Showing ${filteredCreators.length} of ${allCreators.length} Content Creator records.`;rowsEl.innerHTML=filteredCreators.length?filteredCreators.map(x=>{const ok=complete(x);let action='';if(x.status==='pending')action=ok?`<button class="approve" onclick="setStatus('${x.user_id}','approved')">APPROVE</button>`:'<span class="incomplete">Complete profile required</span>';else if(x.status==='approved')action=`<button onclick="setStatus('${x.user_id}','inactive')">DEACTIVATE</button>`;else if(x.status==='inactive')action=`<button class="approve" onclick="setStatus('${x.user_id}','approved')">REACTIVATE</button>`;return `<tr><td><strong>${esc(x.full_name||'—')}</strong></td><td>${esc(x.email||'—')}</td><td>${esc(x.mobile||'—')}</td><td>${esc(x.department||'—')}</td><td>${esc(x.designation||'—')}</td><td>${esc(x.nature_of_appointment||'—')}</td><td>${esc(x.state||'—')}</td><td>${esc(x.district||'—')}</td><td>${esc(x.college_name||'—')}</td><td class="${ok?'status':'incomplete'}">${ok?'Complete':'Incomplete'}</td><td class="status">${esc(x.status)}</td><td>${fmt(x.created_at)}</td><td>${fmt(x.approved_at)}</td><td>${courseCounts[x.user_id]||0}</td><td>${action}</td></tr>`}).join(''):'<tr><td colspan="15">No Content Creator records match the current filters.</td></tr>'}async function setStatus(id,status){const payload={status};if(status==='approved'){payload.approved_at=new Date().toISOString();payload.approved_by=adminId}const {error}=await supabaseClient.from('content_creators').update(payload).eq('user_id',id);if(error){alert(error.message);return}load()}function clearFilters(){searchBox.value='';statusFilter.value='';departmentFilter.value='';designationFilter.value='';appointmentFilter.value='';stateFilter.value='';districtFilter.value='';collegeFilter.value='';applyFilters()}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){if(!filteredCreators.length){alert('No filtered Content Creator records to export.');return}const header=['Full Name','Email','Mobile','Department','Designation','Nature of Appointment','State','District','College / Institute','Profile Complete','Account Status','Registered At','Approved At','Courses Created'];const lines=[header.map(csv).join(',')];filteredCreators.forEach(x=>lines.push([x.full_name,x.email,x.mobile,x.department,x.designation,x.nature_of_appointment,x.state,x.district,x.college_name,complete(x)?'Yes':'No',x.status,x.created_at,x.approved_at,courseCounts[x.user_id]||0].map(csv).join(',')));const blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='content-creators-filtered.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}[searchBox,statusFilter,departmentFilter,designationFilter,appointmentFilter,stateFilter,districtFilter,collegeFilter].forEach(el=>el.addEventListener(el===searchBox?'input':'change',applyFilters));guard().then(ok=>{if(ok)load()});</script></body></html>
