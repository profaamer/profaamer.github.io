<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Content Creators | Admin</title><style>body{font-family:Arial;margin:0;background:#f4f6f9;color:#1f2937}.head{background:#111827;color:#fff;padding:22px}.wrap{max-width:1280px;margin:25px auto;padding:0 16px}.back{color:#7c3aed;text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-top:16px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:1500px}th,td{padding:11px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:13px;vertical-align:top}th{background:#f8fafc}button{padding:8px 10px;border:1px solid #cbd5e1;border-radius:7px;background:#fff;font-weight:700;cursor:pointer}.approve{background:#7c3aed;color:#fff;border-color:#7c3aed}.status{font-weight:700}.incomplete{color:#b45309;font-weight:700}.small{font-size:11px;color:#6b7280;line-height:1.4}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-creator8"></script></head><body style="visibility:hidden"><div class="head"><h1 style="max-width:1280px;margin:auto">Content Creators</h1></div><div class="wrap"><a class="back" href="admin-dashboard.html">← Admin Dashboard</a><div class="box"><table><thead><tr><th>Name</th><th>Email</th><th>Department</th><th>Designation</th><th>Nature of Appointment</th><th>State</th><th>District</th><th>College / Institute</th><th>Profile</th><th>Status</th><th>Registered</th><th>Courses</th><th>Action</th></tr></thead><tbody id="rows"><tr><td colspan="13">Loading...</td></tr></tbody></table></div></div><script>let adminId=null;const rowsEl=document.getElementById('rows');function fmt(v){return v?new Date(v).toLocaleString('en-IN'):'—'}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function complete(x){return !!(x.full_name&&x.email&&x.department&&x.designation&&x.nature_of_appointment&&x.state&&x.district&&x.college_name)}async function guard(){const u=await getCurrentUser();if(!u){location.replace('admin-login.html');return false}const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',u.id).maybeSingle();if(!data){location.replace('admin-login.html');return false}adminId=u.id;document.body.style.visibility='visible';return true}async function load(){const [{data:c,error:ce},{data:courses,error:co}]=await Promise.all([supabaseClient.from('content_creators').select('*').order('created_at',{ascending:false}),supabaseClient.from('courses').select('creator_user_id')]);if(ce||co){rowsEl.innerHTML='<tr><td colspan="13">Unable to load Content Creator records.</td></tr>';return}const counts={};(courses||[]).forEach(x=>{if(x.creator_user_id)counts[x.creator_user_id]=(counts[x.creator_user_id]||0)+1});rowsEl.innerHTML=(c||[]).length?(c||[]).map(x=>{const ok=complete(x);let action='';if(x.status==='pending')action=ok?`<button class="approve" onclick="setStatus('${x.user_id}','approved')">APPROVE</button>`:'<span class="incomplete">Complete profile required</span>';else if(x.status==='approved')action=`<button onclick="setStatus('${x.user_id}','inactive')">DEACTIVATE</button>`;else if(x.status==='inactive')action=`<button class="approve" onclick="setStatus('${x.user_id}','approved')">REACTIVATE</button>`;return `<tr><td><strong>${esc(x.full_name||'—')}</strong></td><td>${esc(x.email||'—')}</td><td>${esc(x.department||'—')}</td><td>${esc(x.designation||'—')}</td><td>${esc(x.nature_of_appointment||'—')}</td><td>${esc(x.state||'—')}</td><td>${esc(x.district||'—')}</td><td>${esc(x.college_name||'—')}</td><td class="${ok?'status':'incomplete'}">${ok?'Complete':'Incomplete'}</td><td class="status">${esc(x.status)}</td><td>${fmt(x.created_at)}</td><td>${counts[x.user_id]||0}</td><td>${action}</td></tr>`}).join(''):'<tr><td colspan="13">No Content Creator accounts yet.</td></tr>'}async function setStatus(id,status){const payload={status};if(status==='approved'){payload.approved_at=new Date().toISOString();payload.approved_by=adminId}const {error}=await supabaseClient.from('content_creators').update(payload).eq('user_id',id);if(error){alert(error.message);return}load()}guard().then(ok=>{if(ok)load()});</script></body></html>
