<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Admin Login | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#7c3aed;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:28px 16px;text-align:center}.header h1{margin:0;font-size:27px}.header p{margin:7px 0 0;color:#d1d5db}.wrap{max-width:460px;margin:38px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:25px}.card h2{margin-top:0;text-align:center}label{display:block;font-weight:700;font-size:14px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.message{margin-top:14px;font-size:14px;line-height:1.5}.error{background:#fff7ed;border:1px solid #fed7aa;border-radius:9px;padding:12px;color:#9a3412}.note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:14px;text-align:center}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-admin1"></script></head><body><div class="header"><h1>Commerce and Management Learning Portal</h1><p>Administrator Login</p></div><div class="wrap"><div class="card"><h2>Admin Login</h2><form id="adminLoginForm"><label for="email">Administrator Email</label><input id="email" type="email" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required minlength="6"><button type="submit">LOGIN AS ADMIN</button><div id="message" class="message"></div></form><div class="note">This login is only for authorized portal administrators. Student accounts cannot access the Admin Dashboard.</div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar</div><script>async function checkCurrentAdmin(){const user=await getCurrentUser();if(!user)return;const {data}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(data)window.location.replace('admin-dashboard.html');else await supabaseClient.auth.signOut()}checkCurrentAdmin();document.getElementById('adminLoginForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');m.className='message';m.textContent='Signing in...';const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});if(error){m.className='message error';m.textContent='Invalid administrator credentials.';return}const user=data.user;const {data:admin,error:aErr}=await supabaseClient.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(aErr||!admin){await supabaseClient.auth.signOut();m.className='message error';m.textContent='This account is not authorized for administrator access.';return}window.location.replace('admin-dashboard.html');});</script></body></html>
