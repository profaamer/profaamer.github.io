<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verify Certificate | Y-MOOC</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--green:#166534;--red:#991b1b}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{height:106px;min-height:106px;background:#111827;color:#fff;padding:0 16px;display:flex;align-items:center}.headin{width:100%;max-width:980px;margin:0 auto}.headin h1{font-size:25px;margin:0}.headin p{font-size:14px;margin:5px 0 0}.container{max-width:760px;margin:26px auto;padding:0 16px}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;margin-top:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.search{display:flex;gap:8px}.search input{flex:1;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;text-transform:uppercase}.btn{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 15px;font-weight:700;cursor:pointer}.result{margin-top:16px;border-radius:10px;padding:18px}.valid{background:#f0fdf4;border:1px solid #bbf7d0}.invalid{background:#fef2f2;border:1px solid #fecaca}.status{font-size:18px;font-weight:800;margin-bottom:12px}.valid .status{color:var(--green)}.invalid .status{color:var(--red)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cell{background:rgba(255,255,255,.7);border:1px solid rgba(209,213,219,.8);border-radius:8px;padding:10px}.cell strong{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:600px){.search{flex-direction:column}.grid{grid-template-columns:1fr}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://ihcnmjjnpjtnjheyypqv.supabase.co';const SUPABASE_PUBLISHABLE_KEY='sb_publishable_cRNRKzPL0rMXvRtT-is7dg_6veyGjGM';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);</script></head><body><div class="header"><div class="headin"><h1>Y-MOOC Certificate Verification</h1><p>Yeshwant – Massive Open Online Courses</p></div></div><div class="container"><div class="box"><div class="field"><label>Verification Code</label><div class="search"><input id="code" placeholder="CMP-2026-XXXXXXXXXXXX"><button class="btn" onclick="verify()">VERIFY</button></div></div><div id="out"></div></div></div><div class="footer">© 2026 Y-MOOC • Educational Use</div><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function date(v){return new Date(v).toLocaleDateString(undefined,{day:'2-digit',month:'long',year:'numeric'})}async function verify(){const v=code.value.trim();if(!v){out.innerHTML='<div class="result invalid"><div class="status">Enter a verification code.</div></div>';return}out.innerHTML='<div class="result">Checking certificate...</div>';const {data,error}=await supabaseClient.rpc('verify_course_certificate',{p_verification_code:v});if(error||!data?.length){out.innerHTML='<div class="result invalid"><div class="status">Certificate Not Verified</div><div>No valid issued certificate was found for this verification code.</div></div>';return}const c=data[0];out.innerHTML=`<div class="result valid"><div class="status">✓ Certificate Verified</div><div class="grid"><div class="cell"><strong>Student</strong>${esc(c.student_name)}</div><div class="cell"><strong>Course</strong>${esc(c.course_title)}</div><div class="cell"><strong>Course Code</strong>${esc(c.course_code||'—')}</div><div class="cell"><strong>Course Content Creator</strong>${esc(c.content_creator||'—')}</div><div class="cell"><strong>Completion Date</strong>${date(c.completion_date)}</div><div class="cell"><strong>Issued On</strong>${date(c.issued_at)}</div><div class="cell"><strong>Total Score</strong>${Number(c.total_score)} / 100</div><div class="cell"><strong>Verification Code</strong>${esc(c.verification_code)}</div></div></div>`}const q=new URLSearchParams(location.search).get('code');if(q){code.value=q;verify()}</script></body></html>
