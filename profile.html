<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Profile | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--success:#166534;--danger:#b91c1c}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.back{color:#fff;text-decoration:none;border:1px solid #64748b;border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}.wrap{max-width:760px;margin:28px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:18px}.card h2{margin-top:0}.sectionNote{font-size:13px;color:var(--muted);line-height:1.5;margin:-4px 0 14px}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:700;font-size:14px;margin:15px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}input[readonly]{background:#f8fafc;color:#64748b}.meta{font-size:13px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.message{margin-top:14px;font-size:14px;line-height:1.5}.success{color:var(--success)}.error{color:var(--danger)}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none}@media(max-width:620px){.row{grid-template-columns:1fr}.header h1{font-size:20px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260816-profile3"></script><script src="college-directory-data.js?v=20260816-2"></script></head><body><div class="header"><div class="headin"><div><h1>Commerce and Management Learning Portal</h1><p>My Profile</p></div><a class="back" href="dashboard.html">DASHBOARD</a></div></div><div class="wrap"><div class="card"><h2>Student Profile</h2><p class="sectionNote">Review and update your personal and institution details.</p><form id="profileForm"><label for="name">Full Name</label><input id="name" type="text" required minlength="2"><label for="email">Email Address</label><input id="email" type="email" readonly><label for="mobile">Mobile Number</label><input id="mobile" type="tel" required pattern="[0-9+() -]{7,20}"><div class="row"><div><label for="state">State / Union Territory</label><select id="state" required></select></div><div><label for="district">District</label><select id="district" required></select></div></div><label for="college">College / Institute</label><select id="college" required></select><div id="otherCollegeWrap" class="hidden"><label for="otherCollege">Enter College / Institute Name</label><input id="otherCollege" type="text" minlength="2"></div><button id="saveProfileBtn" type="submit">SAVE PROFILE CHANGES</button><div id="message" class="message"></div></form><div class="meta" id="registrationInfo"></div></div><div class="card"><h2>Change Password</h2><p class="sectionNote">For security, enter your current password before choosing a new one.</p><form id="passwordForm"><label for="currentPassword">Current Password</label><input id="currentPassword" type="password" autocomplete="current-password" required minlength="6"><div class="row"><div><label for="newPassword">New Password</label><input id="newPassword" type="password" autocomplete="new-password" required minlength="6"></div><div><label for="confirmNewPassword">Confirm New Password</label><input id="confirmNewPassword" type="password" autocomplete="new-password" required minlength="6"></div></div><button id="changePasswordBtn" type="submit">CHANGE PASSWORD</button><div id="passwordMessage" class="message"></div></form></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let currentUser=null,stateData=[],collegeDirectory={};const SPECIAL=['Nanded','Latur','Hingoli','Parbhani'];const stateEl=document.getElementById('state'),districtEl=document.getElementById('district'),collegeEl=document.getElementById('college'),otherWrap=document.getElementById('otherCollegeWrap'),otherEl=document.getElementById('otherCollege');function h(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function opts(el,items,placeholder,selected=''){el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(x=>'<option value="'+h(x)+'" '+(x===selected?'selected':'')+'>'+h(x)+'</option>').join('')}function setDistricts(selected=''){const s=stateData.find(x=>x.state===stateEl.value);const ds=(s?.districts||[]).slice().sort((a,b)=>a.localeCompare(b));opts(districtEl,ds,'Select district',selected);districtEl.disabled=!stateEl.value}function setColleges(selected=''){const d=districtEl.value;let colleges=[];if(stateEl.value==='Maharashtra'&&SPECIAL.includes(d))colleges=(collegeDirectory[d]||[]).slice().sort((a,b)=>a.localeCompare(b));const known=colleges.includes(selected);opts(collegeEl,[...colleges,'Other'],'Select college / institute',known?selected:(selected?'Other':''));collegeEl.disabled=!d;const other=!!selected&&!known;otherWrap.classList.toggle('hidden',!other);otherEl.required=other;otherEl.value=other?selected:''}stateEl.addEventListener('change',()=>{setDistricts();opts(collegeEl,[],'Select district first');collegeEl.disabled=true;otherWrap.classList.add('hidden');otherEl.required=false;otherEl.value=''});districtEl.addEventListener('change',()=>setColleges());collegeEl.addEventListener('change',()=>{const other=collegeEl.value==='Other';otherWrap.classList.toggle('hidden',!other);otherEl.required=other;if(!other)otherEl.value=''});async function loadProfile(){currentUser=await requireAuth();if(!currentUser)return;try{collegeDirectory=await loadCollegeDirectory();const r=await fetch('https://raw.githubusercontent.com/KTBsomen/Indian-state-district-json/main/india-states-districts-latest.json');stateData=await r.json();stateData.sort((a,b)=>a.state.localeCompare(b.state));}catch(e){stateData=[]}const {data,error}=await supabaseClient.from('student_profiles').select('full_name,email,mobile,state,district,college_name,created_at').eq('user_id',currentUser.id).single();if(error){message.className='message error';message.textContent='Unable to load profile.';return}document.getElementById('name').value=data.full_name||'';document.getElementById('email').value=data.email||currentUser.email||'';document.getElementById('mobile').value=data.mobile||'';opts(stateEl,stateData.map(x=>x.state),'Select state',data.state||'');setDistricts(data.district||'');setColleges(data.college_name||'');if(data.created_at)registrationInfo.textContent='Registered on: '+new Date(data.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}profileForm.addEventListener('submit',async(e)=>{e.preventDefault();if(!currentUser)return;const collegeName=collegeEl.value==='Other'?otherEl.value.trim():collegeEl.value;if(!stateEl.value||!districtEl.value||!collegeName){message.className='message error';message.textContent='Please complete State, District and College / Institute details.';return}saveProfileBtn.disabled=true;message.className='message';message.textContent='Saving...';const {error}=await supabaseClient.from('student_profiles').update({full_name:name.value.trim(),mobile:mobile.value.trim(),state:stateEl.value,district:districtEl.value,college_name:collegeName,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);saveProfileBtn.disabled=false;if(error){message.className='message error';message.textContent=error.message;return}message.className='message success';message.textContent='Profile updated successfully.'});passwordForm.addEventListener('submit',async(e)=>{e.preventDefault();if(!currentUser)return;const current=currentPassword.value,newPwd=newPassword.value,confirmPwd=confirmNewPassword.value;passwordMessage.className='message';passwordMessage.textContent='';if(newPwd!==confirmPwd){passwordMessage.className='message error';passwordMessage.textContent='New passwords do not match.';return}if(newPwd===current){passwordMessage.className='message error';passwordMessage.textContent='New password must be different from the current password.';return}changePasswordBtn.disabled=true;changePasswordBtn.textContent='VERIFYING...';const {error:verifyError}=await supabaseClient.auth.signInWithPassword({email:currentUser.email,password:current});if(verifyError){changePasswordBtn.disabled=false;changePasswordBtn.textContent='CHANGE PASSWORD';passwordMessage.className='message error';passwordMessage.textContent='Current password is incorrect.';return}changePasswordBtn.textContent='CHANGING...';const {error:updateError}=await supabaseClient.auth.updateUser({password:newPwd});changePasswordBtn.disabled=false;changePasswordBtn.textContent='CHANGE PASSWORD';if(updateError){passwordMessage.className='message error';passwordMessage.textContent=updateError.message;return}passwordForm.reset();passwordMessage.className='message success';passwordMessage.textContent='Password changed successfully.'});loadProfile();</script></body></html>
