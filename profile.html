<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Profile | Commerce and Management Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--success:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.back{color:#fff;text-decoration:none;border:1px solid #64748b;border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}.wrap{max-width:680px;margin:28px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}.card h2{margin-top:0}label{display:block;font-weight:700;font-size:14px;margin:15px 0 6px}input,select{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px;background:#fff}input[readonly]{background:#f8fafc;color:#64748b}.meta{font-size:13px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.message{margin-top:14px;font-size:14px;line-height:1.5}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}.hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script><script src="college-directory-data.js?v=20260816-2"></script></head><body><div class="header"><div class="headin"><div><h1>Commerce and Management Learning Portal</h1><p>My Profile</p></div><a class="back" href="dashboard.html">DASHBOARD</a></div></div><div class="wrap"><div class="card"><h2>Student Profile</h2><form id="profileForm"><label for="name">Full Name</label><input id="name" type="text" required minlength="2"><label for="email">Email Address</label><input id="email" type="email" readonly><label for="mobile">Mobile Number</label><input id="mobile" type="tel" required pattern="[0-9+() -]{7,20}"><label for="state">State / Union Territory</label><select id="state" required></select><label for="district">District</label><select id="district" required></select><label for="college">College / Institute</label><select id="college" required></select><div id="otherCollegeWrap" class="hidden"><label for="otherCollege">Enter College / Institute Name</label><input id="otherCollege" type="text" minlength="2"></div><button type="submit">SAVE CHANGES</button><div id="message" class="message"></div></form><div class="meta" id="registrationInfo"></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>let currentUser=null,stateData=[],collegeDirectory={},profile=null;const SPECIAL=['Nanded','Latur','Hingoli','Parbhani'];const stateEl=state,districtEl=district,collegeEl=college,otherWrap=otherCollegeWrap,otherEl=otherCollege;function h(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}function opts(el,items,placeholder,selected=''){el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(x=>'<option value="'+h(x)+'" '+(x===selected?'selected':'')+'>'+h(x)+'</option>').join('')}function setDistricts(selected=''){const s=stateData.find(x=>x.state===stateEl.value);const ds=(s?.districts||[]).slice().sort((a,b)=>a.localeCompare(b));opts(districtEl,ds,'Select district',selected);districtEl.disabled=!stateEl.value}function setColleges(selected=''){const d=districtEl.value;let colleges=[];if(stateEl.value==='Maharashtra'&&SPECIAL.includes(d))colleges=(collegeDirectory[d]||[]).slice().sort((a,b)=>a.localeCompare(b));const known=colleges.includes(selected);opts(collegeEl,[...colleges,'Other'],'Select college / institute',known?selected:(selected?'Other':''));collegeEl.disabled=!d;const other=!!selected&&!known;otherWrap.classList.toggle('hidden',!other);otherEl.required=other;otherEl.value=other?selected:''}stateEl.onchange=()=>{setDistricts();opts(collegeEl,[],'Select district first');collegeEl.disabled=true;otherWrap.classList.add('hidden');otherEl.required=false};districtEl.onchange=()=>setColleges();collegeEl.onchange=()=>{const other=collegeEl.value==='Other';otherWrap.classList.toggle('hidden',!other);otherEl.required=other;if(!other)otherEl.value=''};(async()=>{currentUser=await requireAuth();if(!currentUser)return;try{collegeDirectory=await loadCollegeDirectory();const r=await fetch('https://raw.githubusercontent.com/KTBsomen/Indian-state-district-json/main/india-states-districts-latest.json');stateData=await r.json();stateData.sort((a,b)=>a.state.localeCompare(b.state));}catch(e){stateData=[]}const {data,error}=await supabaseClient.from('student_profiles').select('full_name,email,mobile,state,district,college_name,created_at').eq('user_id',currentUser.id).single();if(error){message.textContent='Unable to load profile.';return}profile=data;name.value=data.full_name||'';email.value=data.email||currentUser.email||'';mobile.value=data.mobile||'';opts(stateEl,stateData.map(x=>x.state),'Select state',data.state||'');setDistricts(data.district||'');setColleges(data.college_name||'');if(data.created_at)registrationInfo.textContent='Registered on: '+new Date(data.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})})();profileForm.addEventListener('submit',async(e)=>{e.preventDefault();if(!currentUser)return;const collegeName=collegeEl.value==='Other'?otherEl.value.trim():collegeEl.value;if(!stateEl.value||!districtEl.value||!collegeName){message.textContent='Please complete State, District and College / Institute details.';return}message.textContent='Saving...';const {error}=await supabaseClient.from('student_profiles').update({full_name:name.value.trim(),mobile:mobile.value.trim(),state:stateEl.value,district:districtEl.value,college_name:collegeName,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);if(error){message.style.color='#b91c1c';message.textContent=error.message;return}message.style.color='#166534';message.textContent='Profile updated successfully.'});</script></body></html>
