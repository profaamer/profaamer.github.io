<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>My Profile | B.Com. Learning Portal</title><style>:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;--head:#111827;--success:#166534}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:22px 16px}.headin{max-width:760px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:15px}.header h1{margin:0;font-size:24px}.header p{margin:5px 0 0;color:#d1d5db}.back{color:#fff;text-decoration:none;border:1px solid #64748b;border-radius:8px;padding:9px 12px;font-weight:700;font-size:13px}.wrap{max-width:620px;margin:28px auto;padding:0 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}.card h2{margin-top:0}label{display:block;font-weight:700;font-size:14px;margin:15px 0 6px}input{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:8px;font-size:15px}input[readonly]{background:#f8fafc;color:#64748b}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.meta{font-size:13px;color:var(--muted);margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}.message{margin-top:14px;font-size:14px;line-height:1.5}.footer{text-align:center;padding:25px;color:var(--muted);font-size:13px}@media(max-width:600px){.row{grid-template-columns:1fr}.header h1{font-size:20px}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body><div class="header"><div class="headin"><div><h1>B.Com. Video Learning Portal</h1><p>My Profile</p></div><a class="back" href="dashboard.html">DASHBOARD</a></div></div><div class="wrap"><div class="card"><h2>Student Profile</h2><form id="profileForm"><label for="name">Full Name</label><input id="name" type="text" required minlength="2"><label for="email">Email Address</label><input id="email" type="email" readonly><label for="mobile">Mobile Number</label><input id="mobile" type="tel" required pattern="[0-9+() -]{7,20}"><button type="submit">SAVE CHANGES</button><div id="message" class="message"></div></form><div class="meta" id="registrationInfo"></div></div></div><div class="footer">© 2026 Dr. Mohammed Aamer • Educational Use</div><script>let currentUser=null;(async()=>{currentUser=await requireAuth();if(!currentUser)return;const {data,error}=await supabaseClient.from('student_profiles').select('full_name,email,mobile,created_at').eq('user_id',currentUser.id).single();if(error){document.getElementById('message').textContent='Unable to load profile.';return;}document.getElementById('name').value=data.full_name||'';document.getElementById('email').value=data.email||currentUser.email||'';document.getElementById('mobile').value=data.mobile||'';if(data.created_at){document.getElementById('registrationInfo').textContent='Registered on: '+new Date(data.created_at).toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'});}})();document.getElementById('profileForm').addEventListener('submit',async(e)=>{e.preventDefault();const m=document.getElementById('message');if(!currentUser)return;const full_name=document.getElementById('name').value.trim();const mobile=document.getElementById('mobile').value.trim();m.textContent='Saving...';const {error}=await supabaseClient.from('student_profiles').update({full_name,mobile,updated_at:new Date().toISOString()}).eq('user_id',currentUser.id);if(error){m.textContent=error.message;return;}m.style.color='#166534';m.textContent='Profile updated successfully.';});</script></body></html>
