<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Final Examination | Learning Portal</title><style>:root{--bg:#f4f6f9;--text:#1f2937;--muted:#6b7280;--line:#e5e7eb;--blue:#1d4ed8;--head:#111827;--green:#166534;--red:#b91c1c}*{box-sizing:border-box}body{font-family:Arial;margin:0;background:var(--bg);color:var(--text)}.header{background:var(--head);color:#fff;padding:26px 16px;text-align:center}.wrap{max-width:980px;margin:26px auto;padding:0 16px}.back{color:var(--blue);text-decoration:none;font-weight:700}.box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:22px;margin-top:16px}.spec{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{padding:13px;border:1px solid var(--line);border-radius:9px;background:#f8fafc}.item strong{display:block}.item span{font-size:13px;color:var(--muted)}.pass{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;padding:14px;margin-top:16px}.startbtn,.submitbtn{border:0;border-radius:8px;padding:12px 18px;font-weight:700;cursor:pointer;color:#fff}.startbtn{background:var(--blue);margin-top:16px}.submitbtn{background:var(--green)}.timerbar{position:sticky;top:0;z-index:10;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 15px;margin-top:16px;display:flex;justify-content:space-between}.timer{font-size:22px;font-weight:800}.timer.danger{color:var(--red)}.question{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}.option{display:block;padding:10px 11px;border:1px solid var(--line);border-radius:8px;margin-top:8px}.bottom{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0}.save{font-size:12px;color:var(--muted)}.result{background:#fff;border:1px solid var(--line);border-radius:12px;padding:24px;margin-top:16px;text-align:center}.big{font-size:32px;color:var(--blue);font-weight:800}.passed{color:var(--green);font-weight:800}.failed{color:var(--red);font-weight:800}.msg{margin-top:12px;color:var(--muted);font-size:13px}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}@media(max-width:600px){.spec{grid-template-columns:1fr}.timerbar,.bottom{flex-direction:column;align-items:flex-start}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js"></script></head><body style="visibility:hidden"><div class="header"><h1>📝 Final Examination</h1><p id="courseTitle">Loading...</p></div><div class="wrap"><a id="back" class="back" href="#">← Course Home</a><div id="intro" class="box">Loading...</div><div id="examArea"></div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const key=new URLSearchParams(location.search).get('course');let course=null,attemptId=null,questions=[],remaining=0,timerHandle=null,saveTimer=null,submitting=false;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function headers(){const {data:{session}}=await supabaseClient.auth.getSession();return {'Content-Type':'application/json','Authorization':'Bearer '+session.access_token,'apikey':SUPABASE_PUBLISHABLE_KEY}}async function init(){const u=await requireAuth();if(!u)return;if(!key){location.replace('my-courses.html');return}if(key==='direct-taxes-law-practice-1'){location.replace('direct-tax-final-exam.html');return}const [{data:en},{data:c}]=await Promise.all([supabaseClient.from('course_enrollments').select('status').eq('user_id',u.id).eq('course_key',key).maybeSingle(),supabaseClient.from('courses').select('*').eq('course_key',key).maybeSingle()]);if(!en||en.status!=='active'||!c){location.replace('course-info.html?course='+encodeURIComponent(key));return}course=c;courseTitle.textContent=c.title;back.href='course.html?course='+encodeURIComponent(key);renderIntro();document.body.style.visibility='visible';await resumeIfExisting()}function renderIntro(){const q=Number(course.final_exam_questions||course.ese_marks||60),marks=Number(course.ese_marks||q),mins=Number(course.final_exam_minutes||60),pass=Math.ceil(marks*Number(course.ese_pass_percent||40)/100);intro.innerHTML='<div class="spec"><div class="item"><strong>'+q+' Questions</strong><span>Randomly selected from the complete course question bank.</span></div><div class="item"><strong>'+marks+' Marks</strong><span>Configured end-semester examination marks.</span></div><div class="item"><strong>'+mins+' Minutes</strong><span>The timer continues even if the page is refreshed.</span></div><div class="item"><strong>One Official Attempt</strong><span>A submitted or expired examination cannot be restarted.</span></div></div><div class="pass"><strong>Passing Requirement:</strong> Minimum <strong>'+pass+'/'+marks+'</strong> ('+Number(course.ese_pass_percent||40)+'%) in ESE. CA and ESE must both be passed independently.</div><button id="startBtn" class="startbtn" onclick="startExam()">START FINAL EXAMINATION</button><div id="introMsg" class="msg"></div>'}async function startExam(){if(!confirm('Start your official Final Examination now?\n\nThe timer will begin immediately and only one official attempt is allowed.'))return;startBtn.disabled=true;introMsg.textContent='Preparing your examination...';try{const r=await fetch(SUPABASE_URL+'/functions/v1/final-exam-start',{method:'POST',headers:await headers(),body:JSON.stringify({course_key:key})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to start examination');if(d.completed){showResult(d);return}attemptId=d.attempt_id;questions=d.questions||[];remaining=d.remaining_seconds||0;intro.style.display='none';renderExam();startTimer()}catch(e){startBtn.disabled=false;introMsg.textContent=e.message}}function renderExam(){examArea.innerHTML='<div class="timerbar"><div><strong>Final Examination in Progress</strong><div id="progress" class="msg">'+questions.filter(q=>q.selected).length+' of '+questions.length+' answered</div></div><div id="timer" class="timer"></div></div>'+questions.map(q=>'<div class="question"><h3>Q'+q.number+'. '+esc(q.question_text)+'</h3>'+q.options.map(o=>'<label class="option"><input type="radio" name="q_'+q.question_id+'" value="'+o.key+'" '+(q.selected===o.key?'checked':'')+' onchange="answerChanged('+q.question_id+',\''+o.key+'\')"> '+esc(o.text)+'</label>').join('')+'</div>').join('')+'<div class="bottom"><div id="saveStatus" class="save">Answers are autosaved.</div><button class="submitbtn" onclick="submitExam(false)">SUBMIT FINAL EXAMINATION</button></div>';updateTimer()}function answerChanged(id,k){const q=questions.find(x=>x.question_id===id);if(q)q.selected=k;progress.textContent=questions.filter(x=>x.selected).length+' of '+questions.length+' answered';clearTimeout(saveTimer);saveStatus.textContent='Saving...';saveTimer=setTimeout(saveAnswers,500)}async function saveAnswers(){if(!attemptId||submitting)return;const a={};questions.forEach(q=>{if(q.selected)a[String(q.question_id)]=q.selected});try{const r=await fetch(SUPABASE_URL+'/functions/v1/final-exam-save',{method:'POST',headers:await headers(),body:JSON.stringify({attempt_id:attemptId,answers:a})});if(!r.ok)throw new Error('Save failed');saveStatus.textContent='Saved securely.'}catch(e){saveStatus.textContent='Save pending.'}}function startTimer(){clearInterval(timerHandle);timerHandle=setInterval(()=>{remaining=Math.max(0,remaining-1);updateTimer();if(!remaining){clearInterval(timerHandle);submitExam(true)}},1000)}function updateTimer(){const el=document.getElementById('timer');if(!el)return;const m=Math.floor(remaining/60),s=remaining%60;el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');el.classList.toggle('danger',remaining<=300)}async function submitExam(auto){if(submitting)return;if(!auto){const u=questions.filter(q=>!q.selected).length;if(!confirm('Submit your Final Examination?'+(u?'\n\n'+u+' question(s) are unanswered.':'')+'\n\nYou cannot change answers after submission.'))return}submitting=true;clearInterval(timerHandle);const a={};questions.forEach(q=>{if(q.selected)a[String(q.question_id)]=q.selected});try{const r=await fetch(SUPABASE_URL+'/functions/v1/final-exam-submit',{method:'POST',headers:await headers(),body:JSON.stringify({attempt_id:attemptId,answers:a})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to submit');showResult(d)}catch(e){submitting=false;alert(e.message)}}function showResult(d){clearInterval(timerHandle);intro.style.display='none';const score=Number(d.score||0),marks=Number(course.ese_marks||0),pass=score>=marks*Number(course.ese_pass_percent||40)/100;examArea.innerHTML='<div class="result"><h2>Final Examination Completed</h2><div class="big">'+score+' / '+marks+'</div><p>Correct Answers: '+Number(d.correct_count||0)+' / '+Number(course.final_exam_questions||questions.length||0)+'</p><p class="'+(pass?'passed':'failed')+'">ESE Status: '+(pass?'PASSED':'NOT PASSED')+'</p><p><a class="back" href="course-scorecard.html?course='+encodeURIComponent(key)+'">VIEW MY SCORECARD →</a></p></div>'}async function resumeIfExisting(){const u=(await supabaseClient.auth.getUser()).data.user;if(!u)return;const {data}=await supabaseClient.from('final_exam_attempts').select('status,score,correct_count').eq('user_id',u.id).eq('course_key',key).maybeSingle();if(data&&data.status!=='in_progress'){showResult(data);return}if(data?.status==='in_progress'){startBtn.textContent='RESUME FINAL EXAMINATION';introMsg.textContent='An official attempt is already in progress. The original timer is continuing.'}}init();</script></body></html>
