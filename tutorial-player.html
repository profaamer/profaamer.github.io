<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Watch E-Tutorial | Learning Portal</title><style>:root{--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#2563eb;--head:#111827}*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f4f6f9;color:var(--text);visibility:hidden}.header{background:linear-gradient(135deg,#111827,#1e293b);color:#fff;padding:24px 16px}.headin,.wrap{max-width:960px;margin:auto}.header h1{font-size:23px;margin:0}.header p{margin:7px 0 0;color:#d1d5db;font-size:13px}.wrap{padding:24px 16px}.back{display:inline-block;text-decoration:none;color:var(--accent);font-weight:700;margin-bottom:16px}.playerCard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(15,23,42,.06)}.playerCard h2{margin:0 0 8px;font-size:21px}.desc{color:var(--muted);font-size:13px;line-height:1.6;margin-bottom:16px}.video{width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden}.video iframe{width:100%;height:100%;border:0}.footer{text-align:center;padding:28px;color:var(--muted);font-size:13px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="auth.js?v=20260817-tutorial-player1"></script></head><body><div class="header"><div class="headin"><h1 id="courseName">E-Tutorial</h1><p>Video Learning Resource</p></div></div><div class="wrap"><a id="back" class="back">← E-Tutorial</a><div id="root" class="playerCard">Loading video...</div></div><div class="footer">© 2026 Dr. Mohammed Aamer Mohammed Akbar • Educational Use</div><script>const p=new URLSearchParams(location.search),key=p.get('course'),itemId=p.get('item');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function yt(url){try{const u=new URL(url);let id='';if(u.hostname.includes('youtu.be'))id=u.pathname.split('/').filter(Boolean)[0]||'';else if(u.hostname.includes('youtube.com'))id=u.searchParams.get('v')||u.pathname.match(/\/embed\/([^/?]+)/)?.[1]||u.pathname.match(/\/shorts\/([^/?]+)/)?.[1]||'';return id?`https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0`:''}catch(e){return''}}async function load(){const user=await requireAuth();if(!user)return;if(!key||!itemId){location.replace('my-courses.html');return}const {data:en}=await supabaseClient.from('course_enrollments').select('status').eq('user_id',user.id).eq('course_key',key).maybeSingle();if(!en||en.status!=='active'){location.replace(`course-info.html?course=${encodeURIComponent(key)}`);return}const [{data:c},{data:x}]=await Promise.all([supabaseClient.from('courses').select('title,is_published').eq('course_key',key).maybeSingle(),supabaseClient.from('course_content_items').select('*').eq('id',itemId).eq('course_key',key).eq('quadrant','tutorial').eq('is_active',true).maybeSingle()]);if(!c||!c.is_published||!x){root.innerHTML='This video is not available.';document.body.style.visibility='visible';return}courseName.textContent=c.title;back.href=`course-tutorial.html?course=${encodeURIComponent(key)}`;const embed=yt(x.resource_url);root.innerHTML=`<h2>${esc(x.title)}</h2>${x.description?`<div class="desc">${esc(x.description)}</div>`:''}${embed?`<div class="video"><iframe src="${embed}" title="${esc(x.title)}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`:'<div class="desc">Video link is unavailable or unsupported.</div>'}`;document.body.style.visibility='visible'}load();</script></body></html>
